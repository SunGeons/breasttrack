/* ตัวเลข + หน่วย */
function numUnit(o,kv,ku,units,presets,step=1,noneLabel){
  const wrap=el('div');
  if(presets&&presets.length){
    const ch=el('div','chips'); ch.style.marginBottom='8px';
    presets.forEach(([lab,val,un])=>{
      const b=el('button','chip sm'); b.type='button';
      if(String(o[kv])===String(val)&&(!un||o[ku]===un)&&!o.noSymptom) b.classList.add('on');
      b.textContent=lab;
      b.onclick=()=>{ o[kv]=String(val); if(un)o[ku]=un; if('noSymptom' in o)o.noSymptom=false;
        markDirty(); renderMain(); };
      ch.appendChild(b);
    });
    if(noneLabel&&('noSymptom' in o)){
      const b=el('button','chip sm'+(o.noSymptom?' on ok':'')); b.type='button'; b.textContent=noneLabel;
      b.onclick=()=>{ o.noSymptom=!o.noSymptom; if(o.noSymptom)o[kv]=''; markDirty(); renderMain(); };
      ch.appendChild(b);
    }
    wrap.appendChild(ch);
  }
  const nu=el('div','numunit'), st=el('div','stepper');
  const minus=el('button'); minus.type='button'; minus.textContent='−';
  const inp=el('input'); inp.type='number'; inp.value=o[kv]??''; inp.step=step; inp.min='0';
  inp.setAttribute('inputmode','decimal');
  const plus=el('button'); plus.type='button'; plus.textContent='+';
  const bump=(delta)=>{
    const n=(parseFloat(inp.value)||0)+delta;
    const val=(n<0?0:Math.round(n*100)/100).toString();
    inp.value=val; o[kv]=val; if('noSymptom' in o)o.noSymptom=false; markDirty();
  };
  minus.onclick=()=>bump(-step);
  plus.onclick=()=>bump(step);
  inp.oninput=()=>{ o[kv]=inp.value; if('noSymptom' in o&&inp.value)o.noSymptom=false; markDirty(); };
  st.appendChild(minus); st.appendChild(inp); st.appendChild(plus); nu.appendChild(st);
  if(units&&units.length){
    const s=el('select');
    units.forEach(u=>{ const op=el('option'); op.value=u; op.textContent=u; s.appendChild(op); });
    s.value=o[ku]||units[0]; s.onchange=()=>{o[ku]=s.value;markDirty();};
    nu.appendChild(s);
  }else if(units===null){
    const u=el('div'); u.style.cssText='display:flex;align-items:center;color:var(--ink2);font-weight:600';
    u.textContent='ซม.'; nu.appendChild(u);
  }
  wrap.appendChild(nu);
  return wrap;
}

      const mi=el('button'); mi.type='button'; mi.textContent='−';
      const ip=el('input'); ip.type='number'; ip.step='0.5'; ip.min='0';
      ip.setAttribute('inputmode','decimal'); ip.value=dist[code]??'';
      const pl=el('button'); pl.type='button'; pl.textContent='+';
      const bump=d=>{ const n=(parseFloat(ip.value)||0)+d; const val=String(n<0?0:Math.round(n*10)/10);
        ip.value=val; dist[code]=val; markDirty(); };
      mi.onclick=()=>bump(-0.5); pl.onclick=()=>bump(0.5);
      ip.oninput=()=>{dist[code]=ip.value;markDirty();};
      st.appendChild(mi); st.appendChild(ip); st.appendChild(pl); nu.appendChild(st);
      const un=el('div'); un.style.cssText='display:flex;align-items:center;color:var(--ink2);font-weight:600';
      un.textContent='ซม. จากหัวนม'; nu.appendChild(un);
      f.appendChild(nu); row.appendChild(f);
    }
    lw.appendChild(row);
  });
  w.appendChild(lw);
  return w;
}
/* กล่องข้อความ + ปุ่ม copy */
async function copyText(txt,label){
  try{ await navigator.clipboard.writeText(txt); toast('คัดลอก'+(label?' '+label:'')+'แล้ว'); }
  catch(e){
    const ta=el('textarea'); ta.value=txt; ta.style.cssText='position:fixed;opacity:0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); toast('คัดลอก'+(label?' '+label:'')+'แล้ว'); }
    catch(e2){ toast('คัดลอกไม่สำเร็จ','err'); }
    ta.remove();
  }
}

/* ═══════ v2.0 (B11) ═══════
   เดิม: ทุกการแตะ chip เรียก renderMain() → ล้าง #main แล้ววาดใหม่ทั้งหน้า
         ผลคือจอเด้งขึ้นบนสุดและโฟกัสหลุด โดยเฉพาะบนมือถือ
   ใหม่: 1) จำตำแหน่ง scroll ไว้แล้วคืนให้หลังวาดเสร็จ
         2) คืนโฟกัส + ตำแหน่งเคอร์เซอร์ให้ช่องที่กำลังพิมพ์อยู่
         3) กันการวาดซ้ำซ้อนภายในจังหวะเดียวกัน
         4) chips() สลับสีทันทีที่แตะ ไม่ต้องรอวาดใหม่                        */
let _rendering=false, _renderAgain=false, _gotoTop=false;
/** ให้การวาดรอบถัดไปเด้งขึ้นบนสุด (ใช้ตอนเปลี่ยนแท็บ/เปลี่ยนหน้า) */
function renderTop(){ _gotoTop=true; renderMain(); }
function focusPath(nd){
  /* ระบุตำแหน่งของช่องที่โฟกัสอยู่ด้วยลำดับใน #main เพื่อหากลับเจอหลังวาดใหม่ */
  const m=$('#main'); if(!m||!nd||!m.contains(nd)) return null;
  const all=[...m.querySelectorAll('input,textarea,select')];
  const i=all.indexOf(nd);
  return i<0?null:{i,tag:nd.tagName,ss:nd.selectionStart,se:nd.selectionEnd};
}
function restoreFocus(f){
  if(!f) return;
  const m=$('#main'); if(!m) return;
  const all=[...m.querySelectorAll('input,textarea,select')];
  const nd=all[f.i];
  if(!nd||nd.tagName!==f.tag) return;
  try{ nd.focus({preventScroll:true}); if(f.ss!=null) nd.setSelectionRange(f.ss,f.se); }catch(e){}
}
function renderMain(){
  const m=$('#main'); if(!m) return;
  if(_rendering){ _renderAgain=true; return; }   /* กันวาดซ้อนกันเอง */
  _rendering=true;
  const y=window.scrollY||document.documentElement.scrollTop||0;
  const f=focusPath(document.activeElement);
  const h=m.offsetHeight;
  m.style.minHeight=h?h+'px':'';               /* กันหน้ายุบชั่วขณะแล้ว scroll เพี้ยน */
  try{
    m.innerHTML='';
    if(S.view==='dash') m.appendChild(viewDash());
    else if(S.view==='patients') m.appendChild(viewPatients());
    else if(S.view==='patient') m.appendChild(viewPatient());
    else if(S.view==='stats') m.appendChild(viewStats());
    else if(S.view==='tools') m.appendChild(viewTools());
    paintSaveState();
  } finally {
    m.style.minHeight='';
    if(_gotoTop){ _gotoTop=false; window.scrollTo(0,0); }
    else { window.scrollTo(0,y); restoreFocus(f); }
    _rendering=false;
    if(_renderAgain){ _renderAgain=false; renderMain(); }
  }
}

/* แก้บั๊ก: คีย์บอร์ดมือถือทำให้เกิด resize → เดิมวาดหน้าใหม่ทำให้หลุดโฟกัส
   ตอนนี้จะวาดใหม่เฉพาะเมื่อ "ความกว้าง" ข้ามเส้นแบ่ง mobile/desktop จริงๆ เท่านั้น */
let _bp = window.innerWidth<=820 ? 'm' : 'd';
let _rt=null;
window.addEventListener('resize',()=>{
  const bp = window.innerWidth<=820 ? 'm' : 'd';
  if(bp===_bp) return;                 // คีย์บอร์ดเปิด/ปิด → ไม่ทำอะไร
  _bp=bp;
  clearTimeout(_rt);
  _rt=setTimeout(()=>{ if(store.user) renderMain(); },200);
});

/* ───────── ⑮ รายชื่อผู้ป่วย ───────── */
function statusTone(s){
  if(s==='ไม่พบการกลับเป็นซ้ำ') return 'ok';
  if(s==='ผู้ป่วยใหม่') return 'n';
  if(s==='อยู่ระหว่างขั้นตอนการรักษา') return 'b';
  if(s==='สงสัยการกลับเป็นซ้ำ') return 'warn';
  if(CLOSED.includes(s)) return 'n';
  return 'dg';
}
function viewPatients(){
  const root=el('div');
  const bar=el('div','card'); const bb=el('div','body'); bar.appendChild(bb);
  bb.appendChild(field('ค้นหา',inputEl('search',S.q,v=>{S.q=v;refresh();},{placeholder:'ค้นหา HN หรือ ชื่อ-สกุล'})));
  const g=el('div','grid'); g.style.marginTop='11px';
  g.appendChild(field('สถานะ',selectEl(OPT.status,S.fStatus,v=>{S.fStatus=v;refresh();})));
  g.appendChild(field('การเตือน',selectEl(['ต้องดำเนินการด่วน','ใกล้ถึงกำหนด','ไม่มีรายการค้าง'],S.fAlert,v=>{S.fAlert=v;refresh();})));
  bb.appendChild(g);
  const add=el('button','btn primary'); add.textContent='+ เพิ่มผู้ป่วยใหม่';
  add.style.cssText='margin-top:12px;width:100%';
  add.onclick=()=>{ const p=blankPatient(); S.patients.push(p); openPatient(p.id); };
  bb.appendChild(add);
  root.appendChild(bar);

  const holder=el('div','card'); const hb=el('div','body'); hb.style.padding='0';
  holder.appendChild(hb); root.appendChild(holder);

  function filtered(){
    const q=S.q.trim().toLowerCase();
    return S.patients.filter(p=>{
      if(q&&!((p.hn||'').toLowerCase().includes(q)||(PRIV.storeNames?(p.name||'').toLowerCase():'').includes(q))) return false;
      if(S.fStatus&&statusOf(p)!==S.fStatus) return false;
      if(S.fAlert){
        const a=alertsFor(p);
        if(S.fAlert==='ต้องดำเนินการด่วน'&&!a.some(x=>x.lv==='dg')) return false;
        if(S.fAlert==='ใกล้ถึงกำหนด'&&!a.some(x=>x.lv==='warn')) return false;
        if(S.fAlert==='ไม่มีรายการค้าง'&&a.some(x=>x.lv==='dg'||x.lv==='warn')) return false;
      }
      return true;
    }).sort((a,b)=>(a.hn||'zz').localeCompare(b.hn||'zz'));
  }
  function refresh(){
    const list=filtered(); hb.innerHTML='';
    if(!list.length){ hb.innerHTML='<div style="padding:24px;color:var(--ink3)">ไม่พบข้อมูลผู้ป่วย</div>'; return; }
    const cards=el('div','plist only-mobile');
    list.forEach(p=>{
      const a=alertsFor(p), lv=worstLevel(a), stg=currentStage(p);
      const c=el('div','pcard');
      c.innerHTML=`<div class="r1"><span class="nm">${esc(patLabel(p))}</span></div>
        <div class="r2">${ageText(p.dob)}${p.dxDate?` · วินิจฉัย ${fmtDate(p.dxDate)}`:''}${(p.hx.locations||[]).length?` · ${esc(p.hx.locations.join(', '))}`:''}</div>
        <div class="r2">${p.nextAppt?`นัด ${fmtDate(p.nextAppt)}`:'ยังไม่มีนัด'}</div>
        <div class="r3">
          ${stg?`<span class="badge b">${esc(stg.prefix)}Stage ${esc(stg.v)}</span>`:''}
          <span class="badge ${statusTone(statusOf(p))}">${esc(statusOf(p))}</span>
          ${lv==='ok'?'':`<span class="badge ${lv==='dg'?'dg':lv==='warn'?'warn':'n'}">${a.length} เตือน</span>`}
        </div>`;
      c.onclick=()=>openPatient(p.id); cards.appendChild(c);
    });
    hb.appendChild(cards);

    const tw=el('div','tablewrap only-desktop'), t=el('table');
    t.innerHTML=`<thead><tr><th>HN</th><th>ชื่อ-สกุล</th><th>อายุ</th><th>วันวินิจฉัย</th>
      <th>Stage</th><th>ตำแหน่ง</th><th>นัดถัดไป</th><th>สถานะ</th><th>เตือน</th></tr></thead>`;
    const tb=el('tbody');
    list.forEach(p=>{
      const a=alertsFor(p), lv=worstLevel(a), stg=currentStage(p);
      const tr=el('tr');
      tr.innerHTML=`<td><strong>${esc(p.hn||'-')}</strong></td><td>${esc(PRIV.storeNames?(p.name||'—'):'—')}</td>
        <td>${ageText(p.dob)}</td><td>${fmtDate(p.dxDate)}</td>
        <td>${stg?`<span class="badge b">${esc(stg.prefix)}${esc(stg.v)}</span>`:'—'}</td>
        <td style="font-size:13px">${(p.hx.locations||[]).length?esc(p.hx.locations.join(', ')):'—'}</td>
        <td>${fmtDate(p.nextAppt)}</td>
        <td><span class="badge ${statusTone(statusOf(p))}">${esc(statusOf(p))}</span></td>
        <td>${lv==='ok'?'<span class="badge ok">ปกติ</span>':`<span class="badge ${lv==='dg'?'dg':lv==='warn'?'warn':'n'}">${a.length}</span>`}</td>`;
      tr.onclick=()=>openPatient(p.id); tb.appendChild(tr);
    });
    t.appendChild(tb); tw.appendChild(t); hb.appendChild(tw);
  }
  refresh();
  return root;
}

const TAB_GROUP={general:'chart',hx:'chart',img:'chart',path:'chart',otherimg:'chart',
  tx:'chart',gyn:'chart',stage:'summary',visits:'summary',note:'today',todo:'todo'};
/** นำทางไปแท็บ/หมวดโดยใช้กุญแจแท็บรุ่นก่อน — คงลิงก์เดิมทุกจุดให้ใช้งานได้ */

  if(dup.length){

async function backToList(){
  if(S.dirty) await autoSave();
  S.view='patients'; S.current=null; S.editVisit=null; S.dirty=false; S.savedAt=null; render();

async function delPatient(p){
  if(!confirm(`ลบข้อมูลผู้ป่วย ${patLabel(p)} ทั้งหมด?`)) return;
  await store.remove(p.id); await store.audit('ลบผู้ป่วย',p.hn,p.hn);
  S.patients=S.patients.filter(x=>x.id!==p.id);
  S.view='patients'; S.current=null; S.dirty=false; render();
}

/** ตรวจวันนี้ — จุดเริ่มต้นของทุกการเข้าหน้าเคส (เดิมคือแท็บ Note) */
function tabToday(p){ return tabNote(p); }

/** สรุป — การเตือน + stage/TNM + ตารางติดตาม/นัด + การกลับเป็นซ้ำ + timeline
    (รวมเนื้อหาเดิมของแท็บ Stage และแท็บ F/U ไว้ที่เดียว ไม่ต้องสลับแท็บอ่าน) */
function tabSummaryV2(p){

/** สรุปบรรทัดเดียวต่อหมวด — แสดงบนหัวการ์ดในแท็บ "แฟ้มข้อมูล" ตอนยุบอยู่ */
function chartOneLiner(key,p){
  switch(key){
    case 'general': {
      const ag=ageAt(p.dob);
      return `${p.sex} · อายุ ${ag?ag.text:'—'} · ${(p.comorbid||[]).join(', ')||'ไม่มีโรคประจำตัว'}`;
    }
    case 'hx': {
      const loc=(p.hx.locations||[]).join(', ')||'ยังไม่ระบุตำแหน่ง';
      return loc+(p.hx.clinSize?` · ${p.hx.clinSize} ซม.`:'');
    }
    case 'path': {
      const h=bestHistology(p); return h?h.v:'ยังไม่มีผลชิ้นเนื้อ';
    }
    case 'img': {
      const lm=lastMammoDate(p); return lm?`ล่าสุด ${fmtDate(lm)}`:'ยังไม่มีผลภาพวินิจฉัยเต้านม';
    }
    case 'otherimg': {
      const n=(p.otherImg||[]).length; return n?`${n} รายการ`:'ยังไม่มีการตรวจภาพอื่น';
    }
    case 'tx': {
      return surgeryText(p)||'ยังไม่มีข้อมูลการผ่าตัด';
    }
    case 'gyn': {
      const lg=lastGynDate(p), lb=lastBoneDate(p), parts=[];
      if(lg) parts.push('นรีเวช '+fmtDate(lg));
      if(lb) parts.push('DEXA '+fmtDate(lb));
      return parts.length?parts.join(' · '):'ยังไม่มีบันทึกนรีเวช/กระดูก';
    }
  }
  return '';
}
/** หมวดหนึ่งใน accordion ของแท็บ "แฟ้มข้อมูล" — แตะหัวข้อเพื่อกาง/ยุบ */
function accSection(p,key,label,contentFn,defaultOpen){
  S.chartOpen=S.chartOpen||{};
  const open=(key in S.chartOpen)?S.chartOpen[key]:!!defaultOpen;
  const box=el('div'); box.style.cssText='border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden';
  const head=el('button'); head.type='button';
  head.style.cssText='width:100%;text-align:left;display:flex;justify-content:space-between;align-items:center;'+
    'gap:10px;padding:13px 14px;background:none;border:none;cursor:pointer;font:inherit;color:inherit';
  head.innerHTML=`<div style="flex:1;min-width:0">
      <div style="font-weight:650;font-size:14.5px">${esc(label)}</div>
      <div class="hint" style="margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(chartOneLiner(key,p))}</div>
    </div>
    <div style="font-size:19px;flex-shrink:0;color:var(--ink3)">${open?'−':'+'}</div>`;
  head.onclick=()=>{ S.chartOpen[key]=!open; renderMain(); };
  box.appendChild(head);
  if(open){
    const body=el('div'); body.style.cssText='padding:0 14px 14px';
    body.appendChild(contentFn());
    box.appendChild(body);
  }
  return box;
}
/** แฟ้มข้อมูล — accordion รวม 7 แท็บเดิม (ยุบไว้ ไม่ต้องเลื่อนหา) */
function tabChart(p){
  const w=el('div');
  const order=[
    ['general','ข้อมูลทั่วไป',()=>tabGeneral(p),true],
    ['hx','ประวัติและตรวจร่างกาย (Hx / PE)',()=>tabHx(p),false],
    ['path','ผลชิ้นเนื้อ (Pathology)',()=>tabPath(p),false],
    ['img','ภาพวินิจฉัยเต้านม (MMG / US / MRI)',()=>tabImg(p),false],
    ['otherimg','ภาพวินิจฉัยอื่น (CT / Bone scan)',()=>tabOtherImg(p),false],
    ['tx','การรักษา',()=>tabTx(p),false],
    ['gyn','นรีเวช / กระดูก',()=>tabGyn(p),false]
  ];
  order.forEach(([key,label,fn,def])=>w.appendChild(accSection(p,key,label,fn,def)));
  return w;
}

/** v2.0 — DFS/OS จากข้อมูลที่มี */
function survivalOf(p){
  const out={dfs:null,os:null};
  const start=p.tx.breastSurgery.date||p.dxDate;
  if(!start) return out;
  const rec=[...(p.recurrences||[])].filter(r=>r.date).sort((a,b)=>(a.date||'').localeCompare(b.date||''))[0];
  const oc=p.outcome||{};
  const endD=rec?rec.date:(oc.deathDate||oc.lastContact||lastVisit(p)?.date||todayISO());
  const mo=monthsBetween(start,endD);
  if(mo!==null) out.dfs={months:mo,text:`${Math.floor(mo/12)} ปี ${mo%12} เดือน`,
    why:rec?`ถึงวันพบการกลับเป็นซ้ำ ${fmtDate(rec.date)}`:`ยังไม่พบการกลับเป็นซ้ำ (นับถึง ${fmtDate(endD)})`};
  const endO=oc.deathDate||oc.lastContact||lastVisit(p)?.date||todayISO();
  const mo2=monthsBetween(start,endO);
  if(mo2!==null) out.os={months:mo2,text:`${Math.floor(mo2/12)} ปี ${mo2%12} เดือน`,
    why:oc.deathDate?`ถึงวันเสียชีวิต ${fmtDate(oc.deathDate)}`:`ยังมีชีวิต (นับถึง ${fmtDate(endO)})`};
  return out;
}

    ib.appendChild(a);
  }
  w.appendChild(card('การลุกลามผิวหนัง / ผนังทรวงอก (ตัดสิน T4)',ib));

  /* ---- ต่อมน้ำเหลืองจากการตรวจ/ภาพ → ต้นทางของ cN ---- */
  const nb=el('div');
  nb.appendChild(el('div','hint',
    'ผลการคลำต่อมน้ำเหลือง — ระบบใช้ข้อมูลนี้คำนวณ cN อัตโนมัติ'));
  const nw=el('div'); nw.style.marginTop='8px';
  nw.appendChild(chips(OPT.clinNode,h.clinNodes,x=>{
    if(x==='ไม่พบต่อมน้ำเหลืองโต') h.clinNodes=['ไม่พบต่อมน้ำเหลืองโต'];
    else{
      h.clinNodes=h.clinNodes.filter(y=>y!=='ไม่พบต่อมน้ำเหลืองโต');
      h.clinNodes.includes(x)?h.clinNodes=h.clinNodes.filter(y=>y!==x):h.clinNodes.push(x);
    }
    markDirty(); renderMain();
  }));
  nb.appendChild(nw);
  const acn=autoCN(p);
  const nbx=el('div','alert '+(acn.v?'info':'warn')); nbx.style.marginTop='12px';
  nbx.innerHTML=acn.v
    ? `<strong>→ cN = ${esc(acn.v)}</strong><br><span style="font-size:12.5px">${esc(acn.why)}</span>`
    : `ยังคำนวณ cN ไม่ได้ — ${esc(acn.need||'')}`;
  nb.appendChild(nbx);
  w.appendChild(card('ต่อมน้ำเหลืองจากการตรวจร่างกาย (ตัดสิน cN)',nb));
  return w;
}

/* ---- แท็บ 3: ผลชิ้นเนื้อ ---- */
function pathEditor(p,bx,compact){
  const box=el('div','sub');

  h.innerHTML=`<span class="badge b">${esc(bx.kind)}</span>
    <span class="badge n">${fmtDate(bx.date)}</span>
    ${bx.histology?`<span class="badge ${tone}">${esc(bx.histology)}</span>`:'<span class="badge warn">รอผล</span>'}`;
  const del=el('button','btn sm danger'); del.textContent='ลบ'; del.style.marginLeft='auto';
  del.onclick=()=>{ if(confirm('ลบบันทึกผลชิ้นเนื้อนี้?')){
    p.paths=p.paths.filter(x=>x.id!==bx.id); markDirty(); renderMain(); } };

  const gs=[ field('วันที่ทำ',inputElLazy('date',bx.date,v=>{bx.date=v;})),

    field('วันที่ได้รับผล',inputElLazy('date',bx.resultDate,v=>{bx.resultDate=v;})),
    field('ระยะเวลารอผล',calcBox((()=>{const d=daysBetween(bx.date,bx.resultDate);
      return d===null?'—':`${d} วัน`;})())) ];
  if(bx.kind==='CNB') gs.splice(2,0,field('วิธีทำ',selectEl(OPT.cnbMethod,bx.method,v=>{bx.method=v;})));
  box.appendChild(grid(gs));

  const lw=el('div'); lw.style.marginTop='12px';

  um.onclick=()=>{bx.locations=[...(p.hx.locations||[])];markDirty();renderMain();};
  lw.appendChild(um);
  lw.appendChild(clockPair(bx.locations,c=>{
    bx.locations.includes(c)?bx.locations=bx.locations.filter(x=>x!==c):bx.locations.push(c);

  if(bx.locations.length) lw.appendChild(el('div','hint','เลือกไว้: '+esc(locListText(bx.locations))));

  box.appendChild(sect('ผลชิ้นเนื้อ'));

    {multi:false,sm:true}));

  const g2=el('div','grid'); g2.style.marginTop='12px';
  [field('Grade',selectEl(OPT.grade,bx.grade,v=>{bx.grade=v;})),
   field('ER',selectEl(OPT.receptor,bx.er,v=>{bx.er=v;renderMain();})),
   field('PR',selectEl(OPT.receptor,bx.pr,v=>{bx.pr=v;renderMain();})),
   field('HER2',selectEl(OPT.her2,bx.her2,v=>{bx.her2=v;renderMain();})),
   field('Ki-67 ต่ำสุด (%)',inputElLazy('number',bx.ki67Low,v=>{bx.ki67Low=v;if(!bx.ki67High)bx.ki67High=v;
     bx.ki67=(bx.ki67Low&&bx.ki67High&&bx.ki67Low!==bx.ki67High)?`${bx.ki67Low}-${bx.ki67High}`:(bx.ki67Low||'');},
     {step:'1',min:'0',max:'100',inputmode:'numeric'}),'ถ้าเป็นค่าเดียวใส่ช่องนี้ช่องเดียว'),
   field('Ki-67 สูงสุด (%)',inputElLazy('number',bx.ki67High,v=>{bx.ki67High=v;
     bx.ki67=(bx.ki67Low&&bx.ki67High&&bx.ki67Low!==bx.ki67High)?`${bx.ki67Low}-${bx.ki67High}`:(bx.ki67Low||'');},
     {step:'1',min:'0',max:'100',inputmode:'numeric'}),'ใส่เฉพาะเมื่อพยาธิรายงานเป็นช่วง'),
   field('Path No.',inputEl('text',bx.pathNo,v=>{bx.pathNo=v;})),
   field('ที่มาของข้อมูล',selectEl(OPT.srcOf,bx.src,v=>{bx.src=v;markDirty();renderMain();},false))
  ].forEach(x=>g2.appendChild(x));
  box.appendChild(g2);
  if(bx.ki67&&!bx.ki67Low)
    box.appendChild(el('div','alert warn','Ki-67 เดิมบันทึกไว้เป็น "'+esc(bx.ki67)+'" — กรุณาใส่เป็นตัวเลขในช่องด้านบน เพื่อให้ใช้คำนวณต่อได้'));
  if(bx.src&&bx.src!=='ในโรงพยาบาล'&&bx.src!=='ไม่ระบุ')
    box.appendChild(el('div','hint','ข้อมูลนี้จะถูกกำกับที่มาในรายงานว่า "'+esc(bx.src)+'"'));

  /* เฉพาะชิ้นเนื้อที่ตัดออกทั้งก้อน → เป็นต้นทางของ pT/pN */
  if(bx.kind!=='CNB'){
    box.appendChild(sect('ขนาดและขอบเขต (ต้นทางของ pT)'));
    box.appendChild(grid([
      field('ขนาดจาก pathology (ซม.)',inputElLazy('number',bx.pathSize,v=>{bx.pathSize=v;},
        {step:'0.1',min:'0',inputmode:'decimal'}),'ระบบใช้ค่านี้คำนวณ pT ให้อัตโนมัติ'),
      field('ขอบชิ้นเนื้อ',selectEl(OPT.marginInk,bx.marginInk,v=>{bx.marginInk=v;markDirty();renderMain();},false),
        'DCIS ใช้เกณฑ์ 2 มม. · invasive ใช้ "ไม่มีเซลล์มะเร็งที่ขอบ"'),
      field('ระยะขอบที่ใกล้ที่สุด (มม.)',inputElLazy('number',bx.marginMm,v=>{bx.marginMm=v;},
        {step:'0.1',min:'0',inputmode:'decimal'}),'ใส่ตัวเลขจากรายงานพยาธิ'),
      field('LVI',selectEl(OPT.lvi,bx.lvi,v=>{bx.lvi=v;markDirty();},false))
    ]));
    {
      const me=marginEval(p,bx);
      if(bx.marginLegacy&&!bx.marginMm){
        const lg=el('div','alert warn'); lg.style.marginTop='10px';
        lg.innerHTML=`<strong>ข้อมูลรุ่นเก่า</strong> — เดิมบันทึกว่า "ขอบใกล้ ${esc(bx.marginLegacy)}" แต่ไม่มีตัวเลข
          <br><span style="font-size:12.5px">กรุณาเปิดรายงานพยาธิแล้วใส่ระยะขอบเป็นตัวเลข ระบบจะตีความให้เองตาม histology</span>`;
        box.appendChild(lg);
      }
      if(me.v){
        const a=el('div','alert '+(me.lv==='dg'?'dg':me.lv==='warn'?'warn':me.lv==='ok'?'ok':'info'));
        a.style.marginTop='10px';
        a.innerHTML=`<strong>→ ${esc(me.v)}</strong> <span style="font-size:12.5px">(${esc(me.why)})</span>`;
        box.appendChild(a);
      }
    }
    if(bx.pathSize){
      const t=suggestT(bx.pathSize);
      if(t){ const a=el('div','alert info'); a.style.marginTop='10px';
        a.innerHTML=`<strong>→ ${esc(p.stage.pPrefix)}T = ${esc(t)}</strong>
          <span style="font-size:12.5px"> (จากขนาด ${esc(bx.pathSize)} ซม.)</span>`;
        box.appendChild(a); }
    }

    box.appendChild(sect('ต่อมน้ำเหลือง (ต้นทางของ pN)'));
    box.appendChild(grid([
      field('จำนวนต่อมที่ตรวจ',inputElLazy('number',bx.nodesTotal,v=>{bx.nodesTotal=v;},
        {min:'0',inputmode:'numeric'})),
      field('จำนวนต่อมที่พบมะเร็ง',inputElLazy('number',bx.nodesPos,v=>{bx.nodesPos=v;},
        {min:'0',inputmode:'numeric'})),
      field('Extranodal extension',selectEl(OPT.ene,bx.ene,v=>{bx.ene=v;markDirty();},false))
    ]));
    const ms=el('div'); ms.style.marginTop='12px';
    ms.appendChild(el('div','hint','ขนาด metastasis ที่ใหญ่ที่สุดในต่อมน้ำเหลือง — ใช้แยก ITC / micro / macro'));
    const msw=el('div'); msw.style.marginTop='7px';
    msw.appendChild(chips(OPT.metSize,bx.metSize,v=>{bx.metSize=v;markDirty();renderMain();},{multi:false,sm:true}));
    ms.appendChild(msw);
    box.appendChild(ms);

    const imw=el('div'); imw.style.marginTop='12px';
    imw.appendChild(el('div','hint','ต่อมน้ำเหลือง internal mammary'));
    const imc=el('div'); imc.style.marginTop='7px';
    imc.appendChild(chips(OPT.imNode,bx.imNode,v=>{bx.imNode=v;markDirty();renderMain();},{multi:false,sm:true}));
    imw.appendChild(imc);
    box.appendChild(imw);

    const otw=el('div','chips'); otw.style.marginTop='12px';
    [['supraclav','พบที่ต่อม supraclavicular'],['infraclav','พบที่ต่อม infraclavicular (level III)']]
    .forEach(([k,lab])=>{
      const b2=el('button','chip sm'+(bx[k]?' on dg':'')); b2.type='button'; b2.textContent=lab;
      b2.onclick=()=>{bx[k]=!bx[k];markDirty();renderMain();};
      otw.appendChild(b2);
    });
    box.appendChild(otw);

    /* แสดง pN ที่คำนวณได้จากชิ้นเนื้อนี้ */
    const apn=autoPN(p);
    if(apn.v||apn.need){
      const a=el('div','alert '+(apn.v?'info':'warn')); a.style.marginTop='12px';
      a.innerHTML=apn.v
        ? `<strong>→ ${esc(p.stage.pPrefix)}N = ${esc(apn.v)}${esc(nodeSuffix(p))}</strong><br>
           <span style="font-size:12.5px">${esc(apn.why)}</span>`
        : `ยังคำนวณ ${esc(p.stage.pPrefix)}N ไม่ได้ — ${esc(apn.need)}`;
      box.appendChild(a);
    }
  }
  const n=el('div'); n.style.marginTop='12px';
  n.appendChild(field('บันทึกเพิ่มเติม',inputEl('text',bx.note,v=>{bx.note=v;})));
  box.appendChild(n);
  return box;
}
function tabPath(p){
  const w=el('div'), bb=el('div');
  const list=sortedPaths(p);
  if(!list.length) bb.appendChild(el('div','hint','ยังไม่มีบันทึกผลชิ้นเนื้อ'));
  list.forEach(bx=>bb.appendChild(pathEditor(p,bx)));
  const row=el('div','btnrow');
  OPT.pathKind.forEach(k=>{
    const b=el('button','btn'+(k==='CNB'?' primary':'')); b.textContent='+ '+k;
    b.onclick=()=>{
      const np=blankPath(k,p);
      if(k==='Definitive surgery'&&p.tx.breastSurgery.date) np.date=p.tx.breastSurgery.date;
      p.paths.push(np); markDirty(); renderMain();
    };
    row.appendChild(b);
  });
  bb.appendChild(row);
  w.appendChild(card('ผลชิ้นเนื้อ (CNB / Excisional biopsy / Definitive surgery)',bb));

  /* สรุปค่าที่ระบบใช้อ้างอิง */
  const sb=el('div');
  const hh=bestHistology(p), gg=bestGrade(p), bio=bestBio(p), bs=bestSize(p), ns=nodeSummary(p);
  const rows=[
    ['Histology',hh?`${hh.v} — จาก ${hh.src.kind} (${fmtDate(hh.src.date)})`:'—'],
    ['Grade',gg?`${gg.v} — จาก ${gg.src.kind}`:'—'],
    ['ขนาดก้อนอ้างอิง',bs?`${bs.v} ซม. — จาก${bs.src}`:'—'],
    ['ER / PR',`${bio.er?.v||'—'} / ${bio.pr?.v||'—'}`],
    ['HER2 / Ki-67',`${bio.her2?.v||'—'} / ${bio.ki67?.v?fmtKi67(bio.ki67.v):'—'}`],
    ['Molecular subtype',subtype(bio)||'—'],
    ['ต่อมน้ำเหลือง',ns?`พบมะเร็ง ${ns.pos}/${ns.total} · ENE ${ns.ene}`:'—']
  ];
  const t=el('table');
  t.innerHTML='<tbody>'+rows.map(([k,v])=>
    `<tr style="cursor:default"><th style="width:170px">${esc(k)}</th><td>${esc(v)}</td></tr>`).join('')+'</tbody>';
  sb.appendChild(t);
  sb.appendChild(el('div','hint','ระบบเลือกค่าที่น่าเชื่อถือที่สุดให้อัตโนมัติ: Definitive surgery › Excisional biopsy › CNB'));
  w.appendChild(card('ค่าที่ระบบใช้อ้างอิง (คำนวณอัตโนมัติ)',sb));
  return w;
}

/* ---- แท็บ 4: ภาพวินิจฉัย ---- */
function mammoEditor(p,m){
  const box=el('div','sub');
  const bi=m.birads||'';
  const tone=/^(4|5|6)/.test(bi)?'dg':/^3/.test(bi)?'warn':bi?'ok':'n';
  const h=el('div','h');
  h.innerHTML=`<span class="badge b">${fmtDate(m.date)}</span><span class="t">${esc(m.modality||'-')}</span>
    ${bi?`<span class="badge ${tone}">BI-RADS ${esc(bi)}</span>`:''}`;
  const del=el('button','btn sm danger'); del.textContent='ลบ'; del.style.marginLeft='auto';
  del.onclick=()=>{ if(confirm('ลบบันทึกนี้?')){p.mammos=p.mammos.filter(x=>x.id!==m.id);
    markDirty();renderMain();} };
  h.appendChild(del); box.appendChild(h);

  box.appendChild(grid([
    field('วันที่ตรวจ',inputElLazy('date',m.date,v=>{m.date=v;})),
    field('อายุ ณ วันตรวจ',calcBox(ageText(p.dob,m.date))),
    field('ช่วงเวลา',selectEl(OPT.mmPhase,m.phase,v=>{m.phase=v;renderMain();},false)),
    field('ชนิดการตรวจ',selectEl(OPT.mmModality,m.modality,v=>{m.modality=v;},false))
  ]));
  /* ผูกกับ staging */
  const opd=p.tx.breastSurgery.date;
  const preOp=!opd||(m.date&&m.date<=opd);
  const note=el('div','alert '+(preOp?'info':'ok')); note.style.marginTop='10px';
  note.innerHTML=preOp
    ? 'ผลภาพนี้ทำ<strong>ก่อนผ่าตัด</strong> — ใช้ประกอบการกำหนด <strong>cTNM / cStage</strong>'
    : 'ผลภาพนี้ทำ<strong>หลังผ่าตัด</strong> — เป็นการติดตาม ระยะโรคอ้างอิงตาม <strong>'+esc(p.stage.pPrefix)+'TNM</strong> ที่บันทึกไว้';
  box.appendChild(note);

  box.appendChild(sect('BI-RADS'));
  box.appendChild(chips(OPT.birads,m.birads,v=>{m.birads=(m.birads===v?'':v);renderMain();},{multi:false,sm:true}));
  box.appendChild(sect('ข้างที่ผิดปกติ'));
  box.appendChild(chips(OPT.mmSide,m.side,v=>{m.side=v;renderMain();},{multi:false,sm:true}));
  if(m.side&&m.side!=='ไม่พบความผิดปกติ'){
    const lw=el('div'); lw.style.marginTop='12px';
    lw.appendChild(el('div','hint','ตำแหน่งที่พบ'));
    lw.appendChild(clockPair(m.locations,c=>{
      m.locations.includes(c)?m.locations=m.locations.filter(x=>x!==c):m.locations.push(c);
      renderMain();
    },p.hx.locations));
    box.appendChild(lw);
  }
  box.appendChild(sect('ลักษณะที่พบ'));
  box.appendChild(chips(OPT.mmFinding,m.findings,v=>{
    m.findings.includes(v)?m.findings=m.findings.filter(x=>x!==v):m.findings.push(v); renderMain();
  },{sm:true}));
  const g3=el('div','grid'); g3.style.marginTop='12px';
  g3.appendChild(field('ขนาดรอยโรคจากภาพ (ซม.)',inputElLazy('number',m.sizeCm,v=>{m.sizeCm=v;},
    {step:'0.1',min:'0',inputmode:'decimal'})));
  g3.appendChild(field('Breast density',selectEl(OPT.density,m.density,v=>{m.density=v;})));
  box.appendChild(g3);
  const im=el('div'); im.style.marginTop='12px';
  im.appendChild(field('สรุปผล / คำแนะนำ',inputEl('text',m.impression,v=>{m.impression=v;})));
  box.appendChild(im);
  return box;
}
function tabImg(p){
  const w=el('div'), mb=el('div');
  const ml=[...(p.mammos||[])].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  if(!ml.length) mb.appendChild(el('div','hint','ยังไม่มีบันทึกผลภาพวินิจฉัย'));
  ml.forEach(m=>mb.appendChild(mammoEditor(p,m)));
  const add=el('button','btn primary'); add.textContent='+ เพิ่มผลภาพวินิจฉัย';
  add.onclick=()=>{
    const nm=blankMammo();
    const opd=p.tx.breastSurgery.date;
    if(!opd) nm.phase=(p.paths||[]).length?'ก่อนผ่าตัด (staging)':'ก่อนวินิจฉัย (diagnostic)';
    p.mammos.push(nm); markDirty(); renderMain();
  };
  mb.appendChild(add);
  const lm=lastMammoDate(p);
  if(lm){
    const inf=el('div','alert info'); inf.style.marginTop='12px';
    inf.textContent=`ครั้งล่าสุด ${fmtDate(lm)} — ครบกำหนดตรวจถัดไป ${fmtDate(addMonths(lm,12))} (NCCN: ทุก 12 เดือน)`;
    mb.appendChild(inf);
  }
  w.appendChild(card('ผลภาพวินิจฉัย (Mammogram / Ultrasound / MRI)',mb));
  return w;
}

/* ---- แท็บ 5: ระยะโรค & ICD ---- */
/** การ์ดแสดงค่าที่คำนวณได้ พร้อมที่มาและปุ่มไปแก้ต้นทาง */
function autoField(label,res,tabKey,tabLabel){
  const d=el('div','sub');
  const h=el('div','h');
  h.innerHTML=`<span class="t">${esc(label)}</span>`+
    (res.v?`<span class="badge ${res.manual?'warn':'b'}">${esc(res.v)}</span>`:'<span class="badge warn">ยังไม่มีข้อมูล</span>')+
    (res.manual?'<span class="badge warn">กำหนดเอง</span>':res.v?'<span class="badge ok">อัตโนมัติ</span>':'');
  d.appendChild(h);
  const why=el('div','hint');
  why.textContent=res.v?('ที่มา: '+res.why):('ต้องการ: '+(res.need||'ข้อมูลเพิ่มเติม'));
  d.appendChild(why);
  if(tabKey&&!res.manual){
    const go=el('button','btn sm'); go.style.marginTop='9px';
    go.textContent=`ไปแก้ที่ ${tabLabel}`;
    go.onclick=()=>{ gotoOldTab(tabKey); };
    d.appendChild(go);
  }
  return d;
}

    box.appendChild(a);
    if(!already){
      const mk=el('button','btn sm danger'); mk.style.marginTop='9px';

}

  return w;

function boneEditor(p,x){
  const box=el('div','sub');
  const h=el('div','h');
  const worst=Math.min(+(x.tSpine||99),+(x.tHip||99));
  h.innerHTML=`<span class="badge ${/Osteoporosis/.test(x.result||'')?'dg':/Osteopenia/.test(x.result||'')?'warn':'n'}">${fmtDate(x.date)}</span>
    <span class="t">${esc(x.result||'ยังไม่ระบุผล')}</span>`;
  const del=el('button','btn sm danger'); del.textContent='ลบ'; del.style.marginLeft='auto';
  del.onclick=()=>{ if(confirm('ลบบันทึกนี้?')){p.bone=p.bone.filter(y=>y.id!==x.id);markDirty();renderMain();} };
  h.appendChild(del); box.appendChild(h);
  box.appendChild(grid([
    field('วันที่ตรวจ',inputElLazy('date',x.date,v=>{x.date=v;})),
    field('T-score กระดูกสันหลัง',inputElLazy('number',x.tSpine,v=>{x.tSpine=v;},{step:'0.1',inputmode:'decimal'})),
    field('T-score สะโพก',inputElLazy('number',x.tHip,v=>{x.tHip=v;},{step:'0.1',inputmode:'decimal'})),
    field('ที่มาของข้อมูล',selectEl(OPT.srcOf,x.src,v=>{x.src=v;markDirty();renderMain();},false))
  ]));
  box.appendChild(sect('ผลสรุป'));
  box.appendChild(chips(OPT.boneResult,x.result,v=>{x.result=v;markDirty();renderMain();},{multi:false,sm:true}));
  if(worst<99){
    const sug = worst<=-2.5?'Osteoporosis' : worst<=-1?'Osteopenia' : 'ปกติ';
    if(x.result!==sug){
      const a=el('div','alert info'); a.style.marginTop='10px';
      a.innerHTML=`<span style="font-size:12.5px">จาก T-score ต่ำสุด ${worst} → ตรงกับ <strong>${esc(sug)}</strong></span>`;
      const bt=el('button','btn sm'); bt.textContent='ใช้ค่านี้'; bt.style.marginTop='8px';
      bt.onclick=()=>{x.result=sug;markDirty();renderMain();};
      a.appendChild(el('div','','')); a.appendChild(bt);
      box.appendChild(a);
    }
  }
  const n=el('div'); n.style.marginTop='11px';
  n.appendChild(field('บันทึกเพิ่มเติม',textareaEl(x.note,v=>{x.note=v;})));
  box.appendChild(n);
  return box;
}
function tabStage(p){
  const w=el('div'), s=p.stage;

  /* เตือน LCIS */
  const hh=bestHistology(p);
  if(hh&&/^LCIS/i.test(hh.v))
    w.appendChild(el('div','alert warn',
      '<strong>LCIS (Lobular carcinoma in situ)</strong> — AJCC ฉบับที่ 8 ถอด LCIS ออกจากระบบ TNM staging แล้ว '+
      '(ถือเป็นภาวะ benign/high-risk lesion) ไม่ควรกำหนด T/N/M หรือ Stage ให้ผลชิ้นเนื้อชนิดนี้'));

  const info=el('div','alert info');
  info.innerHTML='<strong>ค่า T / N / M คำนวณอัตโนมัติจากข้อมูลต้นทาง</strong><br>'+
    '<span style="font-size:12.5px">ถ้าค่าไม่ถูกต้อง ให้แก้ที่ต้นทาง เช่น T ผิด → แก้ขนาดก้อน, N ผิด → แก้จำนวนต่อมน้ำเหลือง '+
    'ปุ่ม “ระบุค่าเอง” ด้านล่างมีไว้สำหรับกรณีพิเศษที่ระบบคำนวณไม่ได้เท่านั้น</span>';
  w.appendChild(info);

  /* ══ Clinical staging ══ */
  const cb=el('div');
  cb.appendChild(el('div','hint','ประเมินจากการตรวจร่างกายและผลภาพก่อนผ่าตัด'));
  const cs=cStageOf(p);
  const cwrap=el('div'); cwrap.style.marginTop='10px';
  cwrap.appendChild(autoField('cT',cs.T,cs.T.srcTab==='img'?'img':cs.T.srcTab==='path'?'path':'hx',
    cs.T.srcTab==='img'?'Imaging':cs.T.srcTab==='path'?'Patho':'Hx / PE'));
  cwrap.appendChild(autoField('cN',cs.N,cs.N.srcTab==='img'?'img':'hx',
    cs.N.srcTab==='img'?'Imaging':'Hx / PE'));
  cwrap.appendChild(autoField('cM',cs.M,cs.M.srcTab==='visits'?'visits':cs.M.srcTab==='otherimg'?'otherimg':null,
    cs.M.srcTab==='visits'?'F/U':cs.M.srcTab==='otherimg'?'Staging imaging':null));
  cb.appendChild(cwrap);

  /* M เลือกเองได้เมื่อยังไม่มีหลักฐาน */
  if(!cs.M.locked){
    const mf=el('div'); mf.style.marginTop='4px';
    mf.appendChild(field('cM (แก้ได้เมื่อยังไม่มีบันทึกการแพร่กระจาย)',
      selectEl(OPT.cM,s.cM,v=>{s.cM=v;markDirty();renderMain();},false)));
    cb.appendChild(mf);
  }
  const cbx=el('div','alert '+(cs.v?'info':'warn')); cbx.style.marginTop='12px';
  cbx.innerHTML=cs.v
    ? `<strong>cStage ${esc(cs.v)}</strong> (${esc([cs.T.v,cs.N.v,cs.M.v].filter(Boolean).map(x=>'c'+x).join(''))})
       ${cs.auto?' — คำนวณอัตโนมัติตาม AJCC':' — กำหนดเอง'}
       ${cs.note?`<br><span style="font-size:12.5px">${esc(cs.note)}</span>`:''}`
    : 'ยังคำนวณ cStage ไม่ได้ — กรอกข้อมูลต้นทางให้ครบตามรายการด้านบน';
  cb.appendChild(cbx);
  cb.appendChild(overrideBox(p,'clinical'));
  w.appendChild(card('Clinical staging (cTNM)',cb));

  /* ══ Pathological staging ══ */
  const neo=p.tx.chemo.timing==='Neoadjuvant';
  const pb=el('div');
  const pfx=el('div'); pfx.style.marginBottom='10px';
  pfx.appendChild(field('คำนำหน้า',
    selectEl(['p','yp'],s.pPrefix,v=>{s.pPrefix=v;markDirty();renderMain();},false),
    neo?'ผู้ป่วยได้รับ neoadjuvant — AJCC กำหนดให้ใช้คำนำหน้า yp':'ใช้ yp เมื่อผ่าตัดหลังได้ neoadjuvant'));
  pb.appendChild(pfx);
  const ps=pStageOf(p);
  const pwrap=el('div');

    ps.T.srcTab==='hx'?'Hx / PE':'Patho'));
  pwrap.appendChild(autoField(s.pPrefix+'N',ps.N,'path','Patho'));
  pb.appendChild(pwrap);
  pb.appendChild(el('div','hint',
    'M ใช้ค่า cM เสมอ (AJCC Note 5: การกำหนด pM0 ไม่ถูกต้อง — any M0 is clinical)'));

  /* suffix (sn)/(f) */
  const sfw=el('div'); sfw.style.marginTop='12px';
  sfw.appendChild(el('div','hint',
    'ต่อท้าย N เมื่อยืนยันด้วย sentinel node biopsy หรือ FNA/core biopsy โดยไม่ได้ตัดต่อมเพิ่ม (AJCC)'));
  const sfc=el('div'); sfc.style.marginTop='7px';
  sfc.appendChild(chips(OPT.nodeSuffix,s.nodeSuffix,v=>{s.nodeSuffix=v;markDirty();renderMain();},
    {multi:false,sm:true}));
  sfw.appendChild(sfc);
  pb.appendChild(sfw);

  const pbx=el('div','alert '+(ps.pcr?'info':ps.v?'ok':'warn')); pbx.style.marginTop='12px';
  const sfx=nodeSuffix(p);
  const pTN=[ps.T.v?s.pPrefix+ps.T.v:'', ps.N.v?s.pPrefix+ps.N.v+sfx:''].filter(Boolean).join('');
  const pTNM=[pTN,s.cM?'c'+s.cM:''].filter(Boolean).join('');
  pbx.innerHTML=ps.pcr
    ? `<strong>${esc(ps.note||'pCR')}</strong><br>
       <span style="font-size:12.5px">AJCC Note 8: ไม่กำหนด anatomic stage group เมื่อเป็น pCR</span>`
    : ps.v
    ? `<strong>${esc(s.pPrefix)}Stage ${esc(ps.v)}</strong>${pTNM?` (${esc(pTNM)})`:''}
       ${ps.auto?' — คำนวณอัตโนมัติตาม AJCC':' — กำหนดเอง'}
       ${ps.note?`<br><span style="font-size:12.5px">${esc(ps.note)}</span>`:''}`
    : `ยังคำนวณ ${esc(s.pPrefix)}Stage ไม่ได้ — กรอกข้อมูลต้นทางให้ครบตามรายการด้านบน`;
  pb.appendChild(pbx);

  /* pCR สำหรับ neoadjuvant */
  if(s.pPrefix==='yp'||neo){
    const pc=el('div'); pc.style.marginTop='12px';
    pc.appendChild(el('div','hint','ผลตอบสนองหลัง neoadjuvant therapy'));
    const pcw=el('div'); pcw.style.marginTop='7px';
    pcw.appendChild(chips(OPT.pcr,s.pcr,v=>{s.pcr=v;markDirty();renderMain();},{multi:false,sm:true}));
    pc.appendChild(pcw);
    pb.appendChild(pc);
  }
  pb.appendChild(overrideBox(p,'path'));
  w.appendChild(card('Pathological staging ('+s.pPrefix+'TNM)',pb));

  /* ══ สรุประยะที่ใช้อ้างอิง ══ */
  const sb=el('div');
  const cur=currentStage(p);
  if(cur){
    const a=el('div','alert '+(cur.locked?'dg':'ok'));
    a.innerHTML=`<strong>${esc(stageText(p))}</strong><br>
      <span style="font-size:12.5px">อ้างอิงจาก ${cur.kind==='path'?'pathological staging (หลังผ่าตัด)':'clinical staging (ก่อนผ่าตัด)'}
      ${cur.locked?' — ล็อกเป็น Stage IV เนื่องจากมี M1 (AJCC Note 6)':''}</span>`;
    sb.appendChild(a);
  }else sb.appendChild(el('div','hint','ยังคำนวณระยะโรคไม่ได้'));
  const csv=cStageOf(p).v, psv=pStageOf(p).v;
  if(csv&&psv&&csv!==psv)
    sb.appendChild(el('div','alert info',
      `เปรียบเทียบ: cStage ${esc(csv)} → ${esc(s.pPrefix)}Stage ${esc(psv)} (เก็บทั้งสองค่าไว้)`));
  w.appendChild(card('ระยะโรคที่ใช้อ้างอิงปัจจุบัน',sb));

  /* ══ ICD-10 ══ */
  const ib=el('div');
  const icd=suggestICD(p);
  const ia=el('div','alert '+(icd.auto===false?'warn':'info'));
  ia.innerHTML=`<strong style="font-size:17px">${esc(icd.code||'—')}</strong>
    <span class="badge ${icd.auto===false?'warn':'ok'}" style="margin-left:8px">${icd.auto===false?'กำหนดเอง':'อัตโนมัติ'}</span>

/** กล่อง "ระบุค่าเอง" ซ่อนไว้สำหรับกรณีพิเศษ */
function overrideBox(p,kind){
  const s=p.stage, w=el('div'); w.style.marginTop='12px';
  const isC=kind==='clinical';
  const keyT=isC?'cTManual':'pTManual', keyN=isC?'cNManual':'pNManual';
  const keyS=isC?'cStageManual':'pStageManual';
  const has=s[keyT]||s[keyN]||s[keyS];
  const tog=el('button','btn sm'+(has?' danger':''));
  tog.textContent=has?'กำลังใช้ค่าที่ระบุเอง — กดเพื่อจัดการ':'ระบุค่าเอง (กรณีพิเศษ)';
  const body=el('div'); body.style.cssText='margin-top:11px;display:'+(has?'block':'none');
  tog.onclick=()=>{ body.style.display=body.style.display==='none'?'block':'none'; };
  w.appendChild(tog);
  body.appendChild(el('div','hint',
    'ใช้เฉพาะกรณีที่ระบบคำนวณไม่ได้ เช่น pN1b/pN1c ที่ต้องอ่านจากรายงานพยาธิโดยตรง — '+
    'ปกติควรแก้ที่ต้นทางแทน'));
  const g=el('div','grid'); g.style.marginTop='9px';
  g.appendChild(field((isC?'c':s.pPrefix)+'T (ระบุเอง)',
    selectEl(OPT.cT,s[keyT],v=>{s[keyT]=v;markDirty();renderMain();})));
  g.appendChild(field((isC?'c':s.pPrefix)+'N (ระบุเอง)',
    selectEl(isC?OPT.cN:OPT.pN,s[keyN],v=>{s[keyN]=v;markDirty();renderMain();})));
  g.appendChild(field((isC?'c':s.pPrefix)+'Stage (ระบุเอง)',
    selectEl(['0','IA','IB','IIA','IIB','IIIA','IIIB','IIIC','IV'],s[keyS],
      v=>{s[keyS]=v;markDirty();renderMain();})));
  body.appendChild(g);
  if(has){
    const clr=el('button','btn sm danger'); clr.style.marginTop='10px';
    clr.textContent='ล้างค่าที่ระบุเองทั้งหมด — กลับไปใช้ค่าอัตโนมัติ';
    clr.onclick=()=>{ s[keyT]='';s[keyN]='';s[keyS]=''; markDirty(); renderMain(); };
    body.appendChild(clr);
  }
  w.appendChild(body);
  return w;
}

  (p.visits||[]).forEach(v=>{
    const a=ageAt(p.dob,v.date);
    ev.push({d:v.date,t:'ตรวจติดตาม'+(a?` (อายุ ${a.y} ปี ${a.m} เดือน)`:''),
      s:[(v.cc||[]).join(', '),(v.dx||[]).join(', ')].filter(Boolean).join(' — '),c:'vs'});
  });
  ev.sort((a,b)=>(a.d||'').localeCompare(b.d||''));
  if(!ev.length) tb.appendChild(el('div','hint','ยังไม่มีข้อมูล'));
  else{
    const tl=el('div','tl');
    ev.forEach(e=>{
      const it=el('div','tl-item '+(e.c||''));
      it.innerHTML=`<div class="tl-d">${fmtDate(e.d)}</div><div class="tl-t">${esc(e.t)}</div>
        ${e.s?`<div class="tl-s">${esc(e.s)}</div>`:''}`;
      tl.appendChild(it);
    });
    tb.appendChild(tl);
  }
  w.appendChild(card('ลำดับเหตุการณ์ (Timeline)',tb));

  const vs=[...(p.visits||[])].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const vb=el('div');
  if(!vs.length) vb.appendChild(el('div','hint','ยังไม่มีบันทึกการตรวจ — ไปที่แท็บ “บันทึกการตรวจ” เพื่อเพิ่ม'));
  else{
    const box=el('div','plist');
    vs.forEach(v=>{
      const c=el('div','pcard');
      const dur=v.noSymptom?'':durText(v.durValue,v.durUnit);
      c.innerHTML=`<div class="r1"><span class="nm">${fmtDate(v.date)}</span>
        <span class="hn">อายุ ${ageText(p.dob,v.date)}</span></div>
        <div class="r2">${esc((v.cc||[]).join(', ')||'—')}${dur?` (เป็นมา ${esc(dur)})`:''}</div>
        <div class="r2">${esc((v.dx||[]).join(', ')||'—')}</div>
        ${v.nextDate?`<div class="r2">นัดถัดไป ${fmtDate(v.nextDate)}</div>`:''}`;
      c.onclick=()=>{S.editVisit=v;S.ptab='today';renderTop();};
      box.appendChild(c);
    });
    vb.appendChild(box);
  }
  const vc=card('ประวัติการตรวจติดตาม',vb);
  if(vs.length) vc.querySelector('.body').style.padding='0';
  w.appendChild(vc);
  return w;
}

/* ═══════════════════════════════════════════════════════════
   v2.0 · แท็บ "ตามแก้" — ช่องทางกลับมาแก้ข้อมูลทีหลัง
   ═══════════════════════════════════════════════════════════ */
const TABLBL_ALL={general:'General',hx:'Hx / PE',img:'Imaging',path:'Patho',stage:'Stage',
  otherimg:'CT/US',tx:'Tx',gyn:'Gyn / Bone',visits:'F/U',note:'Note',todo:'ตามแก้'};

function tabTodo(p){
  const w=el('div'), t=todayISO();
  const items=autoTodos(p);
  const doneList=(p.todos||[]).filter(x=>x.done);
  const snoozed=(p.todos||[]).filter(x=>!x.done&&x.snoozeUntil&&x.snoozeUntil>t);

  /* ---- สรุปหัวตาราง ---- */
  const hb=el('div');
  const hi=el('div','alert '+(items.some(x=>x.pri==='สูง')?'warn':items.length?'info':'ok'));
  hi.innerHTML=items.length
    ? `<strong>มี ${items.length} รายการที่ต้องตามแก้</strong><br><span style="font-size:12.5px">
        สำคัญ ${items.filter(x=>x.pri==='สูง').length} ·
        ปานกลาง ${items.filter(x=>x.pri==='กลาง').length} ·
        เล็กน้อย ${items.filter(x=>x.pri==='ต่ำ').length}
        ${snoozed.length?` · เลื่อนไว้ ${snoozed.length}`:''}
        ${doneList.length?` · ทำแล้ว ${doneList.length}`:''}</span>`
    : `<strong>ไม่มีรายการค้าง</strong><br><span style="font-size:12.5px">ข้อมูลครบและไม่มีการเตือนที่ต้องจัดการ</span>`;
  hb.appendChild(hi);
  hb.appendChild(el('div','hint','รายการส่วนใหญ่สร้างอัตโนมัติจากการเตือนและข้อมูลที่ยังขาด — กด "ทำแล้ว" เพื่อซ่อน หรือ "เลื่อนไว้" ถ้ายังทำไม่ได้ตอนนี้'));
  w.appendChild(card('สรุป',hb));

  /* ---- รายการ ---- */
  const lb=el('div');
  if(!items.length) lb.appendChild(el('div','hint','ไม่มีรายการค้าง'));
  const priTone={'สูง':'dg','กลาง':'warn','ต่ำ':'n'};
  items.forEach(it=>{
    const bx=el('div','sub');
    const h=el('div','h');
    h.innerHTML=`<span class="badge ${priTone[it.pri]||'n'}">${esc(it.pri)}</span>
      <span class="badge n">${esc(it.cat)}</span>
      ${it.auto?'<span class="badge n" style="opacity:.7">อัตโนมัติ</span>':'<span class="badge b">เพิ่มเอง</span>'}`;
    bx.appendChild(h);
    const tx=el('div'); tx.style.cssText='font-size:14.5px;margin:2px 0 10px';
    tx.textContent=it.text; bx.appendChild(tx);

    const row=el('div','btnrow');
    if(it.tab&&TABLBL_ALL[it.tab]){
      const go=el('button','btn sm'); go.textContent='ไปที่ '+TABLBL_ALL[it.tab];
      go.onclick=()=>{ gotoOldTab(it.tab); };
      row.appendChild(go);
    }
    const dn=el('button','btn sm primary'); dn.textContent='ทำแล้ว';
    dn.onclick=()=>{ setTodoState(p,it,{done:true}); markDirty(); renderMain(); };
    row.appendChild(dn);

    [['เลื่อน 1 สัปดาห์',7],['เลื่อน 1 เดือน',30],['เลื่อน 3 เดือน',90]].forEach(([lab,d])=>{
      const sn=el('button','btn sm'); sn.textContent=lab;
      sn.onclick=()=>{ setTodoState(p,it,{snoozeUntil:addDays(t,d)}); markDirty(); renderMain(); };
      row.appendChild(sn);
    });
    if(!it.auto){
      const rm=el('button','btn sm danger'); rm.textContent='ลบ';
      rm.onclick=()=>{ p.todos=p.todos.filter(x=>x.id!==it.id); markDirty(); renderMain(); };
      row.appendChild(rm);
    }
    bx.appendChild(row);

    const nw=el('div'); nw.style.marginTop='10px';
    nw.appendChild(field('บันทึกของหมอ (ไม่บังคับ)',
      inputEl('text',it.note,v=>{ setTodoState(p,it,{note:v}); }),
      'เช่น "โทรตามแล้ว 5 ก.ย. ผู้ป่วยจะมา 20 ก.ย."'));
    bx.appendChild(nw);
    lb.appendChild(bx);
  });

  /* เพิ่มรายการเอง */
  const addRow=el('div'); addRow.style.marginTop='6px';
  const ab=el('button','btn primary'); ab.textContent='+ เพิ่มรายการเอง';
  ab.onclick=()=>{
    const nt=blankTodo(); nt.cat='อื่นๆ'; nt.text='';
    if(!Array.isArray(p.todos)) p.todos=[];
    p.todos.push(nt); markDirty(); renderMain();
  };
  addRow.appendChild(ab); lb.appendChild(addRow);

  /* กล่องแก้ไขรายการที่เพิ่มเองและยังไม่มีข้อความ */
  (p.todos||[]).filter(x=>!x.auto&&!x.text&&!x.done).forEach(nt=>{
    const bx=el('div','sub');
    bx.appendChild(sect('รายการใหม่'));
    bx.appendChild(grid([
      field('เรื่องที่ต้องตาม',inputEl('text',nt.text,v=>{nt.text=v;})),
      field('หมวด',selectEl(OPT.todoCat,nt.cat,v=>{nt.cat=v;markDirty();renderMain();},false)),
      field('ความสำคัญ',selectEl(OPT.todoPri,nt.pri,v=>{nt.pri=v;markDirty();renderMain();},false))
    ]));
    const sv=el('button','btn sm primary'); sv.textContent='บันทึกรายการ'; sv.style.marginTop='10px';
    sv.onclick=()=>{ if(!nt.text.trim()){toast('กรุณาใส่เรื่องที่ต้องตาม');return;} markDirty(); renderMain(); };
    bx.appendChild(sv);
    lb.appendChild(bx);
  });
  w.appendChild(card('รายการที่ต้องตามแก้',lb));

  /* ---- เลื่อนไว้ / ทำแล้ว ---- */
  if(snoozed.length){
    const sb=el('div');
    snoozed.sort((a,b2)=>(a.snoozeUntil||'').localeCompare(b2.snoozeUntil||'')).forEach(x=>{
      const r=el('div'); r.style.cssText='display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap';
      r.innerHTML=`<span class="badge n">กลับมาเตือน ${fmtDate(x.snoozeUntil)}</span>
        <span style="font-size:13.5px;flex:1;min-width:180px">${esc(x.text)}</span>`;
      const un=el('button','btn sm'); un.textContent='เอากลับมาเลย';
      un.onclick=()=>{ x.snoozeUntil=''; markDirty(); renderMain(); };
      r.appendChild(un); sb.appendChild(r);
    });
    w.appendChild(card('เลื่อนไว้ก่อน',sb));
  }
  if(doneList.length){
    const db=el('div');
    doneList.forEach(x=>{
      const r=el('div'); r.style.cssText='display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap';
      r.innerHTML=`<span class="badge ok">✓</span>
        <span style="font-size:13.5px;flex:1;min-width:180px;color:var(--ink2)">${esc(x.text)}${x.note?` — ${esc(x.note)}`:''}</span>`;
      const un=el('button','btn sm'); un.textContent='ยังไม่ได้ทำ';
      un.onclick=()=>{ x.done=false; markDirty(); renderMain(); };
      r.appendChild(un); db.appendChild(r);
    });
    const dc=card('ทำแล้ว ('+doneList.length+')',db);
    w.appendChild(dc);
  }
  return w;
}

/* ---- แท็บ 8: บันทึกการตรวจ ---- */
/** แถบเลือกวันที่ + เลื่อนดู visit ก่อน/ถัดไป — ใช้ทั้งตอนยังไม่ได้เลือกและตอนกำลังแก้ไข */
function visitNavBar(p,currentId){
  const list=[...(p.visits||[])].sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  if(!list.length) return null;
  const bar=el('div'); bar.style.cssText='display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap';
  const idx=currentId?list.findIndex(x=>x.id===currentId):-1;

  const go=(i)=>{ S.editVisit=list[i]; renderTop(); };

  const prevBtn=el('button','btn sm'); prevBtn.textContent='‹';
  prevBtn.disabled=idx<=0;
  prevBtn.onclick=()=>{ if(idx>0) go(idx-1); };

  const sel=el('select'); sel.style.cssText='flex:1;min-width:160px';
  list.forEach((x,i)=>{
    const o=el('option'); o.value=x.id;
    o.textContent=fmtDate(x.date)+(i===list.length-1?' (ครั้งล่าสุด)':'');
    if(x.id===currentId) o.selected=true;
    sel.appendChild(o);
  });
  sel.onchange=()=>{ const i=list.findIndex(x=>x.id===sel.value); if(i>=0) go(i); };

  const nextBtn=el('button','btn sm'); nextBtn.textContent='›';
  nextBtn.disabled=idx<0||idx>=list.length-1;
  nextBtn.onclick=()=>{ if(idx>=0&&idx<list.length-1) go(idx+1); };

  const nw=el('button','btn sm primary'); nw.textContent='+ ครั้งใหม่';
  nw.onclick=()=>{
    const nv=blankVisit(p), iv=suggestInterval(p);
    nv.nextDate=iv<1?addDays(todayISO(),14):addMonths(todayISO(),Math.round(iv));
    S.editVisit=nv; renderTop();
  };

  const lab=el('div'); lab.style.cssText='font-size:13px;font-weight:650;color:var(--ink2);white-space:nowrap';
  lab.textContent='การตรวจ:';
  bar.appendChild(lab); bar.appendChild(prevBtn); bar.appendChild(sel); bar.appendChild(nextBtn); bar.appendChild(nw);
  return bar;
}
function tabNote(p){
  const w=el('div');
  if(!S.editVisit){
    const nav=visitNavBar(p,null);
    if(nav) w.appendChild(nav);
    const b=el('div');
    b.appendChild(el('p','','เลือกการตรวจที่ต้องการแก้ไขจากด้านบน หรือเริ่มบันทึกครั้งใหม่'));
    const row=el('div','btnrow');
    const nw=el('button','btn primary'); nw.textContent='+ บันทึกการตรวจครั้งใหม่';
    nw.onclick=()=>{
      const v=blankVisit(p), iv=suggestInterval(p);
      v.nextDate=iv<1?addDays(todayISO(),14):addMonths(todayISO(),Math.round(iv));
      S.editVisit=v; renderMain();
    };
    row.appendChild(nw);
    const prev=lastVisit(p);
    if(prev){
      const cp=el('button','btn'); cp.textContent='คัดลอกจากการตรวจครั้งก่อน';
      cp.onclick=()=>{
        const v=JSON.parse(JSON.stringify(prev));
        v.id=uid(); v.date=todayISO(); v.marker='';
        const iv=suggestInterval(p);
        v.nextDate=iv<1?addDays(todayISO(),14):addMonths(todayISO(),Math.round(iv));
        S.editVisit=v; renderMain();
      };
      row.appendChild(cp);
    }
    b.appendChild(row);
    w.appendChild(card('บันทึกการตรวจ',b));
    return w;
  }

  const v=S.editVisit, isNew=!(p.visits||[]).some(x=>x.id===v.id);
  if(!isNew){
    const nav=visitNavBar(p,v.id);
    if(nav) w.appendChild(nav);
  }
  if(!v.pe||typeof v.pe!=='object') v.pe=blankPE();
  const pe=v.pe;
  const re=()=>renderMain();
  const tog=(arr,it)=>{const i=arr.indexOf(it); i>=0?arr.splice(i,1):arr.push(it); markDirty(); re();};

  /* ---- แจ้งว่ากำลังดู snapshot ของ visit เก่า ---- */
  if(!isNew&&v.snapshot){
    const sn=v.snapshot;
    const cur=makeSnapshot(p,v);
    const diff=(sn.stageText!==cur.stageText)||(sn.status!==cur.status)||(sn.icd!==cur.icd);
    const a=el('div','alert '+(diff?'warn':'info'));
    a.innerHTML=`<strong>ข้อมูล ณ วันที่บันทึก (${new Date(sn.at).toLocaleString('th-TH')})</strong><br>
      <span style="font-size:12.5px">${esc(sn.stageText||'ยังไม่มีระยะโรค')} · ${esc(sn.status||'')}
      ${sn.icd?' · ICD '+esc(sn.icd):''}</span>
      ${diff?`<br><span style="font-size:12.5px">ข้อมูลปัจจุบันต่างจากตอนบันทึก: ${esc(cur.stageText||'-')} · ${esc(cur.status||'')}</span>`:''}`;
    if(diff){
      const rb=el('button','btn sm'); rb.style.marginTop='9px';
      rb.textContent='สร้างข้อความใหม่จากข้อมูลปัจจุบัน';
      rb.onclick=()=>{ if(confirm('เขียนทับ snapshot เดิมด้วยข้อมูลปัจจุบัน?')){
        v.snapshot=makeSnapshot(p,v); markDirty(); toast('อัปเดต snapshot แล้ว'); re(); } };
      a.appendChild(rb);
    }
    w.appendChild(a);
  }

  /* ---- กล่องข้อมูลที่ยังขาด (กระชับ — chip เดียวจบ ไม่มีรายละเอียดยาว) ---- */
  const tdN2=todoCount(p);
  if(tdN2){
    const mw=el('div','alert warn'); mw.style.marginBottom='14px';
    const head=el('div'); head.style.marginBottom='8px';
    head.innerHTML=`<strong>มี ${tdN2} รายการที่ต้องตามแก้</strong>
      <span style="font-size:12.5px"> — ไม่ต้องแก้ตอนนี้ก็ได้ บันทึกการตรวจต่อได้เลย</span>`;
    mw.appendChild(head);
    const row=el('div','btnrow');
    const go=el('button','btn sm'); go.textContent='เปิดรายการตามแก้';
    go.onclick=()=>{ S.ptab='todo'; renderTop(); };
    row.appendChild(go);
    mw.appendChild(row);
    w.appendChild(mw);
  }

  const b=el('div');

  b.appendChild(grid([
    field('วันที่ตรวจ',inputEl('date',v.date,x=>{v.date=x;re();})),
    field('อายุ ณ วันตรวจ (อัตโนมัติ)',calcBox(ageText(p.dob,v.date))),
    field('ระยะเวลาหลังผ่าตัด',calcBox((()=>{const d=daysBetween(p.tx.breastSurgery.date,v.date);
      return d===null?'—':(d<60?`${d} วัน`:`${Math.floor(d/30)} เดือน`);})())),
    field('ปีที่หลังวินิจฉัย',calcBox((()=>{const m=monthsBetween(p.dxDate,v.date);
      return m===null?'—':`ปีที่ ${Math.floor(m/12)+1}`;})()))
  ]));

  /* ═══ B6 — เลือกชนิดการพบครั้งนี้ ═══ */
  {
    const g=guessVType(p,v), cur=v.vtype||g.k, curT=VT(cur);
    const bx=el('div'); bx.style.marginBottom='14px';
    const hd=el('div','hint'); hd.textContent='วันนี้มาทำอะไร'; bx.appendChild(hd);

    /* แสดง 4 อันที่น่าจะใช่ก่อน — ที่เหลือซ่อนใต้ "อื่นๆ" (จอ 412px) */
    const near=[g.k,'surv','postop','symptom'].filter((x,i,a)=>a.indexOf(x)===i);
    const shown=S.vtypeAll?VTYPES.map(x=>x.k):[...new Set([cur,...near])].slice(0,4);
    const row=el('div','chips'); row.style.marginTop='5px';
    shown.forEach(k=>{
      const t=VT(k); if(!t) return;
      const b=el('button','chip sm'+(k===cur?' on':'')); b.type='button';
      b.textContent=t.label+(k===g.k&&!v.vtype?' ·แนะนำ':'');
      b.onclick=()=>{ applyVType(p,v,k); markDirty(); re(); };
      row.appendChild(b);
    });
    const more=el('button','chip sm'); more.type='button';
    more.textContent=S.vtypeAll?'ย่อรายการ':'อื่นๆ…';
    more.onclick=()=>{ S.vtypeAll=!S.vtypeAll; re(); };
    row.appendChild(more);
    bx.appendChild(row);

    const info=el('div','hint'); info.style.marginTop='6px';
    info.textContent=v.vtype
      ? `ฟอร์มปรับตามชนิด "${curT?curT.label:cur}" แล้ว`
      : `ระบบเดาให้ว่าเป็น "${VT(g.k)?VT(g.k).label:g.k}" — ${g.why} (กดเปลี่ยนได้)`;
    bx.appendChild(info);

    const sa=el('div','chips'); sa.style.marginTop='7px';
    const ab=el('button','chip sm'+(S.showAllBlocks?' on':'')); ab.type='button';
    ab.textContent=S.showAllBlocks?'✓ แสดงทุกส่วน':'แสดงทุกส่วน (ไม่ซ่อนอะไรเลย)';
    ab.onclick=()=>{ S.showAllBlocks=!S.showAllBlocks; re(); };
    sa.appendChild(ab);
    bx.appendChild(sa);
    b.appendChild(bx);
  }

  if(isIndexVisit(p,v)){
    const iv=indexVisitOf(p);
    const isSrc=!iv||iv.id===v.id;
    const bx=el('div','alert '+(isSrc?'info':'n'));
    bx.innerHTML=`<strong>การตรวจก่อนเริ่มการรักษา</strong><br><span style="font-size:12.5px">${
      isSrc
        ? (hxAutoWritable(p)
            ? 'ผลตรวจร่างกายในหน้านี้จะถูกใช้เป็นข้อมูลตอนวินิจฉัย (ต้นทางของ cT / cN) เมื่อกดบันทึก'
            : 'ข้อมูลตอนวินิจฉัยมาจากการนำเข้า — ระบบจะไม่เขียนทับ ถ้าต้องการใช้ PE นี้แทน ไปที่แท็บ Hx / PE')
        : `ต้นทางของ cT / cN คือการตรวจวันที่ ${fmtDate(iv.date)} ซึ่งเก่ากว่าครั้งนี้`
    }</span>`;
    bx.style.marginBottom='12px';
    b.appendChild(bx);
  }
  b.appendChild(sect('CC — เหตุที่มาและอาการ'));
  OPT.ccGroups.forEach(g=>{
    const gl=el('div','hint'); gl.textContent=g.label; gl.style.margin='9px 0 5px';
    b.appendChild(gl);
    b.appendChild(chips(g.items,v.cc,x=>{
      /* "มาตามนัด ไม่มีอาการ" กับอาการอื่นเลือกพร้อมกันไม่ได้ */
      if(x==='มาตามนัด ไม่มีอาการผิดปกติ'&&!v.cc.includes(x)){ v.cc=[x]; v.noSymptom=true; markDirty(); re(); return; }
      if(x!=='มาตามนัด ไม่มีอาการผิดปกติ') v.cc=v.cc.filter(y=>y!=='มาตามนัด ไม่มีอาการผิดปกติ');
      tog(v.cc,x);
    },{sm:true}));
  });
  if(v.cc.includes('อื่นๆ')){
    const d=el('div'); d.style.marginTop='10px';
    d.appendChild(field('ระบุอาการอื่นๆ',inputEl('text',v.ccOther,x=>{v.ccOther=x;})));
    b.appendChild(d);
  }
  if(vShow(p,v,'dur')){
    b.appendChild(sect('ระยะเวลาที่มีอาการ'));
    b.appendChild(numUnit(v,'durValue','durUnit',OPT.durUnit,
      [['3 วัน',3,'วัน'],['1 สัปดาห์',1,'สัปดาห์'],['2 สัปดาห์',2,'สัปดาห์'],
       ['1 เดือน',1,'เดือน'],['3 เดือน',3,'เดือน']],1,'ไม่มีอาการ'));
  }

  if(vShow(p,v,'pi')){
    const pi=el('div'); pi.style.marginTop='14px';
    pi.appendChild(field('PI — รายละเอียดเพิ่มเติม (ไม่บังคับ)',
      textareaEl(v.piOther,x=>{v.piOther=x;},'ประวัติอื่นจะดึงจากข้อมูลผู้ป่วยให้อัตโนมัติ')));
    b.appendChild(pi);
  }

  /* PE — แสดงตาม preset: 'full' ทุกระบบ · 'core' เต้านม+รักแร้ · 0 ซ่อน */
  const _peMode=vBlocks(p,v).pe;
  if(_peMode){
  b.appendChild(sect('PE — ตรวจร่างกาย (รายงานเป็นภาษาอังกฤษ)'));
  const anyAbn=PE_SYS.some(s=>(pe[s.key]||[]).length);
  const pn=el('div','chips'); pn.style.marginBottom='12px';
  const nb=el('button','chip'+(!anyAbn?' on ok':'')); nb.type='button';
  nb.textContent='✓ ตรวจร่างกายทุกระบบปกติ (กดปุ่มเดียว)';
  nb.onclick=()=>{ PE_SYS.forEach(s=>pe[s.key]=[]); pe.breastLoc=[]; pe.allNormal=true; markDirty(); re(); };
  pn.appendChild(nb); b.appendChild(pn);
  b.appendChild(el('div','hint','เลือกเฉพาะสิ่งที่ผิดปกติ — ระบบอื่นจะรายงานเป็นปกติให้อัตโนมัติ'));

  /* v2.0 (A5) — โหมด core แสดงแค่เต้านม+รักแร้ ระบบอื่นยุบไว้ กดกางได้ */
  const CORE_SYS=['breast','axilla'];
  const coreMode=_peMode==='core'&&!S.peExpandAll;
  const hiddenSys=coreMode?PE_SYS.filter(x=>!CORE_SYS.includes(x.key)):[];
  const visSys=coreMode?PE_SYS.filter(x=>CORE_SYS.includes(x.key)||(pe[x.key]||[]).length):PE_SYS;

  visSys.forEach(sys=>{
    const wrap=el('div'); wrap.style.marginTop='13px';
    const lab=el('div'); lab.style.cssText='font-size:13px;font-weight:650;color:var(--ink2);margin-bottom:6px';
    lab.textContent=`${sys.label} (${sys.en})`;
    wrap.appendChild(lab);
    wrap.appendChild(chips(sys.items.map(x=>x[0]),pe[sys.key],x=>{pe.allNormal=false;tog(pe[sys.key],x);},{sm:true}));
    if(sys.key==='breast'&&(pe.breast||[]).includes('คลำได้ก้อนที่เต้านม')){
      const lw=el('div'); lw.style.marginTop='10px';
      lw.appendChild(el('div','hint','ตำแหน่งก้อนที่ตรวจพบ'));
      if((p.hx.locations||[]).length){
        const cp=el('button','btn sm'); cp.style.margin='7px 0';
        cp.textContent='ใช้ตำแหน่งเดียวกับตอนวินิจฉัย ('+p.hx.locations.join(', ')+')';
        cp.onclick=()=>{ pe.breastLoc=[...p.hx.locations]; markDirty(); re(); };
        lw.appendChild(cp);
      }
      lw.appendChild(clockPair(pe.breastLoc,c=>tog(pe.breastLoc,c),p.hx.locations));
      const mg=el('div','grid'); mg.style.marginTop='11px';
      mg.appendChild(field('ขนาดก้อนที่คลำได้ครั้งนี้ (ซม.)',
        inputEl('number',pe.massSize,x=>{pe.massSize=x;markDirty();},
        {step:'0.1',min:'0',inputmode:'decimal'})));
      lw.appendChild(mg);
      /* B4 — ระยะห่างจากหัวนม แยกตามตำแหน่ง (โครงสร้างเดียวกับ hx.locDist) */
      if(typeof pe.massDist!=='object'||!pe.massDist) pe.massDist={};
      if((pe.breastLoc||[]).length){
        const dg=el('div','grid'); dg.style.marginTop='11px';
        pe.breastLoc.forEach(c=>{
          dg.appendChild(field(`ระยะจากหัวนม — ${locLabel(c)} (ซม.)`,
            inputElLazy('number',pe.massDist[c]||'',x=>{ pe.massDist[c]=x; },
            {step:'0.5',min:'0',inputmode:'decimal'})));
        });
        lw.appendChild(dg);
      }
      wrap.appendChild(lw);
    }
    /* การตรวจแผลผ่าตัด — รวมไว้ในหมวด Breast (ตำแหน่งเดียวกับที่ผ่าตัด) */
    if(sys.key==='breast'){
      const ww=el('div'); ww.style.marginTop='10px';
      const wt=el('div','chips');
      const wb=el('button','chip'+(pe.woundActive?' on':'')); wb.type='button';
      wb.textContent='ตรวจแผลผ่าตัดครั้งนี้';
      wb.onclick=()=>{pe.woundActive=!pe.woundActive;markDirty();re();};
      wt.appendChild(wb); ww.appendChild(wt);
      if(pe.woundActive){
        const wc=el('div'); wc.style.marginTop='8px';
        wc.appendChild(chips(PE_WOUND.map(x=>x[0]),pe.wound,x=>tog(pe.wound,x),{sm:true}));
        ww.appendChild(wc);
      }
      wrap.appendChild(ww);
    }
    b.appendChild(wrap);
  });

  if(hiddenSys.length){
    const hs=el('div'); hs.style.marginTop='13px';
    hs.appendChild(el('div','hint','ระบบอื่น — แตะชื่อระบบเพื่อกางออก'));
    const hr=el('div','chips'); hr.style.marginTop='5px';
    hiddenSys.filter(x=>!(pe[x.key]||[]).length).forEach(sys=>{
      const bb=el('button','chip sm'); bb.type='button'; bb.textContent='+ '+sys.label;
      bb.onclick=()=>{ S.peOpen=S.peOpen||{}; S.peOpen[sys.key]=true; S.peExpandAll=true; re(); };
      hr.appendChild(bb);
    });
    const all=el('button','chip sm'); all.type='button'; all.textContent='กางทุกระบบ';
    all.onclick=()=>{ S.peExpandAll=true; re(); };
    hr.appendChild(all);
    hs.appendChild(hr);
    b.appendChild(hs);
  }else if(_peMode==='core'&&S.peExpandAll){
    const cb=el('div','chips'); cb.style.marginTop='11px';
    const c=el('button','chip sm'); c.type='button'; c.textContent='ย่อกลับเหลือเต้านม+รักแร้';
    c.onclick=()=>{ S.peExpandAll=false; re(); };
    cb.appendChild(c); b.appendChild(cb);
  }

  const peo=el('div'); peo.style.marginTop='12px';
  peo.appendChild(field('PE — ข้อความเพิ่มเติม (ภาษาอังกฤษ, ไม่บังคับ)',inputEl('text',pe.other,x=>{pe.other=x;})));
  b.appendChild(peo);
  }  /* ปิดบล็อก PE */

  /* ผลตรวจของวันนี้ — ปุ่มลัดเชื่อมกับแท็บอื่น */
  if(vShow(p,v,'ix')){
  b.appendChild(sect('ผลตรวจของวันนี้'));
  const todayMM=(p.mammos||[]).filter(m=>m.visitId===v.id);
  const todayPA=(p.paths||[]).filter(x=>x.visitId===v.id);
  const ixRow=el('div','btnrow');
  const addMM=el('button','btn'); addMM.textContent='+ เพิ่มผลภาพวินิจฉัยของวันนี้';
  addMM.onclick=()=>{
    const nm=blankMammo(); nm.date=v.date; nm.visitId=v.id;
    const opd=p.tx.breastSurgery.date;
    nm.phase=(opd&&v.date>opd)?'ติดตามหลังรักษา':'ก่อนผ่าตัด (staging)';
    p.mammos.push(nm); markDirty(); re();
  };
  const addPA=el('button','btn'); addPA.textContent='+ เพิ่มผลชิ้นเนื้อของวันนี้';
  addPA.onclick=()=>{
    const np=blankPath('CNB',p); np.date=v.date; np.visitId=v.id;
    p.paths.push(np); markDirty(); re();
  };
  const addOI=el('button','btn'); addOI.textContent='+ เพิ่มผล CT/US ของวันนี้';
  addOI.onclick=()=>{
    const x=blankOtherImg(); x.date=v.date; x.visitId=v.id;
    const opd=p.tx.breastSurgery.date;
    x.phase=(opd&&v.date>opd)?'ระหว่างติดตาม':'ก่อนผ่าตัด (staging)';
    p.otherImg.push(x); markDirty(); re();
  };
  const addGY=el('button','btn'); addGY.textContent='+ เพิ่มผลตรวจนรีเวชของวันนี้';
  addGY.onclick=()=>{
    const g=blankGyn(); g.date=v.date; g.visitId=v.id;
    const st2=p.tx.endocrine.start;
    if(!st2||v.date<st2) g.phase='ก่อนเริ่มยาฮอร์โมน (baseline)';
    p.gyn.push(g); markDirty(); re();
  };
  ixRow.appendChild(addMM); ixRow.appendChild(addPA);
  ixRow.appendChild(addOI); ixRow.appendChild(addGY);
  b.appendChild(ixRow);
  b.appendChild(el('div','hint','ใส่วันที่ให้อัตโนมัติเป็นวันเดียวกับการตรวจ — ไม่ต้องสลับแท็บ'));
  const todayOI=(p.otherImg||[]).filter(x=>x.visitId===v.id);
  const todayGY=(p.gyn||[]).filter(x=>x.visitId===v.id);
  todayMM.forEach(m=>b.appendChild(mammoEditor(p,m)));
  todayPA.forEach(x=>b.appendChild(pathEditor(p,x)));
  todayOI.forEach(x=>b.appendChild(otherImgEditor(p,x)));
  todayGY.forEach(x=>b.appendChild(gynEditor(p,x)));
  /* E5 — ตัด tumor marker ออกจากการติดตามปกติ (ไม่แนะนำในผู้ที่ไม่มีอาการ)
     คงฟิลด์ไว้ในโครงสร้างข้อมูลเพื่อไม่ให้ของเก่าหาย — แสดงอ่านอย่างเดียวถ้ามีค่าเดิม */
  if(v.marker){
    const mk=el('div'); mk.style.marginTop='12px';
    mk.appendChild(field('Tumor marker (CA 15-3) — บันทึกไว้เดิม',
      inputEl('text',v.marker,x=>{v.marker=x;}),
      'ค่าจากบันทึกรุ่นก่อน — ไม่แนะนำให้ตรวจเป็นประจำในผู้ที่ไม่มีอาการ ลบได้ถ้าไม่ต้องการเก็บต่อ'));
    b.appendChild(mk);
  }
  }  /* ปิดบล็อก ผลตรวจของวันนี้ */

  b.appendChild(sect('Diagnosis — ผลประเมินครั้งนี้'));
  b.appendChild(chips(OPT.visitDx,v.dx,x=>tog(v.dx,x)));
  const dxo=el('div'); dxo.style.marginTop='10px';
  dxo.appendChild(field('ระบุเพิ่มเติม (ไม่บังคับ)',inputEl('text',v.dxOther,x=>{v.dxOther=x;})));
  b.appendChild(dxo);

  b.appendChild(sect('Treatment — การรักษาที่ให้ครั้งนี้'));
  b.appendChild(chips(OPT.txGiven,v.txGiven,x=>tog(v.txGiven,x)));
  if(v.txGiven.includes('ให้ยา (ระบุ)')||v.txGiven.includes('ส่งตรวจภาพเพิ่มเติม')){
    const d=el('div'); d.style.marginTop='10px';
    d.appendChild(field('ระบุรายละเอียด',inputEl('text',v.txOther,x=>{v.txOther=x;})));
    b.appendChild(d);
  }
  if(vShow(p,v,'adher')&&p.tx.endocrine.drug!=='ไม่ได้รับ'){
    b.appendChild(sect(`การใช้ยาฮอร์โมน (${p.tx.endocrine.drug})`));
    b.appendChild(chips(OPT.adherence,v.adherence,x=>{v.adherence=x;markDirty();re();},{multi:false}));
  }
  if(vShow(p,v,'psych')){
    b.appendChild(sect('Psychosocial — ระดับความทุกข์ใจ (0 = ไม่มีเลย, 10 = มากที่สุด)'));
    b.appendChild(chips(OPT.distress,v.distress,x=>{v.distress=x;markDirty();re();},{multi:false,sm:true}));
    if(v.distress!==''&&+v.distress>=4)
      b.appendChild(el('div','alert warn',
        `คะแนน ${esc(v.distress)}/10 — ถึงเกณฑ์พิจารณาส่งปรึกษาผู้เชี่ยวชาญด้านจิตใจ/สังคม`));
    if(v.psychLegacy)
      b.appendChild(el('div','hint','บันทึกเดิม: '+esc(v.psychLegacy)));
  }

  b.appendChild(sect('Plan — แผนครั้งถัดไป'));
  const sug=suggestInterval(p);
  const quick=el('div','chips'); quick.style.marginBottom='10px';
  [['1 สัปดาห์','d',7],['2 สัปดาห์','d',14],['1 เดือน','m',1],['3 เดือน','m',3],
   ['4 เดือน','m',4],['6 เดือน','m',6],['12 เดือน','m',12]].forEach(([l,unit,n])=>{
    const d2=unit==='d'?addDays(v.date,n):addMonths(v.date,n);
    const isSug=unit==='m'&&Math.abs(n-sug)<0.01;
    const bt=el('button','chip'+(v.nextDate===d2?' on':'')); bt.type='button';
    bt.textContent=l+(isSug?' ★':'');
    bt.onclick=()=>{v.nextDate=d2;markDirty();re();}; quick.appendChild(bt);
  });
  b.appendChild(quick);
  b.appendChild(grid([
    field('วันนัดครั้งถัดไป',inputElLazy('date',v.nextDate,x=>{v.nextDate=x;})),
    field('อายุ ณ วันนัดถัดไป',calcBox(ageText(p.dob,v.nextDate)))
  ]));
  const ord=el('div'); ord.style.marginTop='14px';
  if(vShow(p,v,'orders')){
  ord.appendChild(sect('สิ่งที่ต้องตรวจก่อน/ในนัดหน้า'));
  ord.appendChild(chips(OPT.planOrder,v.orders,x=>tog(v.orders,x)));
  b.appendChild(ord);
  }  /* ปิดบล็อก orders */
  const po=el('div'); po.style.marginTop='10px';
  po.appendChild(field('แผนเพิ่มเติม (ไม่บังคับ)',inputEl('text',v.planOther,x=>{v.planOther=x;})));
  b.appendChild(po);

  const al=alertsFor(p).filter(a=>['mammo','path','birads','ptnm'].includes(a.k));
  if(al.length){
    const box=el('div'); box.style.marginTop='14px';
    al.forEach(a=>{const d=el('div','alert warn');d.textContent='เตือน: '+a.msg;box.appendChild(d);});
    b.appendChild(box);
  }

  const act=el('div','btnrow'); act.style.marginTop='18px';
  const save=el('button','btn primary'); save.textContent=isNew?'บันทึกการตรวจ':'บันทึกการแก้ไข';
  save.onclick=async()=>{
    if(isNew) p.visits.push(v);
    else{ const i=p.visits.findIndex(x=>x.id===v.id); p.visits[i]=v; }
    if(v.nextDate) p.nextAppt=v.nextDate;
    /* B1/T4 — PE ของการตรวจก่อนรักษา เขียนลง hx.* ให้เอง (ไม่เขียนทับข้อมูลนำเข้า) */
    let hxMsg='';
    if(isIndexVisit(p,v)&&peHasFindings(v)){
      const r=syncHxFromVisits(p,false);
      if(r.changed) hxMsg=' · อัปเดตข้อมูลตอนวินิจฉัยจาก PE แล้ว';
      else if(r.locked) hxMsg=' · ข้อมูลตอนวินิจฉัยไม่ถูกเขียนทับ (มาจากการนำเข้า)';
    }
    /* เก็บ snapshot ของข้อมูล ณ วันที่บันทึก เพื่อย้อนดูให้ตรงกับความจริงตอนนั้น */
    v.snapshot=makeSnapshot(p,v);
    await saveNow(true);
    await store.audit(isNew?'เพิ่มบันทึกการตรวจ':'แก้ไขบันทึกการตรวจ',fmtDate(v.date),p.hn);
    toast('บันทึกเรียบร้อย'+hxMsg); renderMain();
  };
  act.appendChild(save);
  const cancel=el('button','btn'); cancel.textContent='ปิด';
  cancel.onclick=()=>{S.editVisit=null;renderMain();}; act.appendChild(cancel);
  if(!isNew){
    const del=el('button','btn danger'); del.textContent='ลบบันทึกนี้';
    del.onclick=async()=>{
      if(!confirm('ลบบันทึกการตรวจครั้งนี้?')) return;
      p.visits=p.visits.filter(x=>x.id!==v.id);
      await saveNow(true); await store.audit('ลบบันทึกการตรวจ',fmtDate(v.date),p.hn);
      S.editVisit=null; renderMain();
    };
    act.appendChild(del);
  }
  b.appendChild(act);
  w.appendChild(card('กรอกข้อมูลการตรวจ',b));

  /* ข้อความสำเร็จรูป — แยกกล่อง */
  const nb2=el('div');
  const secs=noteSections(p,v);
  secs.forEach(s=>nb2.appendChild(noteBox(s.t,s.tx,s.en)));
  const nr=el('div','btnrow'); nr.style.marginTop='6px';
  const all=el('button','btn primary'); all.textContent='คัดลอกทั้งหมด';
  all.onclick=()=>copyText(buildNote(p,v),'ทั้งหมด'); nr.appendChild(all);
  const rf=el('button','btn'); rf.textContent='รีเฟรชข้อความ'; rf.onclick=()=>renderMain();
  nr.appendChild(rf);
  nb2.appendChild(nr);
  w.appendChild(card('ข้อความสำเร็จรูปสำหรับเวชระเบียน',nb2));
  return w;
}

/* ───────── ⑰ พิมพ์ใบสรุปผู้ป่วย ───────── */
function printSummary(p){
  const lv=lastVisit(p), lm=lastMammoDate(p), icd=suggestICD(p);
  const hh=bestHistology(p), gg=bestGrade(p), bio=bestBio(p), bs=bestSize(p), ns=nodeSummary(p);
  const rows=a=>a.map(([k,v])=>`<tr><th>${esc(k)}</th><td>${v}</td></tr>`).join('');
  const pl=sortedPaths(p).slice().sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const mms=[...(p.mammos||[])].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const rcs=[...(p.recurrences||[])].sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const w=window.open('','_blank');
  if(!w){ toast('เบราว์เซอร์บล็อกหน้าต่างพิมพ์','err'); return; }
  w.document.write(`<html><head><meta charset="utf-8"><title>ใบสรุปผู้ป่วย ${esc(p.hn)}</title>
  <style>
    body{font-family:"Sarabun","Noto Sans Thai",sans-serif;font-size:12.5px;padding:16px;color:#111}
    h1{font-size:17px;margin:0 0 3px}
    h2{font-size:13.5px;margin:14px 0 5px;border-bottom:1px solid #999;padding-bottom:3px}
    table{width:100%;border-collapse:collapse;margin-bottom:5px}
    th{text-align:left;vertical-align:top;color:#555;font-weight:600;padding:3px 8px 3px 0;font-size:12px;
       width:160px;white-space:nowrap}
    td{padding:3px 0;vertical-align:top}
    .hd{border-bottom:2px solid #111;padding-bottom:5px;margin-bottom:9px}
    .muted{color:#666;font-size:11.5px}
    .lst{margin:0;padding-left:16px} .lst li{margin-bottom:2px}
    pre{white-space:pre-wrap;font-family:inherit;font-size:12px;border:1px solid #ccc;padding:8px;margin:0}
    @page{margin:13mm}
  </style></head><body>
  <div class="hd"><h1>ใบสรุปผู้ป่วยมะเร็งเต้านม</h1>
    <div class="muted">${APP_NAME} v${APP_VER} · พิมพ์เมื่อ ${fmtDate(todayISO())}</div></div>

  <h2>ข้อมูลทั่วไป</h2><table>${rows([
    ['HN / ชื่อ-สกุล',`${esc(p.hn||'-')}${PRIV.storeNames&&p.name?' — '+esc(p.name):''}`],
    ['เพศ / อายุปัจจุบัน',`${esc(p.sex)} / ${ageText(p.dob)}`],
    ['วันเกิด',fmtDate(p.dob)],
    ['วันที่วินิจฉัย',`${fmtDate(p.dxDate)} (อายุ ${ageText(p.dob,p.dxDate)})`],

function viewStats(){
  const root=el('div'), P=S.patients;
  const count=fn=>{const m={};P.forEach(p=>{const ks=fn(p);(Array.isArray(ks)?ks:[ks]).forEach(k=>{
    const kk=k||'ไม่ระบุ'; m[kk]=(m[kk]||0)+1;});});return m;};
  const ages=P.map(p=>ageAt(p.dob)).filter(Boolean).map(a=>a.y);
  const avgAge=ages.length?Math.round(ages.reduce((a,b)=>a+b,0)/ages.length):0;
  const durs=P.map(p=>p.hx.noSymptom?null:durMonths(p.hx.durValue,p.hx.durUnit)).filter(x=>x!==null&&!isNaN(x));
  const avgDur=durs.length?Math.round(durs.reduce((a,b)=>a+b,0)/durs.length*10)/10:0;
  const visits=P.reduce((s,p)=>s+(p.visits||[]).length,0);
  const recN=P.filter(p=>(p.recurrences||[]).length).length;

  const top=el('div','grid'); top.style.marginBottom='14px';
  [['ผู้ป่วยทั้งหมด',P.length],['อายุเฉลี่ย',avgAge?avgAge+' ปี':'—'],
   ['ระยะเวลาก่อนมาพบแพทย์ (เฉลี่ย)',avgDur?avgDur+' เดือน':'—'],
   ['บันทึกการตรวจทั้งหมด',visits],['ผู้ป่วยที่เคยกลับเป็นซ้ำ',recN]]
  .forEach(([l,n])=>top.appendChild(el('div','stat',`<div class="n">${n}</div><div class="l">${l}</div>`)));
  root.appendChild(top);

  const chart=(title,map)=>{
    const b=el('div'), keys=Object.keys(map).sort((x,y)=>map[y]-map[x]);
    if(!keys.length){ b.appendChild(el('div','hint','ไม่มีข้อมูล')); return card(title,b); }
    const max=Math.max(1,...Object.values(map));
    keys.forEach(k=>{
      const r=el('div','barrow');
      r.innerHTML=`<div title="${esc(k)}" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(k)}</div>
        <div><div class="bar" style="width:${Math.round(map[k]/max*100)}%"></div></div>
        <div style="text-align:right;font-weight:650">${map[k]}</div>`;
      b.appendChild(r);
    });
    return card(title,b);
  };
  const g=el('div','grid two');
  g.appendChild(chart('จำแนกตามสถานะการติดตาม',count(p=>statusOf(p))));
  g.appendChild(chart('จำแนกตามระยะโรคที่ใช้อ้างอิง',count(p=>{const c=currentStage(p);
    return c?`${c.prefix}Stage ${c.v}`:'ไม่ระบุ';})));
  g.appendChild(chart('จำแนกตาม Molecular subtype',count(p=>subtype(bestBio(p)))));
  g.appendChild(chart('จำแนกตาม Histology',count(p=>{const h=bestHistology(p);return h?h.v:'ไม่ระบุ';})));
  g.appendChild(chart('อาการที่มาพบแพทย์',count(p=>(p.hx.symptoms||[]).length?p.hx.symptoms:['ไม่ระบุ'])));
  g.appendChild(chart('การผ่าตัดที่เต้านม',count(p=>p.tx.breastSurgery.type)));
  g.appendChild(chart('การผ่าตัดที่รักแร้',count(p=>p.tx.axSurgery.type)));
  g.appendChild(chart('ยาฮอร์โมน',count(p=>p.tx.endocrine.drug)));
  g.appendChild(chart('ประวัติมะเร็งในครอบครัว',count(p=>{const f=p.familyHx||{};
    if(f.none) return ['ไม่มี']; if(!(f.types||[]).length) return ['ไม่ระบุ']; return f.types;})));
  g.appendChild(chart('ชนิดการกลับเป็นซ้ำ',count(p=>(p.recurrences||[]).map(r=>r.type||'ไม่ระบุชนิด'))));
  root.appendChild(g);
  return root;
}
