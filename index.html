function migrate(o){
  const p=blankPatient();
  if(!o) return p;
  Object.assign(p,{id:o.id||p.id,hn:o.hn||'',name:o.name||'',sex:o.sex||'หญิง',dob:o.dob||'',
    dxDate:o.dxDate||'',status:o.status||'ผู้ป่วยใหม่',comorbid:o.comorbid||[],
    comorbidOther:o.comorbidOther||'',nextAppt:o.nextAppt||'',
    createdAt:o.createdAt,updatedAt:o.updatedAt,updatedBy:o.updatedBy});

  /* familyHx */
  if(typeof o.familyHx==='string'){
    const s=o.familyHx;
    p.familyHx={none:s==='ไม่มี',unknown:s==='ไม่ทราบ',types:[],relatives:[]};
    if(/เต้านม/.test(s)) p.familyHx.types.push('มะเร็งเต้านม');
    if(/รังไข่/.test(s)) p.familyHx.types.push('มะเร็งรังไข่');
  }else if(o.familyHx&&typeof o.familyHx==='object'){
    p.familyHx={none:!!o.familyHx.none,unknown:!!o.familyHx.unknown,
      types:o.familyHx.types||[],relatives:o.familyHx.relatives||[]};
  }

  /* hx: จาก dx เดิม หรือ hx ใหม่ */
  const src=o.hx||o.dx||{};
  Object.assign(p.hx,{ symptoms:src.symptoms||[], symptomOther:src.symptomOther||'',
    noSymptom:!!src.noSymptom, durValue:src.durValue??'', durUnit:src.durUnit||'เดือน',
    locations:src.locations||[], locDist:src.locDist||{},
    clinSize:src.clinSize??src.sizeCm??'',
    invasion:src.invasion||[], clinNodes:src.clinNodes||[] });

  /* stage — แปลงรหัส T/N/M รุ่นเก่าให้ตรงกับรายการ AJCC ปัจจุบัน */
  const normT=t=>{ if(!t) return ''; if(t==='Tis') return 'Tis (DCIS)'; if(t==='Tx') return 'TX'; return t; };
  const normN=n=>{ if(!n) return ''; if(n==='Nx') return 'NX'; return n; };
  const st=o.stage||{};
  /* ค่า T/N ที่เคยกรอกเอง → ย้ายไปเป็น *Manual (ระบบจะคำนวณอัตโนมัติเป็นหลัก) */
  Object.assign(p.stage,{
    cM:st.cM??(o.dx?o.dx.cM:'')??'M0',
    cTManual:normT(st.cTManual??st.cT??(o.dx?o.dx.cT:'')??''),
    cNManual:normN(st.cNManual??st.cN??(o.dx?o.dx.cN:'')??''),
    pTManual:normT(st.pTManual??st.pT??''),
    pNManual:normN(st.pNManual??st.pN??''),
    cStageManual:st.cStageManual??(o.dx?o.dx.stage:'')??'',
    pStageManual:st.pStageManual||'',
    pPrefix:st.pPrefix||'p', pcr:st.pcr||'ไม่ประเมิน',
    nodeSuffix:st.nodeSuffix||'ไม่ระบุ', icdManual:st.icdManual||'' });
  if(o.tx&&o.tx.chemo&&o.tx.chemo.timing==='Neoadjuvant') p.stage.pPrefix='yp';
  p.statusManual=o.statusManual||'';
  /* สถานะเดิมที่ระบบคำนวณเองไม่ได้ ให้คงเป็นการระบุเอง */
  if(!p.statusManual&&['เสียชีวิต','ขาดการติดตาม'].includes(o.status)) p.statusManual=o.status;
  p.otherImg=(o.otherImg||[]).map(x=>Object.assign(blankOtherImg(),x,{src:x.src||'ไม่ระบุ'}));
  p.gyn=(o.gyn||[]).map(x=>Object.assign(blankGyn(),x,{src:x.src||'ไม่ระบุ'}));

  /* paths: จาก biopsies เดิม + ผลใน dx เดิม */
  if(Array.isArray(o.paths)&&o.paths.length){
    p.paths=o.paths.map(x=>{
      const np=Object.assign(blankPath(x.kind),x);
      /* ถ้าเคยมี nodesPos แต่ไม่มี metSize ให้เดาว่าเป็น macrometastasis */
      if(np.nodesPos!==''&&+np.nodesPos>0&&(!x.metSize)) np.metSize='Macrometastasis (>2.0 มม.)';
      if(np.nodesPos==='0'&&(!x.metSize)) np.metSize='ไม่พบเซลล์มะเร็ง';
      np.src=x.src||'ไม่ระบุ';          /* M6 — ข้อมูลเก่าไม่รู้ที่มาจริง */
      delete np.pT; delete np.pN;
      return np;
    });
  }else{
    (o.biopsies||[]).forEach(b=>{
      const np=blankPath('CNB');
      Object.assign(np,{id:b.id||uid(),date:b.date||'',
        method:(b.method||'').replace(/^CNB — /,'')||'Ultrasound guided',
        locations:b.locations||[],resultDate:b.resultDate||'',histology:b.path||'',
        grade:b.grade||'',er:b.er||'',pr:b.pr||'',her2:b.her2||'',ki67:b.ki67||'',
        pathNo:b.pathNo||'',note:b.note||''});
      if(/Excisional/i.test(b.method||'')) np.kind='Excisional biopsy';
      p.paths.push(np);
    });
    /* ผลชิ้นเนื้อหลักที่เคยเก็บใน dx → definitive surgery record */
    const d=o.dx||{};
    const hasBio=d.histology||d.er||d.pr||d.her2||d.ki67||d.grade;
    const opd=o.tx?((o.tx.breastSurgery&&o.tx.breastSurgery.date)||(o.tx.surgery&&o.tx.surgery.date)):'';
    if(hasBio){
      const np=blankPath(opd?'Definitive surgery':'CNB');
      np.date=opd||o.dxDate||''; np.resultDate=np.date;
      np.histology=d.histology||''; np.grade=d.grade||'';
      np.er=d.er||''; np.pr=d.pr||''; np.her2=d.her2||''; np.ki67=d.ki67||'';
      if(o.tx){
        const bs=o.tx.breastSurgery||o.tx.surgery||{};
        const ax=o.tx.axSurgery||o.tx.surgery||{};
        np.margin=bs.margin||''; np.pathSize=bs.pathSize||'';
        np.nodesTotal=ax.nodesTotal||''; np.nodesPos=ax.nodesPos||''; np.ene=ax.ene||'ไม่ระบุ';
      }
      p.paths.push(np);
    }
  }

  /* mammos */
  p.mammos=(o.mammos||[]).map(m=>Object.assign(blankMammo(),m,{src:m.src||'ไม่ระบุ'}));
  if(o.lastMammo&&!p.mammos.some(m=>m.date===o.lastMammo)){
    const nm=blankMammo(); nm.date=o.lastMammo; nm.phase='ติดตามหลังรักษา';
    nm.modality='Mammogram'; nm.impression='(นำเข้าจากข้อมูลเดิม)'; p.mammos.push(nm);
  }

  /* tx */
  if(o.tx){
    const t=o.tx;
    if(t.breastSurgery) Object.assign(p.tx.breastSurgery,{
      type:t.breastSurgery.type||'',date:t.breastSurgery.date||'',side:t.breastSurgery.side||'',
      reconstruction:t.breastSurgery.reconstruction||'ไม่ได้ทำ',note:t.breastSurgery.note||''});
    else if(t.surgery){
      const old=t.surgery.type||''; let bs=old, ax=t.surgery.axilla||'ไม่ได้ทำ';
      if(/Simple mastectomy \+ SLNB/.test(old)){bs='Total (Simple) mastectomy';
        if(ax==='ไม่ได้ทำ') ax='Sentinel lymph node biopsy (SLNB)';}
      if(/^Breast conserving/.test(old)) bs='Breast conserving surgery (BCS) / Lumpectomy';
      if(/^Total mastectomy/.test(old)) bs='Total (Simple) mastectomy';
      if(/^Skin-sparing/.test(old)) bs='Skin-sparing mastectomy (SSM)';
      if(/^Nipple-sparing/.test(old)) bs='Nipple-sparing mastectomy (NSM)';
      if(/SLNB \+ ALND/.test(ax)) ax='SLNB ตามด้วย ALND';
      Object.assign(p.tx.breastSurgery,{type:bs,date:t.surgery.date||'',note:t.surgery.note||''});
      Object.assign(p.tx.axSurgery,{type:ax,date:t.surgery.date||''});
      p.tx.drainOut=t.surgery.drainOut||'';
    }
    if(t.axSurgery) Object.assign(p.tx.axSurgery,{type:t.axSurgery.type||'ไม่ได้ทำ',date:t.axSurgery.date||'',note:t.axSurgery.note||''});
    if(t.drainOut) p.tx.drainOut=t.drainOut;
    ['chemo','rt','endocrine','targeted'].forEach(k=>{ if(t[k]) Object.assign(p.tx[k],t[k]); });
  }

  p.recurrences=(o.recurrences||[]).map(r=>Object.assign(blankRec(),r));

  /* visits */
  p.visits=(o.visits||[]).map(v=>{
    const nv=Object.assign(blankVisit(p),v);
    if(typeof v.duration==='string'&&v.durValue===undefined){
      const map={'ไม่มีอาการ':['',''],'1–3 วัน':['3','วัน'],'ประมาณ 1 สัปดาห์':['1','สัปดาห์'],
        '2–4 สัปดาห์':['3','สัปดาห์'],'1–3 เดือน':['2','เดือน'],'มากกว่า 3 เดือน':['4','เดือน']};
      const mm=map[v.duration];
      if(mm){ nv.durValue=mm[0]; nv.durUnit=mm[1]||'วัน'; nv.noSymptom=(v.duration==='ไม่มีอาการ'); }
      delete nv.duration;
    }
    /* PE เดิม (peNormal/peAbn) → โครงใหม่ */
    if(!v.pe||typeof v.pe!=='object'){
      const pe=blankPE();
      pe.allNormal=v.peNormal!==false;
      (v.peAbn||[]).forEach(a=>{
        if(/ก้อนที่เต้านม|ผิวหนัง|หัวนม/.test(a)) pe.breast.push(a);
        else if(/รักแร้/.test(a)) pe.axilla.push(a);
        else if(/ไหปลาร้า/.test(a)) pe.supra.push(a);
        else pe.ext.push(a);
      });
      if((v.peAbn||[]).length) pe.allNormal=false;
      pe.breastLoc=v.peLoc||[];
      pe.woundActive=!!v.woundActive; pe.wound=v.wound||[]; pe.other=v.peOther||'';
      nv.pe=pe;
    }else{
      nv.pe=Object.assign(blankPE(),v.pe);
      /* B4 — massDist เดิมเป็นค่าเดียว → เก็บต่อตำแหน่ง */
      if(typeof nv.pe.massDist!=='object'||nv.pe.massDist===null){
        const old=nv.pe.massDist, obj={};
        if(old!==''&&old!==undefined&&(nv.pe.breastLoc||[]).length===1) obj[nv.pe.breastLoc[0]]=String(old);
        else if(old!==''&&old!==undefined) obj._all=String(old);
        nv.pe.massDist=obj;
      }
    }
    delete nv.peNormal; delete nv.peAbn; delete nv.peLoc; delete nv.peOther;
    delete nv.wound; delete nv.woundActive; delete nv.bmdDate; delete nv.mammoDate;
    nv.snapshot=v.snapshot||null;
    /* M4 — psych 4 ตัวเลือก → คะแนน distress 0–10 (แปลงได้เฉพาะ "ปกติ") */
    if(v.psych&&v.distress===undefined){
      if(v.psych==='อารมณ์ปกติ ไม่มีความกังวล') nv.distress='0';
      else { nv.distress=''; nv.psychLegacy=v.psych; }
    }
    nv.vtype=v.vtype||'';
    return nv;
  });

  /* ═══════ M1–M6 · กฎแปลงข้อมูล v1.9 → v2.0 ═══════ */

  /* M1 — margin (ข้อความ) → marginInk + marginMm  ·  ห้ามเดาตัวเลข */
  p.paths.forEach(x=>{
    if(x.marginInk) return;                       /* ข้อมูล v2.0 อยู่แล้ว */
    const m=x.margin||'';
    if(m==='Free margin')                { x.marginInk='ไม่มีเซลล์มะเร็งที่ขอบ'; }
    else if(/^Close margin/.test(m))     { x.marginInk='ไม่มีเซลล์มะเร็งที่ขอบ'; x.marginLegacy='<1 มม.'; }
    else if(m==='Positive margin')       { x.marginInk='มีเซลล์มะเร็งที่ขอบ'; }
    else if(m==='ไม่ระบุ')                { x.marginInk='ประเมินไม่ได้'; }
    /* ว่าง → ปล่อยว่าง ให้ missingFor เตือน */
    /* Ki67 ช่วง "10-15" → แยกเป็นตัวเลข */
    if(x.ki67&&!x.ki67Low){
      const mm=String(x.ki67).match(/(\d+(?:\.\d+)?)\s*[-–]\s*(\d+(?:\.\d+)?)/);
      if(mm){ x.ki67Low=mm[1]; x.ki67High=mm[2]; }
      else if(/^\s*\d+(\.\d+)?\s*$/.test(x.ki67)){ x.ki67Low=String(x.ki67).trim(); x.ki67High=x.ki67Low; }
    }
    /* M6 — ที่มาของข้อมูลเก่า: ไม่รู้จริง → "ไม่ระบุ" */
    if(!x.src) x.src='ไม่ระบุ';
  });
  ['mammos','otherImg','gyn'].forEach(k=>(p[k]||[]).forEach(x=>{ if(!x.src) x.src='ไม่ระบุ'; }));

  /* M2 — targeted: object → array */
  const oldTg=o.tx&&o.tx.targeted;
  if(Array.isArray(oldTg)) p.tx.targeted=oldTg.map(x=>Object.assign({id:uid()},x));
  else if(oldTg&&typeof oldTg==='object'){
    p.tx.targeted = (oldTg.drug&&oldTg.drug!=='ไม่ได้รับ')
      ? [{id:uid(),drug:oldTg.drug,start:oldTg.start||'',end:oldTg.end||''}] : [];
  } else p.tx.targeted=[];

  /* endocrine: ฟิลด์ใหม่ end / stopReason / extendedPlan */
  const oe=(o.tx&&o.tx.endocrine)||{};
  p.tx.endocrine.end=oe.end||'';
  p.tx.endocrine.stopReason=oe.stopReason||'';
  p.tx.endocrine.extendedPlan=oe.extendedPlan||'ยังไม่ตัดสินใจ';

  /* ฟิลด์ใหม่ v2.0 — เติมจากไฟล์ถ้ามี ไม่มีก็ใช้ค่าว่าง */
  const cp=(k,def)=>{ if(o[k]&&typeof o[k]==='object') Object.assign(p[k],o[k]); };
  ['menopause','vitals','genomic','germline','fertility','contraception',
   'outcome','research','transferIn'].forEach(k=>cp(k));
  if(!Array.isArray(p.germline.genes)) p.germline.genes=[];
  if(!Array.isArray(p.transferIn.docs)) p.transferIn.docs=[];
  /* B1/T4 — ข้อมูล hx ที่มีอยู่ก่อน v2.0 ไม่รู้ที่มา ห้ามให้ PE เขียนทับอัตโนมัติ */
  if(o.hx&&o.hx.src) { p.hx.src=o.hx.src; p.hx.srcAt=o.hx.srcAt||''; }
  else if(hxHasData(p)) { p.hx.src='import'; p.hx.srcAt=''; }
  p.bone=(o.bone||[]).map(x=>Object.assign(blankBone(),x));
  p.todos=(o.todos||[]).map(x=>Object.assign(blankTodo(),x));

  return p;
}

/* ───────── ⑦ ค่าที่คำนวณจากข้อมูล (ลดการกรอกซ้ำ) ───────── */
const PATH_RANK={'Definitive surgery':3,'Excisional biopsy':2,'CNB':1};
function sortedPaths(p){
  return [...(p.paths||[])].sort((a,b)=>
    (PATH_RANK[b.kind]||0)-(PATH_RANK[a.kind]||0) || (b.date||'').localeCompare(a.date||''));
}
/** ผลชิ้นเนื้อที่น่าเชื่อถือที่สุดสำหรับ field ที่ระบุ */
function bestPathFor(p,field){
  return sortedPaths(p).find(x=>x[field]&&!/Non-diagnostic/i.test(x.histology||''))||null;
}
function bestHistology(p){ const r=bestPathFor(p,'histology'); return r?{v:r.histology,src:r}:null; }
function bestGrade(p){ const r=bestPathFor(p,'grade'); return r?{v:r.grade,src:r}:null; }
function bestBio(p){
  const out={};
  ['er','pr','her2','ki67'].forEach(k=>{ const r=bestPathFor(p,k); if(r) out[k]={v:r[k],src:r}; });
  return out;
}
/** ขนาดก้อน: pathology > imaging > ตรวจร่างกาย */
function bestSize(p){
  const ps=bestPathFor(p,'pathSize');
  if(ps) return {v:ps.pathSize,src:'ผลชิ้นเนื้อ',srcEN:'pathology',rec:ps};
  const im=[...(p.mammos||[])].filter(m=>m.sizeCm).sort((a,b)=>(b.date||'').localeCompare(a.date||''))[0];
  if(im) return {v:im.sizeCm,src:`ภาพวินิจฉัย (${im.modality||'imaging'})`,srcEN:'imaging',rec:im};
  if(p.hx.clinSize) return {v:p.hx.clinSize,src:'ตรวจร่างกาย',srcEN:'clinical examination',rec:null};
  return null;
}
function nodeSummary(p){
  const r=sortedPaths(p).find(x=>x.nodesTotal||x.nodesPos);
  if(!r) return null;
  return {pos:r.nodesPos||'0',total:r.nodesTotal||'-',ene:r.ene||'ไม่ระบุ',rec:r};
}
function subtype(b){
  const er=b.er?.v, pr=b.pr?.v, her2=b.her2?.v;
  if(!er&&!pr&&!her2) return '';
  const hr=er==='Positive'||pr==='Positive', h2=/Positive/.test(her2||'');
  if(hr&&h2) return 'HR+ / HER2+';
  if(hr&&!h2) return 'HR+ / HER2− (Luminal)';
  if(!hr&&h2) return 'HR− / HER2+';
  if(er==='Negative'&&pr==='Negative'&&/Negative/.test(her2||'')) return 'Triple negative';
  return '';
}

/* ───────── AJCC 8th anatomic stage (Table 1 & 2) ─────────
   T1 includes T1mi · T0/T1 + N1mi = IB · T2/T3/T4 + N1mi ใช้เกณฑ์ N1
   M0 includes M0(i+) · pM0 ไม่มีในระบบ (M0 เป็น clinical เสมอ)
   pCR หลัง neoadjuvant → ไม่กำหนด anatomic stage group            */
function tGroup(t){
  if(!t||t==='TX') return null;
  if(/^Tis/.test(t)) return 'Tis';
  if(t==='T0') return 'T0';
  if(/^T1/.test(t)) return 'T1';          // รวม T1mi, T1a-c
  if(t==='T2') return 'T2';
  if(t==='T3') return 'T3';
  if(/^T4/.test(t)) return 'T4';
  return null;
}
function nGroup(n){
  if(!n||n==='NX') return null;
  if(n==='N1mi') return 'N1mi';
  if(/^N0/.test(n)) return 'N0';          // รวม N0(i+), N0(mol+)
  if(/^N1/.test(n)) return 'N1';          // รวม N1a, N1b, N1c
  if(/^N2/.test(n)) return 'N2';
  if(/^N3/.test(n)) return 'N3';
  return null;
}
function mGroup(m){
  if(!m) return null;
  if(m==='M1') return 'M1';
  if(/^M0/.test(m)) return 'M0';          // รวม M0(i+)
  return null;
}
/** ขนาดก้อน (ซม.) → T category ตาม AJCC */
function suggestT(cm){
  const mm=parseFloat(cm)*10;
  if(isNaN(mm)||mm<=0) return '';
  if(mm<=1) return 'T1mi';
  if(mm<=5) return 'T1a';
  if(mm<=10) return 'T1b';
  if(mm<=20) return 'T1c';
  if(mm<=50) return 'T2';
  return 'T3';
}
/** คืน {stage, note} */
function calcStage(T,N,M){
  const t=tGroup(T), m=mGroup(M)||'M0';
  let n=nGroup(N);
  if(m==='M1') return {stage:'IV',note:'Any T, Any N, M1'};
  if(!t||!n) return {stage:'',note:''};
  if(n==='N3') return {stage:'IIIC',note:'Any T, N3, M0'};
  /* Note 3: T2/T3/T4 ที่มี N1mi ให้ใช้เกณฑ์ N1 */
  let nApplied=n, note='';
  if(n==='N1mi'&&['T2','T3','T4'].includes(t)){ nApplied='N1'; note='N1mi ใน T2/T3/T4 ใช้เกณฑ์ N1'; }
  const T0T1=['T0','T1'].includes(t);
  if(t==='Tis'&&nApplied==='N0') return {stage:'0',note};
  if(t==='T1'&&nApplied==='N0') return {stage:'IA',note};
  if(T0T1&&nApplied==='N1mi') return {stage:'IB',note:'T0/T1 + N1mi = Stage IB'};
  if(T0T1&&nApplied==='N1') return {stage:'IIA',note};
  if(t==='T2'&&nApplied==='N0') return {stage:'IIA',note};
  if(t==='T2'&&nApplied==='N1') return {stage:'IIB',note};
  if(t==='T3'&&nApplied==='N0') return {stage:'IIB',note};
  if(['T0','T1','T2'].includes(t)&&nApplied==='N2') return {stage:'IIIA',note};
  if(t==='T3'&&['N1','N2'].includes(nApplied)) return {stage:'IIIA',note};
  if(t==='T4'&&['N0','N1','N2'].includes(nApplied)) return {stage:'IIIB',note};
  return {stage:'',note:'ไม่มี stage group ตามตาราง AJCC สำหรับ '+T+N+M};
}
/* ═══════════════════════════════════════════════════════════
   เครื่องคำนวณ T / N / M อัตโนมัติจากข้อมูลต้นทาง
   หลักการ: แก้ที่ต้นทาง ไม่แก้ที่ปลายทาง
   ทุกฟังก์ชันคืน {v, why, src} — why = เหตุผลที่ได้ค่านี้
   ═══════════════════════════════════════════════════════════ */

/** ขนาดจากภาพวินิจฉัย (ก่อนผ่าตัด) — ใช้กับ cT */
function imagingSize(p){
  const opd=p.tx.breastSurgery.date;
  const pre=(p.mammos||[]).filter(m=>m.sizeCm&&(!opd||!m.date||m.date<=opd))
    .sort((a,b)=>(b.date||'').localeCompare(a.date||''))[0];
  return pre?{v:pre.sizeCm,rec:pre}:null;
}
/** T4 จากการลุกลาม — ไม่ขึ้นกับขนาด (AJCC: tumor of any size with direct extension) */
function invasionT(p){
  const inv=(p.hx.invasion||[]).filter(x=>x&&x!=='ไม่มีการลุกลาม'&&x!=='ไม่ทราบ — ไม่มีเอกสาร');
  if(!inv.length) return null;
  const chest=inv.includes('ติดผนังทรวงอก (chest wall)');
  const skin=inv.some(x=>/ulceration|peau|Satellite/i.test(x));
  const infl=inv.includes('Inflammatory carcinoma');
  if(infl) return {v:'T4d',why:'Inflammatory carcinoma'};
  if(chest&&skin) return {v:'T4c',why:'ลุกลามทั้งผนังทรวงอกและผิวหนัง'};
  if(chest) return {v:'T4a',why:'ลุกลามผนังทรวงอก'};
  if(skin) return {v:'T4b',why:'ลุกลามผิวหนัง ('+inv.filter(x=>/ulceration|peau|Satellite/i.test(x)).join(', ')+')'};
  return null;
}
/** histology ที่เป็น in-situ → Tis */
function insituT(p){
  const h=bestHistology(p); if(!h) return null;
  if(/^DCIS$/i.test(h.v)) return {v:'Tis (DCIS)',why:`ผลชิ้นเนื้อเป็น DCIS (${h.src.kind})`};
  return null;
}
/** cT อัตโนมัติ: manual > การลุกลาม(T4) > in-situ > ขนาดจากภาพ > ขนาดจากคลำ */
function autoCT(p){
  const m=p.stage.cTManual;
  if(m) return {v:m,why:'กำหนดเอง',manual:true};
  const inv=invasionT(p); if(inv) return {v:inv.v,why:inv.why,srcTab:'hx'};
  const ins=insituT(p);   if(ins) return {v:ins.v,why:ins.why,srcTab:'path'};
  const im=imagingSize(p);
  if(im){ const t=suggestT(im.v);
    if(t) return {v:t,why:`ขนาด ${im.v} ซม. จากภาพวินิจฉัย (${im.rec.modality||''} ${fmtDate(im.rec.date)})`,srcTab:'img'}; }
  if(p.hx.clinSize){ const t=suggestT(p.hx.clinSize);
    if(t) return {v:t,why:`ขนาด ${p.hx.clinSize} ซม. จากการตรวจร่างกาย`,srcTab:'hx'}; }
  return {v:'',why:'',need:'ขนาดก้อน (จากภาพวินิจฉัยหรือการตรวจร่างกาย) หรือระบุการลุกลาม',srcTab:'hx'};
}
/** cN อัตโนมัติจากต่อมน้ำเหลืองที่คลำได้/เห็นจากภาพ */
function autoCN(p){
  const m=p.stage.cNManual;
  if(m) return {v:m,why:'กำหนดเอง',manual:true};
  const cn=(p.hx.clinNodes||[]).filter(x=>x&&x!=='ไม่พบต่อมน้ำเหลืองโต'&&x!=='ไม่ทราบ — ไม่มีเอกสาร');
  const none=(p.hx.clinNodes||[]).includes('ไม่พบต่อมน้ำเหลืองโต');
  const unk=(p.hx.clinNodes||[]).includes('ไม่ทราบ — ไม่มีเอกสาร');
  /* ต่อมโตจากภาพวินิจฉัย */
  const mmNode=(p.mammos||[]).some(m2=>(m2.findings||[]).includes('Axillary lymphadenopathy'));
  const supra=cn.includes('ต่อม supraclavicular โต');
  const infra=cn.includes('ต่อม infraclavicular (level III) โต');
  const im=cn.includes('ต่อม internal mammary โต');
  const fixed=cn.includes('ต่อมรักแร้ติดกัน/ยึดติด (fixed หรือ matted)');
  const movable=cn.includes('ต่อมรักแร้โต เคลื่อนที่ได้ (movable)');
  if(supra) return {v:'N3c',why:'คลำได้ต่อม supraclavicular โต',srcTab:'hx'};
  if(infra) return {v:'N3a',why:'คลำได้ต่อม infraclavicular (level III) โต',srcTab:'hx'};
  if(im&&(fixed||movable)) return {v:'N3b',why:'ต่อม internal mammary โต ร่วมกับต่อมรักแร้โต',srcTab:'hx'};
  if(fixed) return {v:'N2a',why:'ต่อมรักแร้ติดกัน/ยึดติด (fixed หรือ matted)',srcTab:'hx'};
  if(im) return {v:'N2b',why:'ต่อม internal mammary โต โดยไม่มีต่อมรักแร้โต',srcTab:'hx'};
  if(movable) return {v:'N1',why:'คลำได้ต่อมรักแร้โต เคลื่อนที่ได้',srcTab:'hx'};
  if(mmNode) return {v:'N1',why:'พบ axillary lymphadenopathy จากภาพวินิจฉัย',srcTab:'img'};
  if(none) return {v:'N0',why:'ตรวจไม่พบต่อมน้ำเหลืองโต',srcTab:'hx'};
  if(unk) return {v:'',why:'',need:'ไม่มีเอกสารผลตรวจต่อมน้ำเหลือง — คำนวณ cN ไม่ได้',srcTab:'hx'};
  return {v:'',why:'',need:'ผลตรวจต่อมน้ำเหลือง (คลำ/ภาพ)',srcTab:'hx'};
}
/** ผลชิ้นเนื้อที่ใช้กำหนด pT/pN — Definitive surgery ก่อน แล้วค่อย Excisional */
function stagingPath(p){
  return sortedPaths(p).find(x=>x.kind!=='CNB'&&(x.pathSize||x.nodesTotal||x.nodesPos))||
         sortedPaths(p).find(x=>x.kind!=='CNB')||null;
}
/** pT อัตโนมัติ: manual > การลุกลาม(T4) > in-situ > ขนาดจาก pathology */
function autoPT(p){
  const m=p.stage.pTManual;
  if(m) return {v:m,why:'กำหนดเอง',manual:true};
  const inv=invasionT(p); if(inv) return {v:inv.v,why:inv.why,srcTab:'hx'};
  const ins=insituT(p);   if(ins) return {v:ins.v,why:ins.why,srcTab:'path'};
  const sp=bestPathFor(p,'pathSize');
  if(sp){ const t=suggestT(sp.pathSize);
    if(t) return {v:t,why:`ขนาด ${sp.pathSize} ซม. จากผลชิ้นเนื้อ (${sp.kind})`,srcTab:'path'}; }
  return {v:'',why:'',need:'ขนาดก้อนจาก pathology (แท็บ Patho → Definitive surgery)',srcTab:'path'};
}
/** pN อัตโนมัติจากจำนวนต่อม + ขนาด metastasis + internal mammary + supraclav */
function autoPN(p){
  const sp0=stagingPath(p);
  if(sp0&&(sp0.metSize==='ไม่ทราบ — ไม่มีเอกสาร'||sp0.imNode==='ไม่ทราบ — ไม่มีเอกสาร')&&!p.stage.pNManual)
    return {v:'',why:'',need:'ไม่มีเอกสารผลต่อมน้ำเหลือง — คำนวณ pN ไม่ได้',srcTab:'path'};
  const m=p.stage.pNManual;
  if(m) return {v:m,why:'กำหนดเอง',manual:true};
  const r=stagingPath(p);
  if(!r||(r.nodesTotal===''&&r.nodesPos==='')) 
    return {v:'',why:'',need:'จำนวนต่อมน้ำเหลืองที่ตรวจและที่พบมะเร็ง (แท็บ Patho)',srcTab:'path'};
  const pos=parseInt(r.nodesPos,10);
  const tot=parseInt(r.nodesTotal,10);
  if(isNaN(pos)) return {v:'',why:'',need:'จำนวนต่อมน้ำเหลืองที่พบมะเร็ง',srcTab:'path'};
  const met=r.metSize||'ไม่พบเซลล์มะเร็ง';
  const imN=r.imNode||'ไม่ได้ตรวจ/ไม่พบ';
  const imSn=/sentinel/i.test(imN), imImg=/imaging|ภาพ/i.test(imN);
  const supra=!!r.supraclav, infra=!!r.infraclav;
  const W=[];
  if(!isNaN(tot)) W.push(`ต่อมที่ตรวจ ${tot} ต่อม`);
  W.push(`พบมะเร็ง ${pos} ต่อม`);

  if(supra) return {v:'N3c',why:W.concat('พบที่ต่อม supraclavicular').join(', '),srcTab:'path'};
  if(infra) return {v:'N3a',why:W.concat('พบที่ต่อม infraclavicular (level III)').join(', '),srcTab:'path'};
  if(pos>=10) return {v:'N3a',why:W.concat('≥10 ต่อม').join(', '),srcTab:'path'};
  if(pos>=4&&pos<=9&&imImg) return {v:'N3b',why:W.concat('4–9 ต่อม ร่วมกับ internal mammary จากภาพ').join(', '),srcTab:'path'};
  if(pos>=1&&pos<=3&&imImg) return {v:'N3b',why:W.concat('1–3 ต่อม ร่วมกับ internal mammary จากภาพ (pN1a + cN2b)').join(', '),srcTab:'path'};
  if(pos>=4&&pos<=9) return {v:'N2a',why:W.concat('4–9 ต่อม').join(', '),srcTab:'path'};
  if(pos===0&&imImg) return {v:'N2b',why:W.concat('internal mammary จากภาพ โดยต่อมรักแร้ไม่พบมะเร็ง').join(', '),srcTab:'path'};
  if(pos>=1&&pos<=3&&imSn) return {v:'N1c',why:W.concat('1–3 ต่อม ร่วมกับ internal mammary จาก sentinel').join(', '),srcTab:'path'};
  if(pos>=1&&pos<=3){
    if(/ITC/i.test(met)) return {v:'N0(i+)',why:W.concat('พบเฉพาะ ITC (≤0.2 มม.)').join(', '),srcTab:'path'};
    if(/Micro/i.test(met)) return {v:'N1mi',why:W.concat('micrometastasis (>0.2–2.0 มม.)').join(', '),srcTab:'path'};
    return {v:'N1a',why:W.concat('1–3 ต่อม (macrometastasis)').join(', '),srcTab:'path'};
  }
  if(pos===0&&imSn) return {v:'N1b',why:W.concat('internal mammary จาก sentinel โดยต่อมรักแร้ไม่พบมะเร็ง').join(', '),srcTab:'path'};
  if(pos===0){
    if(/ITC/i.test(met)) return {v:'N0(i+)',why:W.concat('พบเฉพาะ ITC (≤0.2 มม.)').join(', '),srcTab:'path'};
    return {v:'N0',why:W.concat('ไม่พบการแพร่กระจายไปต่อมน้ำเหลือง').join(', '),srcTab:'path'};
  }
  return {v:'',why:'',need:'ข้อมูลต่อมน้ำเหลืองไม่สมบูรณ์',srcTab:'path'};
}
/** M อัตโนมัติ: M1 ถ้ามีบันทึกการแพร่กระจาย หรือผลภาพระบบอื่นพบ metastasis */
function autoM(p){
  const rec=(p.recurrences||[]).find(r=>/Distant metastasis/i.test(r.type||''));
  if(rec) return {v:'M1',why:`มีบันทึกการแพร่กระจายเมื่อ ${fmtDate(rec.date)}${(rec.sites||[]).length?` ที่ ${rec.sites.join(', ')}`:''}`,srcTab:'visits',locked:true};
  const oi=(p.otherImg||[]).find(x=>x.result==='พบการแพร่กระจาย');
  if(oi) return {v:'M1',why:`ผลภาพ ${oi.modality} (${fmtDate(oi.date)}) พบการแพร่กระจาย${(oi.sites||[]).length?` ที่ ${oi.sites.join(', ')}`:''}`,srcTab:'otherimg',locked:true};
  if(p.stage.cM==='M1') return {v:'M1',why:'กำหนดเอง',manual:true,locked:true};
  return {v:p.stage.cM||'M0',why:p.stage.cM==='M0(i+)'?'M0(i+) — นับเป็น M0 ตาม AJCC Note 4':'ไม่มีหลักฐานการแพร่กระจาย'};
}
/** ต่อท้าย (sn)/(f) ตาม AJCC — ใส่ท้าย N category */
function nodeSuffix(p){
  const sfx=p.stage.nodeSuffix||'ไม่ระบุ';
  if(sfx==='ไม่ระบุ') return '';
  return sfx.startsWith('(sn)')?'(sn)':'(f)';
}
function cStageOf(p){
  const s=p.stage;
  const T=autoCT(p), N=autoCN(p), M=autoM(p);
  if(s.cStageManual) return {v:s.cStageManual,auto:false,note:'',T,N,M};
  /* Note 6: M1 → Stage IV เสมอ ไม่ว่าตอบสนองการรักษาอย่างไร */
  if(M.v==='M1') return {v:'IV',auto:true,note:'Any T, Any N, M1 — '+M.why,locked:true,T,N,M};
  const r=calcStage(T.v,N.v,M.v);
  return {v:r.stage,auto:true,note:r.note,T,N,M};
}
function pStageOf(p){
  const s=p.stage;
  const T=autoPT(p), N=autoPN(p), M=autoM(p);
  if(s.pStageManual) return {v:s.pStageManual,auto:false,note:'',T,N,M};
  /* Note 6: M1 ก่อน neoadjuvant → คง Stage IV */
  if(M.v==='M1') return {v:'IV',auto:true,note:'Any T, Any N, M1 — '+M.why,locked:true,T,N,M};
  /* Note 8: pCR หลัง neoadjuvant → ไม่กำหนด anatomic stage group */
  if(s.pcr==='pCR (ypT0/is ypN0)')
    return {v:'',auto:true,pcr:true,
      note:'pCR — AJCC ไม่กำหนด anatomic stage group (เช่น ypT0ypN0cM0)',T,N,M};
  const r=calcStage(T.v,N.v,M.v);
  return {v:r.stage,auto:true,note:r.note,T,N,M};
}
/** ระยะที่ใช้อ้างอิงปัจจุบัน — pTNM มาก่อน cTNM */
function currentStage(p){
  const ps=pStageOf(p), s=p.stage;
  if(ps.v||ps.pcr) return {v:ps.v,prefix:s.pPrefix||'p',T:ps.T.v,N:ps.N.v,M:ps.M.v,
    kind:'path',pcr:ps.pcr,note:ps.note,locked:ps.locked};
  const cs=cStageOf(p);
  if(cs.v) return {v:cs.v,prefix:'c',T:cs.T.v,N:cs.N.v,M:cs.M.v,kind:'clin',
    note:cs.note,locked:cs.locked};
  return null;
}
/** M เป็น clinical เสมอ (AJCC Note 5) — แสดง cM ต่อท้าย */
function stageText(p){
  const st=currentStage(p);
  if(!st) return '';
  if(st.pcr) return `${st.prefix}Stage — ${st.note||'pCR (ไม่กำหนด anatomic stage group)'}`;
  const sfx=nodeSuffix(p);
  const tn=[st.T?st.prefix+st.T:'', st.N?st.prefix+st.N+sfx:''].filter(Boolean).join('');
  const m=st.M?`c${st.M}`:'';
  const tnm=[tn,m].filter(Boolean).join('');
  return `${st.prefix}Stage ${st.v}${tnm?` (${tnm})`:''}`;
}

/* ───────── ICD-10 (แนะนำอัตโนมัติ) ───────── */
const ICD_SITE={UO:'4',UI:'2',LO:'5',LI:'3',central:'1',overlap:'8'};
function suggestICD(p){
  if(p.stage.icdManual) return {code:p.stage.icdManual,label:'(กำหนดเอง)',auto:false};
  const h=bestHistology(p), locs=p.hx.locations||[];
  const sides=new Set(locs.map(c=>c[0]));
  const lat = sides.size>1?'9' : (sides.has('R')?'1':(sides.has('L')?'2':'9'));
  const sexD = p.sex==='ชาย'?'2':'1';
  const hv=h?h.v:'';

  /* in situ */
  if(/^DCIS$/i.test(hv)||/ductal carcinoma in situ/i.test(hv))
    return {code:`D05.1${lat==='9'?'0':lat}`,label:`Ductal carcinoma in situ, ${latTH(lat)}`,auto:true};
  if(/^LCIS/i.test(hv))
    return {code:`D05.0${lat==='9'?'0':lat}`,label:`Lobular carcinoma in situ, ${latTH(lat)}`,auto:true};
  if(/Fibroadenoma/i.test(hv))
    return {code:'D24.'+(lat==='1'?'1':lat==='2'?'2':'9'),label:'Benign neoplasm of breast',auto:true};
  if(/Atypical ductal hyperplasia/i.test(hv))
    return {code:'N60.9',label:'Benign mammary dysplasia (ADH)',auto:true};

  /* invasive / ยังไม่มีผล → มะเร็งเต้านม */
  const quads=[...new Set(locs.map(quadrantOf).filter(Boolean))];
  let site='9', siteLab='ไม่ระบุตำแหน่ง';
  if(quads.length===1){ site=ICD_SITE[quads[0]]||'9'; siteLab=QUAD_TH[quads[0]]; }
  else if(quads.length>1){ site='8'; siteLab='Overlapping sites'; }
  const code=`C50.${site}${sexD}${lat}`;
  return {code,label:`Malignant neoplasm of breast — ${siteLab}, ${latTH(lat)}`,auto:true};
}
function latTH(l){ return l==='1'?'ข้างขวา':l==='2'?'ข้างซ้าย':'ไม่ระบุข้าง'; }

/* ═══════════════════════════════════════════════════════════
   วันรักษาเสร็จสิ้น + ตารางนัดติดตาม + สถานะอัตโนมัติ
   ═══════════════════════════════════════════════════════════ */

/** วันรักษาเสร็จสิ้น = วันที่ช้าที่สุดของ ผ่าตัด / สิ้นสุดเคมี / สิ้นสุดฉายแสง
    (ไม่นับยาฮอร์โมนที่กินต่อเนื่อง) */
function treatmentEndDate(p){
  const c=[];
  if(p.tx.breastSurgery.date) c.push({d:p.tx.breastSurgery.date,what:'ผ่าตัด'});
  if(p.tx.chemo.end) c.push({d:p.tx.chemo.end,what:'สิ้นสุดเคมีบำบัด'});
  if(p.tx.rt.end) c.push({d:p.tx.rt.end,what:'สิ้นสุดฉายแสง'});
  if(!c.length) return null;
  c.sort((a,b)=>(b.d||'').localeCompare(a.d||''));
  return c[0];
}
/** ยังอยู่ระหว่างการรักษาเชิงรุกหรือไม่ */
function activeTreatment(p){
  const t=todayISO();
  if(p.tx.chemo.start&&p.tx.chemo.start<=t&&(!p.tx.chemo.end||p.tx.chemo.end>=t))
    return 'อยู่ระหว่างเคมีบำบัด';
  if(p.tx.rt.start&&p.tx.rt.start<=t&&(!p.tx.rt.end||p.tx.rt.end>=t))
    return 'อยู่ระหว่างฉายแสง';
  const te=treatmentEndDate(p);
  if(!te) return null;
  /* วางแผนเคมี/ฉายแสงไว้แต่ยังไม่เริ่ม */
  if(p.tx.chemo.regimen&&p.tx.chemo.regimen!=='ไม่ได้รับเคมีบำบัด'&&!p.tx.chemo.end)
    return 'มีแผนเคมีบำบัดแต่ยังไม่บันทึกวันสิ้นสุด';
  if(p.tx.rt.start&&!p.tx.rt.end) return 'มีแผนฉายแสงแต่ยังไม่บันทึกวันสิ้นสุด';
  return null;
}
/** ตารางนัดติดตามตามระยะเวลาหลังรักษาเสร็จสิ้น
    0–2 ปี : ตรวจร่างกายทุก 3 เดือน, MMG+US ทุก 6 เดือน
    ปี 3–5 : ปีละครั้ง (ทั้งตรวจร่างกายและ MMG)
    หลัง 5 ปี : ไม่เตือน — ผู้ป่วยตรวจสุขภาพประจำปีเอง */
function followUpPlan(p){
  const te=treatmentEndDate(p);
  if(!te) return {phase:'ยังไม่เริ่ม/ยังไม่จบการรักษา',examMonths:3,mmgMonths:null,
                  done:false,te:null,yrs:null};
  const mo=monthsBetween(te.d,todayISO()); const yrs=(mo||0)/12;
  /* v2.0 (L1) — หลัง 5 ปีไม่หยุดติดตาม แต่เปลี่ยนเป็นปีละครั้ง แมมโมแกรมทุกปีต่อเนื่อง */
  if(yrs>=5) return {phase:'หลัง 5 ปี — ติดตามปีละครั้ง',examMonths:12,mmgMonths:12,
                     done:false,past5:true,te,yrs};
  if(yrs<2) return {phase:'2 ปีแรกหลังการรักษา',examMonths:3,mmgMonths:6,done:false,te,yrs};
  return {phase:'ปีที่ 3–5 หลังการรักษา',examMonths:12,mmgMonths:12,done:false,te,yrs};
}
/** สถานะการติดตาม คำนวณอัตโนมัติ (ระบุเองทับได้) */
function autoStatus(p){
  if(p.statusManual) return {v:p.statusManual,why:'ระบุเอง',manual:true};
  const recs=[...(p.recurrences||[])].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const dist=recs.find(r=>/Distant metastasis/i.test(r.type||''));
  if(dist) return {v:'แพร่กระจาย',why:`มีบันทึกการแพร่กระจายเมื่อ ${fmtDate(dist.date)}`};
  if(recs.length) return {v:'พบการกลับเป็นซ้ำ',
    why:`มีบันทึก ${recs[0].type||'การกลับเป็นซ้ำ'} เมื่อ ${fmtDate(recs[0].date)}`};
  const lv=lastVisit(p);
  if(lv&&(lv.dx||[]).some(d=>/สงสัยการกลับเป็นซ้ำ/.test(d)))
    return {v:'สงสัยการกลับเป็นซ้ำ',why:`การตรวจ ${fmtDate(lv.date)} ระบุว่าสงสัยการกลับเป็นซ้ำ`};
  const hasPath=(p.paths||[]).some(x=>x.histology);
  if(!p.dxDate&&!hasPath) return {v:'ผู้ป่วยใหม่',why:'ยังไม่มีวันวินิจฉัยและผลชิ้นเนื้อ'};
  if(!p.tx.breastSurgery.date&&!p.tx.chemo.start)
    return {v:'ผู้ป่วยใหม่',why:'ยังไม่ได้เริ่มการรักษา (ผ่าตัด/เคมีบำบัด)'};
  const act=activeTreatment(p);
  if(act) return {v:'อยู่ระหว่างขั้นตอนการรักษา',why:act};
  const te=treatmentEndDate(p);
  if(te) return {v:'ไม่พบการกลับเป็นซ้ำ',
    why:`การรักษาเสร็จสิ้นเมื่อ ${fmtDate(te.d)} (${te.what}) — อยู่ในระยะติดตาม`};
  return {v:'อยู่ระหว่างขั้นตอนการรักษา',why:'อยู่ระหว่างการรักษา'};
}
/** สถานะที่ใช้แสดงผลจริง */
function statusOf(p){ return autoStatus(p).v; }

/* ───────── ⑧ การเตือนตามแนวทาง NCCN ───────── */
const PRE_SURV=['ผู้ป่วยใหม่','อยู่ระหว่างขั้นตอนการรักษา'];
const CLOSED=['เสียชีวิต','ขาดการติดตาม'];
function lastVisit(p){
  if(!p.visits||!p.visits.length) return null;
  return [...p.visits].sort((a,b)=>(b.date||'').localeCompare(a.date||''))[0];
}
function lastMammoDate(p){
  const m=[...(p.mammos||[])].filter(x=>x.date).sort((a,b)=>(b.date||'').localeCompare(a.date||''))[0];
  return m?m.date:'';
}
function geneticFlags(p){
  const f=[], fh=p.familyHx||{}, rel=fh.relatives||[], types=fh.types||[];
  const first=['แม่','พี่สาว/น้องสาว','ลูกสาว','พ่อ','พี่ชาย/น้องชาย','ลูกชาย'];
  const youngFirst=rel.filter(r=>r.ageAtDx!==''&&+r.ageAtDx>0&&+r.ageAtDx<50&&first.includes(r.relation));
  const own=ageAt(p.dob,p.dxDate);
  if(own&&own.y<45) f.push('ผู้ป่วยได้รับการวินิจฉัยก่อนอายุ 45 ปี');
  if(youngFirst.length) f.push(`มีญาติสายตรงวินิจฉัยมะเร็งก่อนอายุ 50 ปี (${youngFirst.map(r=>`${r.relation} อายุ ${r.ageAtDx}`).join(', ')})`);
  if(types.includes('มะเร็งตับอ่อน')) f.push('มีประวัติมะเร็งตับอ่อนในครอบครัว');
  if(types.includes('มะเร็งต่อมลูกหมาก')&&(types.includes('มะเร็งเต้านม')||types.includes('มะเร็งรังไข่')))
    f.push('มีมะเร็งต่อมลูกหมากร่วมกับมะเร็งเต้านม/รังไข่ในครอบครัว');
  if(types.includes('มะเร็งรังไข่')) f.push('มีประวัติมะเร็งรังไข่ในครอบครัว');
  if(rel.filter(r=>r.cancer==='มะเร็งเต้านม').length>=2) f.push('มีญาติเป็นมะเร็งเต้านมตั้งแต่ 2 คนขึ้นไป');
  if(p.sex==='ชาย') f.push('ผู้ป่วยเพศชาย');
  const b=bestBio(p), own2=ageAt(p.dob,p.dxDate);
  if(b.er?.v==='Negative'&&b.pr?.v==='Negative'&&/Negative/.test(b.her2?.v||'')&&own2&&own2.y<60)
    f.push('Triple negative และวินิจฉัยก่อนอายุ 60 ปี');
  return f;
}
function lastGynDate(p){
  const g=[...(p.gyn||[])].filter(x=>x.date).sort((a,b)=>(b.date||'').localeCompare(a.date||''))[0];
  return g?g.date:'';
}
function onEndocrine(p){
  const e=p.tx.endocrine||{}, d=e.drug||'';
  if(!d||d==='ไม่ได้รับ') return false;
  if(e.end&&e.end<=todayISO()) return false;        /* v2.0 — หยุดยาแล้ว */
  return true;
}
/** ยาที่ใช้อยู่มี tamoxifen ไหม (→ เฝ้าระวังเยื่อบุโพรงมดลูก) */
function onTamoxifen(p){
  return onEndocrine(p) && /Tamoxifen/i.test(p.tx.endocrine.drug||'');
}
/** ยา/ภาวะที่ทำให้เสียมวลกระดูก (→ เฝ้าระวัง DEXA) */
function onBoneLossRisk(p){
  if(/ตัดรังไข่แล้ว|กดรังไข่/.test((p.menopause&&p.menopause.status)||'')) return true;
  if(!onEndocrine(p)) return false;
  return /\(AI\)|GnRH/i.test(p.tx.endocrine.drug||'');
}
function lastBoneDate(p){
  const b=[...(p.bone||[])].filter(x=>x.date).sort((a,b)=>(b.date||'').localeCompare(a.date||''))[0];
  return b?b.date:'';
}
/** ยามุ่งเป้าที่ยังใช้อยู่ (v2.0 targeted เป็น array) */
function activeTargeted(p){
  return (p.tx.targeted||[]).filter(x=>x.drug&&(!x.end||x.end>=todayISO()));
}
function targetedText(p){
  const a=(p.tx.targeted||[]).map(x=>x.drug).filter(Boolean);
  return a.length?a.join(', '):'ไม่ได้รับ';
}

/* ═══════ v2.0 · ตัวช่วยใหม่ ═══════ */

/** จำแนกกลุ่ม HER2 — คำนวณเอง ไม่ต้องกรอก (M3: ข้อมูลรุ่นเก่าแยก zero/ultralow ไม่ได้) */
function her2Group(p){
  const b=bestBio(p), v=(b.her2&&b.her2.v)||'';
  if(!v) return {v:'ไม่ทราบ',why:'ยังไม่มีผล HER2'};
  if(/Positive/.test(v))              return {v:'HER2-positive',why:v};
  if(/ultralow/i.test(v))             return {v:'HER2-ultralow',why:v};
  if(/ไม่ติดสีเลย/.test(v))            return {v:'HER2-zero',why:v};
  if(/1\+/.test(v))                   return {v:'HER2-low',why:v};
  if(/2\+/.test(v))                   return {v:'HER2-low',why:v+' (ISH negative)'};
  if(v==='Negative (0)')              return {v:'ไม่ทราบระดับ',why:'ข้อมูลรุ่นเก่า — แยก zero/ultralow ไม่ได้ ต้องดูสไลด์ซ้ำ'};
  return {v:'ไม่ทราบ',why:v};
}

/** ตีความขอบชิ้นเนื้อตาม histology (E4) — DCIS ใช้ 2 มม. · invasive ใช้ no ink on tumor */
function marginEval(p,bx){
  const ink=bx.marginInk||'', mm=bx.marginMm;
  if(!ink) return {v:'',why:'ยังไม่ได้บันทึกขอบชิ้นเนื้อ',need:true};
  if(ink==='มีเซลล์มะเร็งที่ขอบ') return {v:'ขอบบวก',lv:'dg',why:'มีเซลล์มะเร็งที่ขอบตัด'};
  if(ink==='ไม่ทราบ — ไม่มีเอกสาร') return {v:'ไม่ทราบ',why:'ไม่มีเอกสารผลชิ้นเนื้อ'};
  if(ink==='ประเมินไม่ได้') return {v:'ประเมินไม่ได้',why:'พยาธิระบุว่าประเมินขอบไม่ได้'};
  const h=(bx.histology||bestHistology(p)?.v||'');
  const isDCIS=/^DCIS/.test(h)&&!/microinvasion/i.test(h);
  if(isDCIS){
    if(mm===''||mm===undefined)
      return {v:'ต้องการตัวเลข',why:'DCIS ใช้เกณฑ์ 2 มม. — ต้องมีระยะขอบเป็นตัวเลข',need:true};
    return +mm<2 ? {v:'ขอบใกล้ (<2 มม.)',lv:'warn',why:`DCIS · ขอบ ${mm} มม. (เกณฑ์ 2 มม.)`}
                 : {v:'ขอบเพียงพอ',lv:'ok',why:`DCIS · ขอบ ${mm} มม.`};
  }
  const extra=(mm!==''&&mm!==undefined)?` · ${mm} มม.`:'';
  return {v:'ขอบเพียงพอ',lv:'ok',why:`Invasive · ไม่มีเซลล์มะเร็งที่ขอบ${extra}`};
}

/** เสี่ยงกลับเป็นซ้ำสูง (ตามที่ตกลง: locally advanced + triple negative) */
function isHighRisk(p){
  const why=[];
  const st=(currentStage(p)||{}).v||'';
  if(/^III/.test(st)) why.push('ระยะ '+st+' (locally advanced)');
  const T=(pStageOf(p).T||cStageOf(p).T||''), N=(pStageOf(p).N||cStageOf(p).N||'');
  if(/^T[34]/.test(T)) why.push(T);
  if(/^N[23]/.test(N)) why.push(N);
  const b=bestBio(p);
  if(b.er?.v==='Negative'&&b.pr?.v==='Negative'&&/Negative/.test(b.her2?.v||''))
    why.push('Triple negative');
  if((p.hx.invasion||[]).some(x=>/Inflammatory/i.test(x))) why.push('Inflammatory carcinoma');
  return {v:why.length>0,why};
}
/** ผ่าตัดแบบเก็บเต้านมไหม (→ ต้องฉายแสง) */
function isBreastConserving(p){
  return /Breast conserving|Lumpectomy|Wide excision|Oncoplastic/i.test(p.tx.breastSurgery.type||'');
}
function isMastectomy(p){
  return /mastectomy|MRM/i.test(p.tx.breastSurgery.type||'');
}
function bmiOf(p){
  const h=+(p.vitals?.height||0), w=+(p.vitals?.weight||0);
  if(!h||!w) return null;
  const b=w/Math.pow(h/100,2);
  return {v:b.toFixed(1), text:b.toFixed(1)+' kg/m²'};
}
function alertsFor(p){
  const out=[], t=todayISO();
  const st=statusOf(p);
  if(CLOSED.includes(st)) return out;
  const pre=PRE_SURV.includes(st);
  const fu=followUpPlan(p);

  /* ---- นัดติดตาม ---- */
  if(p.nextAppt){
    const d=daysBetween(t,p.nextAppt);
    if(d<0) out.push({lv:'dg',k:'appt',msg:`เลยนัดมาแล้ว ${Math.abs(d)} วัน (นัด ${fmtDate(p.nextAppt)})`});
    else if(d<=14) out.push({lv:'warn',k:'appt',msg:`ใกล้ถึงนัด อีก ${d} วัน (${fmtDate(p.nextAppt)})`});
  }else if(p.dxDate&&!pre&&!fu.done)
    out.push({lv:'warn',k:'appt',msg:'ยังไม่ได้กำหนดวันนัดครั้งถัดไป'});

  /* ---- ผลชิ้นเนื้อค้าง ---- */
  (p.paths||[]).forEach(b=>{
    if(b.date&&!b.histology){
      const d=daysBetween(b.date,t);
      if(d!==null&&d>=7) out.push({lv:'warn',k:'path',
        msg:`ทำ ${b.kind} เมื่อ ${fmtDate(b.date)} แล้ว ${d} วัน แต่ยังไม่ได้บันทึกผลชิ้นเนื้อ`});
    }
    if(/Non-diagnostic/.test(b.histology||''))
      out.push({lv:'warn',k:'path',msg:`ผลชิ้นเนื้อ ${fmtDate(b.date)} เป็น Non-diagnostic — ควรทำซ้ำ`});
  });
  (p.mammos||[]).forEach(m=>{
    if(/^(4|5)/.test(m.birads||'')){
      const later=(p.paths||[]).some(b=>b.date&&m.date&&b.date>=m.date);
      if(!later) out.push({lv:'dg',k:'birads',
        msg:`ผลภาพ ${fmtDate(m.date)} เป็น BI-RADS ${m.birads} แต่ยังไม่มีบันทึกการเจาะชิ้นเนื้อตามมา`});
    }
  });
  /* ผลภาพระบบอื่นที่พบผิดปกติแต่ยังไม่สรุป */
  (p.otherImg||[]).forEach(x=>{
    if(x.result==='พบความผิดปกติ — ยังไม่สรุป')
      out.push({lv:'warn',k:'otherimg',
        msg:`ผลภาพ ${x.modality} (${fmtDate(x.date)}) พบความผิดปกติแต่ยังไม่สรุป — ควรติดตาม`});
  });

  /* ---- ข้อมูล staging ที่ยังขาด ---- */
  const opd=p.tx.breastSurgery.date;
  if(opd&&!pStageOf(p).v&&!pStageOf(p).pcr){
    const d=daysBetween(opd,t);
    if(d!==null&&d>=21) out.push({lv:'warn',k:'ptnm',
      msg:`ผ่าตัดเมื่อ ${fmtDate(opd)} แล้ว แต่ยังคำนวณ ${p.stage.pPrefix}TNM ไม่ได้ — ตรวจสอบข้อมูลผลชิ้นเนื้อ`});
  }
  if(pre) return out;
  /* v2.0 (L1) — ครบ 5 ปีแล้วยังติดตามต่อ ไม่ return ออกจากฟังก์ชัน */
  if(fu.past5) out.push({lv:'info',k:'done5y',
    msg:`ครบ 5 ปีหลังการรักษาแล้ว (รักษาเสร็จสิ้น ${fmtDate(fu.te.d)}) — แนะนำติดตามปีละครั้ง และแมมโมแกรมทุกปีต่อเนื่อง`});

  /* ---- Mammogram ตามตารางใหม่ ---- */
  const lm=lastMammoDate(p), mmInt=fu.mmgMonths;
  if(mmInt){
    if(lm){
      const m=monthsBetween(lm,t);
      if(m>=mmInt) out.push({lv:'dg',k:'mammo',
        msg:`ถึงกำหนด mammogram + ultrasound แล้ว (ครั้งล่าสุด ${fmtDate(lm)} — ${m} เดือนก่อน, รอบทุก ${mmInt} เดือนใน${fu.phase})`});
      else if(m>=mmInt-1) out.push({lv:'warn',k:'mammo',
        msg:`ใกล้ครบกำหนด mammogram (ครบ ${fmtDate(addMonths(lm,mmInt))})`});
    }else if(fu.te){
      const m=monthsBetween(fu.te.d,t);
      if(m!==null&&m>=6) out.push({lv:'warn',k:'mammo',
        msg:'รักษาเสร็จสิ้นมาแล้วเกิน 6 เดือน แต่ยังไม่มีบันทึก mammogram'});
    }
  }

  /* ---- v2.0 (L3) นรีเวช เฉพาะผู้ใช้ Tamoxifen ---- */
  if(onTamoxifen(p)){
    const lg=lastGynDate(p);
    if(!lg) out.push({lv:'warn',k:'gyn',
      msg:`ผู้ป่วยใช้ ${p.tx.endocrine.drug} — ควรตรวจภายในปีละครั้ง (ยังไม่มีบันทึก)`});
    else{
      const m=monthsBetween(lg,t);
      if(m>=12) out.push({lv:'dg',k:'gyn',
        msg:`ถึงกำหนดตรวจทางนรีเวชประจำปี (ครั้งล่าสุด ${fmtDate(lg)} — ${m} เดือนก่อน)`});
      else if(m>=11) out.push({lv:'warn',k:'gyn',
        msg:`ใกล้ครบกำหนดตรวจทางนรีเวช (ครบ ${fmtDate(addMonths(lg,12))})`});
    }
  }

  /* ---- ความถี่การตรวจร่างกายตามตารางใหม่ ---- */
  const examInt=fu.examMonths, lv=lastVisit(p);
  if(examInt&&lv){
    const gap=monthsBetween(lv.date,t);
    if(gap>examInt+2) out.push({lv:gap>examInt*2?'dg':'warn',k:'freq',
      msg:`ไม่ได้มาตรวจ ${gap} เดือน (${fu.phase} — ควรตรวจทุก ${examInt} เดือน)`});
  }

  const lv2=lastVisit(p);
  if(lv2&&lv2.pe&&lv2.pe.woundActive&&(lv2.pe.wound||[]).some(w=>w!==PE_WOUND[0][0]))
    out.push({lv:'warn',k:'wound',msg:'ครั้งล่าสุดบันทึกแผลผ่าตัดผิดปกติ — ควรติดตามใกล้ชิด'});

  /* ═══════════ v2.0 · การเตือนทางคลินิก A1–A13 ═══════════ */
  const b=bestBio(p), opd2=p.tx.breastSurgery.date;
  const dAfterOp = opd2 ? daysBetween(opd2,t) : null;
  const ns=nodeSummary(p);

  /* A1 — พิจารณา PMRT */
  if(isMastectomy(p)&&opd2){
    const why=[];
    if(ns&&+ns.pos>0) why.push(`ต่อมน้ำเหลืองบวก ${ns.pos}/${ns.total}`);
    const pT=pStageOf(p).T||'';
    if(/^T[34]/.test(pT)) why.push(pT);
    const mgBad=(p.paths||[]).some(x=>x.kind==='Definitive surgery'&&x.marginInk==='มีเซลล์มะเร็งที่ขอบ');
    if(mgBad) why.push('ขอบชิ้นเนื้อบวก');
    if(why.length&&!p.tx.rt.start)
      out.push({lv:'warn',k:'pmrt',
        msg:`ผ่าตัดเต้านมออกทั้งหมดร่วมกับ ${why.join(' · ')} — พิจารณาฉายแสงหลังผ่าตัด (PMRT) ยังไม่มีบันทึกการฉายแสง`});
  }

  /* A2 — AI ในผู้ที่ยังมีประจำเดือน (อันตราย) */
  const ms=(p.menopause&&p.menopause.status)||'';
  if(onEndocrine(p)&&/\(AI\)/.test(p.tx.endocrine.drug||'')
     &&/ยังมีประจำเดือน|ใกล้หมดประจำเดือน/.test(ms)
     &&!/GnRH/i.test(p.tx.endocrine.drug||''))
    out.push({lv:'dg',k:'aipremeno',
      msg:`ใช้ ${p.tx.endocrine.drug} ขณะที่สถานะคือ "${ms}" โดยไม่มีการกดรังไข่ — ตรวจสอบความเหมาะสมของยา`});

  /* A3 — ER+ แต่ยังไม่ได้เริ่มยาฮอร์โมน */
  if(b.er?.v==='Positive'&&opd2&&dAfterOp!==null&&dAfterOp>90
     &&(p.tx.endocrine.drug==='ไม่ได้รับ'||!p.tx.endocrine.drug))
    out.push({lv:'warn',k:'noendo',
      msg:`ER positive และผ่าตัดมาแล้ว ${Math.floor(dAfterOp/30)} เดือน แต่ยังไม่มีบันทึกยาฮอร์โมน — ได้เริ่มยาแล้วหรือยัง`});

  /* A4 — HER2+ แต่ไม่มียามุ่งเป้า */
  if(/Positive/.test(b.her2?.v||'')&&!(p.tx.targeted||[]).length&&opd2)
    out.push({lv:'dg',k:'noher2tx',
      msg:`HER2 positive (${b.her2.v}) แต่ยังไม่มีบันทึกยามุ่งเป้า anti-HER2 — ได้รับยาแล้วหรือยัง`});

  /* A12 — ผ่าตัดเก็บเต้านมแต่ยังไม่มีบันทึกฉายแสง */
  if(isBreastConserving(p)&&opd2&&dAfterOp!==null&&dAfterOp>90&&!p.tx.rt.start)
    out.push({lv:'warn',k:'nort',
      msg:`ผ่าตัดแบบเก็บเต้านมมาแล้ว ${Math.floor(dAfterOp/30)} เดือน แต่ยังไม่มีบันทึกการฉายแสง — การฉายแสงหลังผ่าตัดเก็บเต้านมเป็นมาตรฐาน`});

  /* A7 — DEXA สำหรับผู้ใช้ AI / GnRH / ตัดรังไข่ */
  if(onBoneLossRisk(p)){
    const lb=lastBoneDate(p);
    if(!lb) out.push({lv:'warn',k:'dexa',
      msg:'ใช้ยา/มีภาวะที่ทำให้เสียมวลกระดูก — ควรตรวจความหนาแน่นกระดูก (DEXA) เป็นค่าตั้งต้น ยังไม่มีบันทึก'});
    else{
      const m=monthsBetween(lb,t);
      if(m>=24) out.push({lv:'warn',k:'dexa',
        msg:`ถึงกำหนดตรวจความหนาแน่นกระดูก (ครั้งล่าสุด ${fmtDate(lb)} — ${m} เดือนก่อน)`});
    }
  }

  /* A8 — ยังไม่ได้คุยเรื่องภาวะเจริญพันธุ์ ก่อนเริ่มเคมี */
  const agDx=ageAt(p.dob,p.dxDate);
  if(agDx&&agDx.y<45&&p.sex==='หญิง'&&!p.fertility?.discussed
     &&(p.tx.chemo.regimen&&p.tx.chemo.regimen!=='ไม่ได้รับเคมีบำบัด')
     &&(!p.tx.chemo.start||p.tx.chemo.start>=t))
    out.push({lv:'warn',k:'fertility',
      msg:`อายุ ${agDx.y} ปี และมีแผนให้เคมีบำบัด — ควรคุยเรื่องการเก็บรักษาภาวะเจริญพันธุ์ก่อนเริ่มยา`});

  /* A9 — ใกล้ครบกำหนดยาฮอร์โมน */
  if(onEndocrine(p)&&p.tx.endocrine.start&&p.tx.endocrine.years){
    const mo=monthsBetween(p.tx.endocrine.start,t), need=+p.tx.endocrine.years*12;
    if(mo!==null&&need&&mo>=need-2){
      const yy=Math.floor(mo/12), mm2=mo%12;
      out.push({lv:mo>=need?'warn':'info',k:'endoend',
        msg:`ใช้ ${p.tx.endocrine.drug} มาแล้ว ${yy} ปี ${mm2} เดือน (กำหนด ${p.tx.endocrine.years} ปี) — พิจารณาหยุดหรือขยายการรักษา`});
    }
  }

  /* A10 — เข้าเกณฑ์ส่งตรวจพันธุกรรมแต่ยังไม่ได้ตรวจ */
  const gf=geneticFlags(p);
  if(gf.length){
    out.push({lv:'info',k:'genetic',
      msg:'เข้าเกณฑ์พิจารณาส่งปรึกษา genetic counseling: '+gf.join(' · ')});
    const gt=(p.germline&&p.germline.tested)||'ยังไม่ได้ตรวจ';
    const mo=p.dxDate?monthsBetween(p.dxDate,t):null;
    if(gt==='ยังไม่ได้ตรวจ'&&mo!==null&&mo>=6)
      out.push({lv:'warn',k:'nogermline',
        msg:`เข้าเกณฑ์ตรวจพันธุกรรมและวินิจฉัยมาแล้ว ${mo} เดือน แต่ยังไม่ได้ส่งตรวจ germline`});
  }

  /* A11 — พิจารณาส่ง genomic assay */
  if(b.er?.v==='Positive'&&/Negative/.test(b.her2?.v||'')
     &&(p.genomic?.assay==='ไม่ได้ส่ง'||!p.genomic?.assay)
     &&!p.tx.chemo.start&&ns&&+ns.pos<=3&&opd2)
    out.push({lv:'info',k:'genomic',
      msg:'HR+/HER2− และต่อมน้ำเหลืองบวกไม่เกิน 3 ต่อม — พิจารณาส่ง genomic assay ประกอบการตัดสินใจเรื่องเคมีบำบัด'});

  /* A6 — ทำภาพหาการแพร่กระจายในผู้ที่ไม่ใช่กลุ่มเสี่ยงสูง */
  const hr=isHighRisk(p);
  if(!hr.v){
    const routine=(p.otherImg||[]).filter(x=>/CT|Bone scan|PET/i.test(x.modality||'')
      &&x.phase==='ระหว่างติดตาม'&&x.result==='ปกติ ไม่พบการแพร่กระจาย');
    if(routine.length>=2) out.push({lv:'info',k:'overimg',
      msg:`มีการตรวจ CT/bone scan ระหว่างติดตาม ${routine.length} ครั้งโดยผลปกติ และไม่เข้าเกณฑ์ความเสี่ยงสูง — การตรวจภาพเป็นประจำในผู้ที่ไม่มีอาการไม่ใช่การติดตามมาตรฐาน`});
  }

  /* A13 — แผนที่ตั้งไว้แต่ยังไม่ได้ทำ (จาก todos ที่ยังค้าง) */
  const overdue=(p.todos||[]).filter(x=>!x.done&&x.pri==='สูง'
    &&(!x.snoozeUntil||x.snoozeUntil<=t));
  if(overdue.length) out.push({lv:'warn',k:'todo',
    msg:`มีรายการที่ต้องตามแก้ระดับสำคัญค้างอยู่ ${overdue.length} รายการ`});

  return out;
}
function worstLevel(as){
  if(as.some(a=>a.lv==='dg')) return 'dg';
  if(as.some(a=>a.lv==='warn')) return 'warn';
  return as.length?'info':'ok';
}
/** ช่วงนัดถัดไปที่แนะนำ (เดือน) — ตามตารางติดตามใหม่ */
function suggestInterval(p){
  const opd=p.tx.breastSurgery.date;
  /* ระยะแผลผ่าตัด 45 วันแรก → นัด 2 สัปดาห์ */
  if(opd){ const d=daysBetween(opd,todayISO()); if(d!==null&&d>=0&&d<45) return 0.5; }
  const fu=followUpPlan(p);
  if(fu.done) return 12;
  if(fu.examMonths) return fu.examMonths;
  return 3;
}

/* ═══════════════════════════════════════════════════════════
   ตรวจหาข้อมูลที่ยังขาด — ใช้แสดงในหน้า Note
   ═══════════════════════════════════════════════════════════ */
function missingFor(p){
  const out=[];
  const add=(key,label,need,tab)=>out.push({key,label,need,tab});

  if(!p.dob) add('dob','ยังไม่มีวันเกิด','คำนวณอายุไม่ได้','general');
  if(!p.dxDate) add('dxDate','ยังไม่มีวันที่วินิจฉัย','คำนวณระยะเวลาติดตามไม่ได้','general');
  if(!(p.hx.locations||[]).length)
    add('loc','ยังไม่ได้ระบุตำแหน่งก้อน','ใช้กำหนด quadrant สำหรับ ICD-10','hx');
  if(!bestHistology(p))
    add('histo','ยังไม่มีผลชิ้นเนื้อ','ใช้กำหนด histology, ICD-10 และตัดสิน Tis','path');
  const b=bestBio(p);
  if(!b.er||!b.pr||!b.her2)
    add('bio','ยังไม่ครบ ER / PR / HER2','ใช้กำหนด molecular subtype และแนวทางการรักษา','path');

  const cT=autoCT(p), cN=autoCN(p);
  if(!cT.v) add('cT','ยังคำนวณ cT ไม่ได้',cT.need||'ขาดขนาดก้อน',cT.srcTab||'hx');
  if(!cN.v) add('cN','ยังคำนวณ cN ไม่ได้',cN.need||'ขาดผลตรวจต่อมน้ำเหลือง',cN.srcTab||'hx');

  /* pT/pN ต้องการเฉพาะเมื่อผ่าตัดแล้ว */
  if(p.tx.breastSurgery.date){
    const pT=autoPT(p), pN=autoPN(p);
    if(!pT.v) add('pT',`ยังคำนวณ ${p.stage.pPrefix}T ไม่ได้`,pT.need||'ขาดขนาดจาก pathology',pT.srcTab||'path');
    if(!pN.v) add('pN',`ยังคำนวณ ${p.stage.pPrefix}N ไม่ได้`,pN.need||'ขาดข้อมูลต่อมน้ำเหลือง',pN.srcTab||'path');
  }
  if(!lastMammoDate(p))
    add('mmg','ยังไม่มีบันทึกผลภาพวินิจฉัยเต้านม','ใช้ติดตามตามแนวทาง NCCN','img');
  if(onEndocrine(p)&&!lastGynDate(p))
    add('gyn',`ใช้ ${p.tx.endocrine.drug} แต่ยังไม่มีผลตรวจนรีเวช`,'ควรตรวจทางนรีเวชทุก 1 ปี','gyn');
  if(!treatmentEndDate(p)&&p.tx.breastSurgery.date===''&&p.dxDate)
    add('tx','ยังไม่มีข้อมูลการรักษา','ใช้คำนวณตารางนัดติดตาม','tx');

  /* ═══════ v2.0 · ข้อมูลที่ขาดเพิ่มเติม ═══════ */
  const opd=p.tx.breastSurgery.date, bio=bestBio(p);

  if(!p.stage.cM) add('cM','ยังไม่ได้ยืนยัน cM','ระบบใช้ M0 ให้ชั่วคราว ควรยืนยันจากผลตรวจ','stage');

  if(opd){
    const ds=(p.paths||[]).filter(x=>x.kind==='Definitive surgery');
    ds.forEach(x=>{
      const me=marginEval(p,x);
      if(me.need) add('margin_'+x.id,`ขอบชิ้นเนื้อ (${fmtDate(x.date)}) ${me.v||'ยังไม่ได้บันทึก'}`,me.why,'path');
    });
    if(!ds.length) add('pathop','ผ่าตัดแล้วแต่ยังไม่มีผลชิ้นเนื้อชิ้นผ่าตัด','ใช้คำนวณ pTNM','path');
  }

  if(isBreastConserving(p)&&opd&&!p.tx.rt.start)
    add('rt','ผ่าตัดเก็บเต้านมแต่ยังไม่มีข้อมูลการฉายแสง','การฉายแสงหลังผ่าตัดเก็บเต้านมเป็นมาตรฐาน','tx');

  if(bio.er?.v==='Positive'&&opd&&(p.tx.endocrine.drug==='ไม่ได้รับ'||!p.tx.endocrine.drug))
    add('endo','ER positive แต่ยังไม่มีข้อมูลยาฮอร์โมน','ใช้เตือนการติดตามผลข้างเคียงและกำหนดหยุดยา','tx');

  if(/Positive/.test(bio.her2?.v||'')&&!(p.tx.targeted||[]).length)
    add('her2tx','HER2 positive แต่ยังไม่มีข้อมูลยามุ่งเป้า','ใช้ติดตามการรักษาให้ครบ','tx');

  if(onEndocrine(p)&&!p.tx.endocrine.start)
    add('endostart','ใช้ยาฮอร์โมนแต่ไม่มีวันเริ่ม','คำนวณกำหนดหยุด/ขยายยาไม่ได้','tx');

  if(p.sex==='หญิง'&&(p.menopause?.status==='ไม่ทราบ'||!p.menopause?.status))
    add('menopause','ยังไม่ได้ระบุสถานะหมดประจำเดือน','ใช้ตัดสินความเหมาะสมของยาฮอร์โมนและความเสี่ยงกระดูก','general');

  if(geneticFlags(p).length&&(p.germline?.tested==='ยังไม่ได้ตรวจ'||!p.germline?.tested))
    add('germline','เข้าเกณฑ์แต่ยังไม่มีผลตรวจพันธุกรรม','ใช้ตัดสินใจเรื่องการผ่าตัดและยา','general');

  if(onBoneLossRisk(p)&&!lastBoneDate(p))
    add('bone','ยังไม่มีผลตรวจความหนาแน่นกระดูก','ผู้ใช้ AI/GnRH ควรมีค่าตั้งต้น','gyn');

  (p.paths||[]).forEach(x=>{
    if(x.ki67&&!x.ki67Low) add('ki67_'+x.id,`Ki-67 (${fmtDate(x.date)}) ยังไม่เป็นตัวเลข`,`ค่าปัจจุบัน "${x.ki67}" — ใช้คำนวณ prognostic stage ไม่ได้`,'path');
    if(x.src==='ไม่ระบุ'&&p.transferIn?.isTransfer)
      add('src_'+x.id,`ยังไม่ระบุที่มาของผล ${x.kind} (${fmtDate(x.date)})`,'เคสรับโอน — ควรระบุว่าผลนี้มาจากที่ไหน','path');
  });

  if(!bmiOf(p)) add('vitals','ยังไม่มีส่วนสูง/น้ำหนัก','ใช้คำนวณ BMI สำหรับคำแนะนำหลังการรักษา','general');

  return out;
}

/* ═══════════════════════════════════════════════════════════
   v2.0 (B1/T4) · PE ในการตรวจครั้งแรก → hx.*  (ต้นทางเดียว)

   กฎ:
   1. เขียนเฉพาะตอน "กดบันทึก visit" เท่านั้น — ไม่ทำงานตอน migrate/โหลดไฟล์
   2. เขียนจาก index visit เท่านั้น (ก่อน/วันเดียวกับการรักษาแรก)
   3. ถ้า hx มาจากการนำเข้าหรือกรอกมือ จะไม่เขียนทับ — ต้องกดปุ่มยืนยันเอง
   ═══════════════════════════════════════════════════════════ */
function hxHasData(p){
  const h=p.hx||{};
  return !!((h.locations||[]).length||h.clinSize||
            (h.invasion||[]).length||(h.clinNodes||[]).length);
}
/** วันเริ่มการรักษาแรก — visit ที่ก่อนวันนี้ถือเป็นการตรวจก่อนรักษา */
function firstTreatmentDate(p){
  const c=[p.tx.breastSurgery.date,p.tx.chemo.start,p.tx.rt.start].filter(Boolean).sort();
  return c[0]||'';
}
function isIndexVisit(p,v){
  if(!v||!v.date) return false;
  const ft=firstTreatmentDate(p);
  if(ft) return v.date<=ft;
  if(p.dxDate) return v.date<=addDays(p.dxDate,60);
  return true;
}
/** แปลงสิ่งที่ตรวจพบใน PE → ค่าที่ staging engine ใช้ */
const PE2INV=[
  ['ก้อนติดผนังทรวงอก (chest wall)','ติดผนังทรวงอก (chest wall)'],
  ['ก้อนติดผิวหนัง','แผลที่ผิวหนัง (ulceration)'],
  ['แผลที่ผิวหนัง (ulceration)','แผลที่ผิวหนัง (ulceration)'],
  ["ผิวหนังบวมแดง (peau d'orange)","ผิวหนังบวม/peau d'orange"],
  ['ก้อนกระจายใต้ผิวหนัง (satellite nodules)','Satellite skin nodules'],
  ['เต้านมแดงบวมเกิน 1 ใน 3 (inflammatory)','Inflammatory carcinoma'],
  ['ไม่ทราบ — ไม่มีเอกสาร','ไม่ทราบ — ไม่มีเอกสาร']
];
const PE2NODE=[
  ['ต่อมน้ำเหลืองรักแร้โต เคลื่อนที่ได้','ต่อมรักแร้โต เคลื่อนที่ได้ (movable)'],
  ['ต่อมน้ำเหลืองติดกันเป็นก้อน (matted)','ต่อมรักแร้ติดกัน/ยึดติด (fixed หรือ matted)'],
  ['ต่อมน้ำเหลืองยึดติดกับเนื้อเยื่อข้างเคียง','ต่อมรักแร้ติดกัน/ยึดติด (fixed หรือ matted)'],
  ['ต่อม infraclavicular (level III) โต','ต่อม infraclavicular (level III) โต'],
  ['ต่อม internal mammary โต (parasternal)','ต่อม internal mammary โต'],
  ['ต่อมน้ำเหลืองเหนือไหปลาร้าโต','ต่อม supraclavicular โต'],
  ['ไม่ทราบ — ไม่มีเอกสาร','ไม่ทราบ — ไม่มีเอกสาร']
];
/** อ่าน PE ของ visit → ชุดค่า hx (ไม่เขียนลง p) */
function hxFromPE(p,v){
  const pe=v.pe||{}, out={locations:[],locDist:{},clinSize:'',invasion:[],clinNodes:[],symptoms:[],
    durValue:'',durUnit:'เดือน'};
  out.locations=[...(pe.breastLoc||[])];
  out.clinSize=pe.massSize||'';
  out.locDist=Object.assign({},(typeof pe.massDist==='object'&&pe.massDist)||{});
  const br=pe.breast||[], ax=pe.axilla||[], sp=pe.supra||[];
  const inv=[]; PE2INV.forEach(([a,b])=>{ if(br.includes(a)&&!inv.includes(b)) inv.push(b); });
  const nd=[]; PE2NODE.forEach(([a,b])=>{ if((ax.includes(a)||sp.includes(a))&&!nd.includes(b)) nd.push(b); });
  if(!inv.length) inv.push(pe.allNormal||!br.length?'ไม่มีการลุกลาม':'ไม่มีการลุกลาม');
  if(!nd.length)  nd.push('ไม่พบต่อมน้ำเหลืองโต');
  out.invasion=inv; out.clinNodes=nd;
  out.symptoms=(v.cc||[]).filter(x=>OPT.ccIsSymptom.includes(x));
  out.durValue=v.durValue||''; out.durUnit=v.durUnit||'เดือน';
  return out;
}
/** มี PE ที่ใช้เป็นต้นทางได้ไหม */
function peHasFindings(v){
  const pe=v.pe||{};
  return !!((pe.breastLoc||[]).length||pe.massSize||(pe.breast||[]).length||
            (pe.axilla||[]).length||(pe.supra||[]).length);
}
/** index visit ที่เก่าที่สุดซึ่งมี PE ใช้งานได้ */
function indexVisitOf(p){
  return [...(p.visits||[])].filter(v=>isIndexVisit(p,v)&&peHasFindings(v))
    .sort((a,b)=>(a.date||'').localeCompare(b.date||''))[0]||null;
}
/** เขียนทับได้โดยไม่ต้องถามไหม */
function hxAutoWritable(p){
  const src=(p.hx&&p.hx.src)||'';
  return src===''||src.startsWith('visit:') ? (src!==''||!hxHasData(p)) : false;
}
/** เขียน hx จาก index visit — คืน {changed, from, diff} */
function syncHxFromVisits(p,force){
  const iv=indexVisitOf(p);
  if(!iv) return {changed:false,reason:'ยังไม่มีการตรวจก่อนการรักษาที่บันทึก PE ไว้'};
  if(!force&&!hxAutoWritable(p))
    return {changed:false,locked:true,from:iv,
      reason:'ข้อมูลตอนวินิจฉัยมาจากการนำเข้า/กรอกเอง — ระบบไม่เขียนทับให้อัตโนมัติ'};
  const nw=hxFromPE(p,iv), h=p.hx, diff=[];
  const eq=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
  const L={locations:'ตำแหน่งก้อน',clinSize:'ขนาดจากการคลำ',invasion:'การลุกลาม',
           clinNodes:'ต่อมน้ำเหลือง',symptoms:'อาการนำ',locDist:'ระยะห่างจากหัวนม'};
  ['locations','clinSize','invasion','clinNodes','symptoms','locDist'].forEach(k=>{
    if(!eq(h[k],nw[k])){
      diff.push(`${L[k]}: ${JSON.stringify(h[k])||'—'} → ${JSON.stringify(nw[k])}`);
      h[k]=nw[k];
    }
  });
  if(nw.durValue){ h.durValue=nw.durValue; h.durUnit=nw.durUnit; }
  h.src='visit:'+iv.id; h.srcAt=iv.date;
  return {changed:diff.length>0,from:iv,diff};
}

/* ═══════════════════════════════════════════════════════════
   v2.0 (B6) · Visit preset — "วันนี้มาทำอะไร"
   เลือกครั้งเดียว แล้วฟอร์มซ่อนส่วนที่ไม่เกี่ยวข้องออก
   บล็อก: cc dur pi pe mass wound ix dx tx adher psych plan orders
   pe: 'full' = ทุกระบบ · 'core' = เต้านม+รักแร้ · 0 = ซ่อน
   ═══════════════════════════════════════════════════════════ */
const VTYPES=[
  {k:'new',   label:'ผู้ป่วยใหม่',
   b:{cc:1,dur:1,pi:1,pe:'full',mass:1,wound:0,ix:1,dx:1,tx:1,adher:0,psych:1,plan:1,orders:1}},
  {k:'result',label:'ฟังผล',
   b:{cc:1,dur:0,pi:1,pe:'core',mass:1,wound:0,ix:1,dx:1,tx:1,adher:0,psych:1,plan:1,orders:1}},
  {k:'preop', label:'ก่อนผ่าตัด',
   b:{cc:1,dur:0,pi:1,pe:'core',mass:1,wound:0,ix:1,dx:1,tx:1,adher:0,psych:1,plan:1,orders:1}},
  {k:'opday', label:'วันผ่าตัด',
   b:{cc:1,dur:0,pi:1,pe:0,mass:0,wound:0,ix:0,dx:1,tx:1,adher:0,psych:0,plan:1,orders:0},
   apply:(p,v)=>{ if(!v.cc.length){v.cc=['วันผ่าตัด'];v.noSymptom=true;} }},
  {k:'postop',label:'หลังผ่าตัด (แผล/drain)',
   b:{cc:1,dur:0,pi:1,pe:'core',mass:0,wound:1,ix:0,dx:1,tx:1,adher:0,psych:0,plan:1,orders:0},
   apply:(p,v)=>{ v.pe.woundActive=true; if(!v.cc.length){v.cc=['มาตรวจแผลผ่าตัด'];} }},
  {k:'ontx',  label:'ระหว่างเคมี/ฉายแสง',
   b:{cc:1,dur:1,pi:1,pe:'core',mass:0,wound:1,ix:1,dx:1,tx:1,adher:1,psych:1,plan:1,orders:1}},
  {k:'surv',  label:'ติดตามระยะยาว',
   b:{cc:1,dur:0,pi:1,pe:'core',mass:0,wound:0,ix:0,dx:1,tx:1,adher:1,psych:1,plan:1,orders:1},
   apply:(p,v)=>{ if(!v.cc.length){v.cc=['มาตามนัด ไม่มีอาการผิดปกติ'];v.noSymptom=true;} }},
  {k:'endostart',label:'ก่อนเริ่มยาฮอร์โมน',
   b:{cc:1,dur:0,pi:1,pe:'core',mass:0,wound:0,ix:1,dx:1,tx:1,adher:0,psych:1,plan:1,orders:1}},
  {k:'endoend',label:'ครบกำหนดยาฮอร์โมน',
   b:{cc:1,dur:0,pi:1,pe:'core',mass:0,wound:0,ix:0,dx:1,tx:1,adher:1,psych:1,plan:1,orders:1}},
  {k:'genetic',label:'ปรึกษาผลพันธุกรรม',
   b:{cc:1,dur:0,pi:1,pe:0,mass:0,wound:0,ix:1,dx:1,tx:1,adher:0,psych:1,plan:1,orders:1}},
  {k:'symptom',label:'มีอาการผิดปกติ',
   b:{cc:1,dur:1,pi:1,pe:'full',mass:1,wound:1,ix:1,dx:1,tx:1,adher:1,psych:1,plan:1,orders:1}},
  {k:'recur', label:'พบการกลับเป็นซ้ำ/แพร่กระจาย',
   b:{cc:1,dur:1,pi:1,pe:'full',mass:1,wound:0,ix:1,dx:1,tx:1,adher:1,psych:1,plan:1,orders:1}},
  {k:'transfer',label:'ผู้ป่วยรับโอน/นำผลมา',
   b:{cc:1,dur:1,pi:1,pe:'full',mass:1,wound:1,ix:1,dx:1,tx:1,adher:1,psych:1,plan:1,orders:1}}
];
const VT=k=>VTYPES.find(x=>x.k===k)||null;

/** เดาว่า visit นี้น่าจะเป็นแบบไหน — คืน {k,why} */
function guessVType(p,v){
  const d=v.date||todayISO(), t=p.tx;
  const op=t.breastSurgery.date;
  const prior=(p.visits||[]).filter(x=>x.id!==v.id&&x.date&&x.date<d);
  const dOp=op?daysBetween(op,d):null;

  if(p.transferIn?.isTransfer&&!prior.length)
    return {k:'transfer',why:'ผู้ป่วยรับโอน และเป็นการพบครั้งแรกที่นี่'};
  if(op&&op===d) return {k:'opday',why:'ตรงกับวันผ่าตัดที่บันทึกไว้'};
  if((p.recurrences||[]).some(r=>r.date===d))
    return {k:'recur',why:'ตรงกับวันที่บันทึกการกลับเป็นซ้ำ'};
  /* การตรวจครั้งแรกที่บันทึกไว้ = การพบครั้งแรก ไม่ว่าภายหลังจะผ่าตัดเมื่อไหร่ */
  if(!prior.length) return {k:'new',why:'เป็นการตรวจครั้งแรกที่บันทึกไว้'};

  const inChemo=t.chemo.start&&d>=t.chemo.start&&(!t.chemo.end||d<=t.chemo.end);
  const inRT=t.rt.start&&d>=t.rt.start&&(!t.rt.end||d<=t.rt.end);
  if(inChemo||inRT) return {k:'ontx',why:inChemo?'อยู่ในช่วงเคมีบำบัด':'อยู่ในช่วงฉายแสง'};
  /* ช่วงดูแลแผล/drain จริงๆ สั้นกว่า 60 วัน — ถ้าเลย 30 วันต้องมีเรื่องแผลใน CC ด้วย */
  const woundCC=(v.cc||[]).some(x=>/แผลผ่าตัด|บวมแขน/.test(x));
  const routineCC=(v.cc||[]).includes('มาตามนัด ไม่มีอาการผิดปกติ');
  if(dOp!==null&&dOp>0&&(dOp<=30||(dOp<=60&&woundCC))&&!(routineCC&&dOp>30))
    return {k:'postop',why:`หลังผ่าตัด ${dOp} วัน`};

  /* มีผลชิ้นเนื้อที่ทราบผลใกล้วันนี้และยังไม่ผูกกับ visit ใด */
  const newPath=(p.paths||[]).some(x=>{
    const rd=x.resultDate||x.date; if(!rd||x.visitId) return false;
    const gap=daysBetween(rd,d); return gap!==null&&gap>=0&&gap<=21;
  });
  if(newPath&&(!op||d<=op)) return {k:'result',why:'มีผลชิ้นเนื้อที่เพิ่งทราบผลและยังไม่ได้ผูกกับการตรวจครั้งใด'};
  if(op&&d<op) return {k:'preop',why:'ก่อนวันผ่าตัดที่นัดไว้'};

  const b=bestBio(p);
  if(b.er?.v==='Positive'&&op&&dOp>0&&!t.endocrine.start)
    return {k:'endostart',why:'ER positive ผ่าตัดแล้ว แต่ยังไม่ได้เริ่มยาฮอร์โมน'};
  if(onEndocrine(p)&&t.endocrine.start&&t.endocrine.years){
    const mo=monthsBetween(t.endocrine.start,d), need=+t.endocrine.years*12;
    if(mo!==null&&need&&mo>=need-2) return {k:'endoend',why:`ใช้ยาฮอร์โมนมาใกล้ครบ ${t.endocrine.years} ปี`};
  }
  if((p.germline?.tested==='รอผล')||(p.germline?.tested==='ตรวจแล้ว'&&p.germline?.date&&
     (()=>{const g=daysBetween(p.germline.date,d);return g!==null&&g>=0&&g<=30;})()))
    return {k:'genetic',why:'เพิ่งมีผลตรวจพันธุกรรม'};

  const symp=(v.cc||[]).some(x=>OPT.ccIsSymptom.includes(x)||
    /ปวดกระดูก|ไอเรื้อรัง|น้ำหนักลด|ปวดศีรษะ|แผลผ่าตัดผิดปกติ|บวมแขน|เลือดออกผิดปกติ/.test(x));
  if(symp) return {k:'symptom',why:'เลือกอาการผิดปกติไว้ใน CC'};
  return {k:'surv',why:'อยู่ในระยะติดตามหลังการรักษา'};
}
/** ชุดบล็อกที่ต้องแสดงสำหรับ visit นี้ */
function vBlocks(p,v){
  if(S.showAllBlocks) return {cc:1,dur:1,pi:1,pe:'full',mass:1,wound:1,ix:1,dx:1,tx:1,
                              adher:1,psych:1,plan:1,orders:1};
  const k=v.vtype||guessVType(p,v).k;
  const t=VT(k);
  return t?t.b:VT('surv').b;
}
function vShow(p,v,key){ const b=vBlocks(p,v); return !!b[key]; }
/** ใช้ preset — เขียน v.vtype และตั้งค่าเริ่มต้นของ preset นั้น */
function applyVType(p,v,k){
  v.vtype=k;
  const t=VT(k);
  if(t&&t.apply) t.apply(p,v);
}

/* ═══════════════════════════════════════════════════════════
   v2.0 · รายการที่ต้องตามแก้ (Review queue)
   รวม “ข้อมูลที่ขาด” + “การเตือนทางคลินิก” + รายการที่หมอเพิ่มเอง
   ผู้ใช้กด: ทำแล้ว / เลื่อนไว้ก่อน / เขียนโน้ตกำกับ
   ═══════════════════════════════════════════════════════════ */
function autoTodos(p){
  const t=todayISO(), out=[];
  const seen=new Map((p.todos||[]).filter(x=>x.key).map(x=>[x.key,x]));
  const mk=(key,cat,pri,text,tab)=>{
    const saved=seen.get(key);
    out.push({ id:saved?saved.id:('auto_'+key), auto:true, key, cat, pri, text, tab,
      done:saved?!!saved.done:false,
      snoozeUntil:saved?(saved.snoozeUntil||''):'',
      note:saved?(saved.note||''):'',
      createdAt:saved?saved.createdAt:new Date().toISOString() });
  };
  alertsFor(p).forEach(a=>{
    if(a.k==='todo') return;
    const pri=a.lv==='dg'?'สูง':a.lv==='warn'?'กลาง':'ต่ำ';
    const cat=/appt|freq/.test(a.k)?'ตามตัวผู้ป่วย'
            :/mammo|gyn|dexa|path|birads|otherimg|genomic|nogermline/.test(a.k)?'ตามผลตรวจ'
            :/noendo|noher2tx|nort|pmrt|aipremeno|endoend|fertility/.test(a.k)?'ตามการรักษา'
            :'ตรวจสอบความถูกต้อง';
    const tab=/mammo|birads/.test(a.k)?'img':/gyn|dexa/.test(a.k)?'gyn'
             :/path|ptnm|genomic/.test(a.k)?'path'
             :/noendo|noher2tx|nort|pmrt|aipremeno|endoend/.test(a.k)?'tx'
             :/appt|freq/.test(a.k)?'visits':'general';
    mk('alert:'+a.k,cat,pri,a.msg,tab);
  });
  missingFor(p).forEach(m=>mk('miss:'+m.key,'เติมข้อมูลที่ขาด','กลาง',`${m.label} — ${m.need}`,m.tab));
  (p.todos||[]).filter(x=>!x.auto).forEach(x=>out.push(x));

  /* รวมหัวข้อที่ซ้ำกันระหว่างการเตือนกับข้อมูลที่ขาด เหลืออันเดียว */
  const TOPIC={'alert:noendo':'endo','miss:endo':'endo','miss:endostart':'endo',
    'alert:nort':'rt','miss:rt':'rt',
    'alert:noher2tx':'her2tx','miss:her2tx':'her2tx',
    'alert:nogermline':'germline','miss:germline':'germline',
    'alert:dexa':'bone','miss:bone':'bone',
    'alert:gyn':'gyn','miss:gyn':'gyn'};
  const byTopic=new Map(), keep=[];
  const rank={'สูง':0,'กลาง':1,'ต่ำ':2};
  out.forEach(x=>{
    const tp=TOPIC[x.key];
    if(!tp){ keep.push(x); return; }
    const prev=byTopic.get(tp);
    if(!prev||rank[x.pri]<rank[prev.pri]) byTopic.set(tp,x);
  });
  byTopic.forEach(v=>keep.push(v));

  return keep.filter(x=>!x.done&&(!x.snoozeUntil||x.snoozeUntil<=t))
            .sort((a,b)=>rank[a.pri]-rank[b.pri]);
}
/** บันทึกสถานะของรายการอัตโนมัติ (ทำแล้ว/เลื่อน/โน้ต) ลงใน p.todos */
function setTodoState(p,item,patch){
  if(!Array.isArray(p.todos)) p.todos=[];
  if(!item.auto){
    const i=p.todos.findIndex(x=>x.id===item.id);
    if(i>=0) Object.assign(p.todos[i],patch);
    return;
  }
  let rec=p.todos.find(x=>x.key===item.key);
  if(!rec){ rec=Object.assign(blankTodo(),{key:item.key,auto:true,cat:item.cat,pri:item.pri,text:item.text,tab:item.tab});
    p.todos.push(rec); }
  Object.assign(rec,patch);
}
function todoCount(p){ return autoTodos(p).length; }
function surgeryText(p){
  const bs=p.tx.breastSurgery, ax=p.tx.axSurgery, parts=[];
  if(bs.type&&bs.type!=='ไม่ได้ผ่าตัด') parts.push(bs.type+(bs.side?` เต้านม${bs.side}`:''));
  if(ax.type&&ax.type!=='ไม่ได้ทำ') parts.push(ax.type);
  return parts.join(' ร่วมกับ ');
}
function familyHxText(p){
  const fh=p.familyHx||{};
  if(fh.none) return 'ไม่มีประวัติมะเร็งในครอบครัว';
  if(fh.unknown&&!(fh.types||[]).length) return 'ไม่ทราบประวัติมะเร็งในครอบครัว';
  const rel=(fh.relatives||[]).map(r=>`${r.relation} — ${r.cancer}${r.ageAtDx?` (วินิจฉัยอายุ ${r.ageAtDx} ปี)`:''}`);
  const t=(fh.types||[]).join(', ');
  return [t?`มีประวัติ: ${t}`:'',rel.length?rel.join('; '):''].filter(Boolean).join(' — ')||'—';
}
function hxSymptomText(p){
  const sx=[...(p.hx.symptoms||[])]; if(p.hx.symptomOther) sx.push(p.hx.symptomOther);
  if(!sx.length) return '';
  const d=p.hx.noSymptom?'':durText(p.hx.durValue,p.hx.durUnit);
  return sx.join(', ')+(d?` เป็นมา ${d} ก่อนมาพบแพทย์`:'');
}

/* ───────── ⑨ สร้างข้อความ Visit Note (แยกกล่อง) ───────── */
function noteCC(p,v){
  const cc=[...(v.cc||[])]; if(v.ccOther) cc.push(v.ccOther);
  const dur=v.noSymptom?'':durText(v.durValue,v.durUnit);
  return (cc.length?cc.join(', '):'มาตามนัด')+(dur?` (เป็นมา ${dur})`:'');
}
/** สร้างรายการเหตุการณ์ทั้งหมด เรียงตามเวลา (ใช้ทั้ง PI และ Timeline) */
function clinicalEvents(p,upTo){
  const E=[], lim=upTo||'9999-99-99';
  const push=(d,txt)=>{ if(d&&d<=lim) E.push({d,txt}); };

  (p.mammos||[]).forEach(m=>push(m.date,
    `${m.modality||'ภาพเต้านม'}: ${m.birads?'BI-RADS '+m.birads:''}`+
    `${m.side&&m.side!=='ไม่พบความผิดปกติ'?` ${m.side}`:''}`+
    `${(m.findings||[]).filter(f=>f!=='ไม่พบความผิดปกติ').length?' — '+m.findings.filter(f=>f!=='ไม่พบความผิดปกติ').join(', '):''}`+
    `${m.sizeCm?` ${m.sizeCm} ซม.`:''}`));

  (p.otherImg||[]).forEach(x=>push(x.date,
    `${x.modality}: ${x.result}${(x.sites||[]).length?' ที่ '+x.sites.join(', '):''}`));

  /* ผลชิ้นเนื้อ: ใช้วันที่ผลออก (resultDate) เป็นหลัก + รวมผล ER/PR/HER2/Ki-67 + ศัพท์แพทย์อังกฤษเป็นหลัก
     ถ้าเป็น Definitive surgery ให้ใช้ชนิดการผ่าตัดจริงเป็นชื่อรายการ (แทนคำว่า "Definitive surgery" เฉยๆ)
     และรวมเข้ากับรายการผ่าตัดในบรรทัดเดียว ไม่แยกซ้ำ */
  const isDefSurgOnSurgDate = b => b.kind==='Definitive surgery' && p.tx.breastSurgery.date && b.date===p.tx.breastSurgery.date;
  let surgeryMergedIntoPath=false;
  (p.paths||[]).forEach(b=>{
    const bio=[b.er?`ER ${b.er}`:'',b.pr?`PR ${b.pr}`:'',b.her2?`HER2 ${b.her2}`:''].filter(Boolean).join('/');
    const ki=b.ki67?`Ki-67 ${fmtKi67(b.ki67)}`:'';
    const label = isDefSurgOnSurgDate(b) && surgeryText(p) ? surgeryText(p) : b.kind;
    if(isDefSurgOnSurgDate(b) && surgeryText(p)) surgeryMergedIntoPath=true;
    const parts=[
      b.histology||'pending',
      b.grade||'',
      b.pathSize?`${b.pathSize} cm`:'',
      (b.margin&&b.margin!=='ไม่ระบุ')?b.margin:'',
      bio, ki,
      (b.nodesPos!==''&&b.nodesPos!=null)?`nodes ${b.nodesPos}/${b.nodesTotal||'-'}`:''
    ].filter(Boolean).join(', ');
    push(b.resultDate||b.date, `${label}: ${parts}`);
  });

  /* ผ่าตัด — ใส่เฉพาะกรณีไม่ได้ถูกรวมเข้ากับผลชิ้นเนื้อไปแล้ว (กันซ้ำ) */
  if(p.tx.breastSurgery.date&&!surgeryMergedIntoPath) push(p.tx.breastSurgery.date,surgeryText(p)||'ผ่าตัด');
  if(p.tx.chemo.start){
    const e=p.tx.chemo.end;
    push(p.tx.chemo.start,`เคมีบำบัด ${p.tx.chemo.timing} ${p.tx.chemo.regimen||''}`+
      `${p.tx.chemo.cycles?` ${p.tx.chemo.cycles} cycles`:''}${e?` (ถึง ${fmtDate(e)})`:' (กำลังให้)'}`);
  }
  if(p.tx.rt.start){
    const e=p.tx.rt.end;
    push(p.tx.rt.start,`ฉายแสง${p.tx.rt.dose?` ${p.tx.rt.dose}`:''}${e?` (ถึง ${fmtDate(e)})`:' (กำลังฉาย)'}`);
  }
  if(p.tx.endocrine.start&&onEndocrine(p))
    push(p.tx.endocrine.start,`เริ่มยาฮอร์โมน ${p.tx.endocrine.drug}`);
  (p.tx.targeted||[]).forEach(tg=>{ if(tg.start) push(tg.start,`เริ่ม ${tg.drug}`); });

  (p.gyn||[]).forEach(g=>push(g.date,
    `นรีเวช (${g.type}): ${g.result}${g.endoThick?`, endometrium ${g.endoThick} มม.`:''}`));

  (p.recurrences||[]).forEach(r=>push(r.date,
    `พบ ${r.type||'การกลับเป็นซ้ำ'}${(r.sites||[]).length?' ที่ '+r.sites.join(', '):''}`+
    `${r.confirm?` (${r.confirm})`:''}`));

  E.sort((a,b)=>(a.d||'').localeCompare(b.d||''));

  /* รวมเหตุการณ์วันเดียวกันเป็นบรรทัดเดียว คั่นด้วย "; " */
  const grouped=[];
  E.forEach(e=>{
    const last=grouped[grouped.length-1];
    if(last&&last.d===e.d) last.txt+='; '+e.txt;
    else grouped.push({d:e.d,txt:e.txt});
  });
  return grouped;
}
/** PI แบบสรุป timeline พร้อมวันที่กำกับ */
function notePI(p,v){
  const L=[];
  /* บรรทัดสรุปหนึ่งบรรทัด */
  const age=ageAt(p.dob,v.date);
  const stt=stageText(p), sub=subtype(bestBio(p)), h=bestHistology(p);
  const head=[`ผู้ป่วย${p.sex==='ชาย'?'ชาย':'หญิง'}${age?` อายุ ${age.y} ปี`:''}`,
    `Breast cancer${(p.hx.locations||[]).length?` ${p.hx.locations.join(', ')}`:''}`,
    h?h.v:'', stt, sub].filter(Boolean).join(' — ');
  L.push(head);
  L.push('');

  /* รวมวันวินิจฉัยเข้ากับเหตุการณ์อื่น แล้วเรียงตามเวลาทั้งหมด */
  const sx=hxSymptomText(p);
  const ev=clinicalEvents(p,v.date);
  if(p.dxDate&&p.dxDate<=v.date){
    const dxTxt='วินิจฉัยมะเร็งเต้านม'+(sx?` — แรกรับมาด้วย ${sx}`:'');
    const same=ev.find(e=>e.d===p.dxDate);
    if(same) same.txt=dxTxt+'; '+same.txt;
    else ev.push({d:p.dxDate,txt:dxTxt});
  }
  ev.sort((a,b)=>(a.d||'').localeCompare(b.d||''));
  ev.forEach(e=>L.push(`${fmtDate(e.d)}  ${e.txt}`));
  if(!p.dxDate&&sx) L.push(`(ไม่ระบุวันที่)  แรกรับมาด้วย ${sx}`);

  /* ครั้งนี้ */
  L.push('');
  const moOp=p.tx.breastSurgery.date?monthsBetween(p.tx.breastSurgery.date,v.date):null;
  const dur=v.noSymptom?'':durText(v.durValue,v.durUnit);
  const ccx=(v.cc||[]).filter(c=>c!=='มาตามนัด ไม่มีอาการผิดปกติ');
  const ctx=[moOp!==null?`post-op ${Math.floor(moOp/12)} ปี ${moOp%12} เดือน`:''].filter(Boolean).join(', ');
  L.push(`ครั้งนี้ (${fmtDate(v.date)}${ctx?`, ${ctx}`:''}) `+
    (ccx.length?`มาด้วย ${ccx.join(', ')}${dur?` เป็นมา ${dur}`:''}`
               :'มาตามนัด ปฏิเสธอาการผิดปกติ'));
  if(v.piOther) L.push(v.piOther);
  return L.join('\n');
}
/** PE เป็นภาษาอังกฤษ ครบทุกระบบ */
function notePE(p,v){
  const pe=v.pe||blankPE(), L=[];
  L.push('PHYSICAL EXAMINATION');
  L.push('  General: Alert, well-oriented, not in acute distress.');
  PE_SYS.forEach(sys=>{
    const abn=pe[sys.key]||[];
    const woundPhr=(sys.key==='breast'&&pe.woundActive&&(pe.wound||[]).length)
      ? pe.wound.map(w=>enOf(PE_WOUND,w)) : [];
    if(!abn.length&&!woundPhr.length){ L.push(`  ${sys.en}: ${sys.normal}`); return; }
    const phr=abn.map(a=>{
      let en=enOf(sys.items,a);
      if(sys.key==='breast'&&a==='คลำได้ก้อนที่เต้านม'&&(pe.breastLoc||[]).length){
        const locs=pe.breastLoc.map(c=>locLabelEN(c)).join('; ');
        const sz=pe.massSize?`, approximately ${pe.massSize} cm`:'';
        const dmap=(typeof pe.massDist==='object'&&pe.massDist)||{};
        const dvals=(pe.breastLoc||[]).map(c=>dmap[c]?`${locLabelEN(c)} ${dmap[c]} cm`:'').filter(Boolean);
        const ds=dvals.length?`, ${dvals.join(' and ')} from the nipple`
                :(dmap._all?`, ${dmap._all} cm from the nipple`:'');
        en=`palpable mass at ${locs}${sz}${ds}`;
      }
      return en;
    });
    const all=[...phr,...woundPhr];
    if(!all.length){ L.push(`  ${sys.en}: ${sys.normal}`); return; }
    L.push(`  ${sys.en}: ${all.join('; ')}.`);
  });
  if(pe.other) L.push(`  Other: ${pe.other}`);
  return L.join('\n');
}
function noteIx(p,v){
  const inv=[];
  (p.mammos||[]).filter(m=>m.visitId===v.id||(m.date&&Math.abs(daysBetween(m.date,v.date)||999)<=45))
    .sort((a,b)=>(b.date||'').localeCompare(a.date||''))
    .forEach(m=>inv.push(`${m.modality} (${fmtDate(m.date)}): BI-RADS ${m.birads||'-'}${m.side&&m.side!=='ไม่พบความผิดปกติ'?`, ${m.side}`:''}${(m.findings||[]).length?` — ${m.findings.join(', ')}`:''}${m.impression?` — ${m.impression}`:''}`));
  (p.paths||[]).filter(b=>b.visitId===v.id||(b.date&&Math.abs(daysBetween(b.date,v.date)||999)<=45))
    .sort((a,b)=>(b.date||'').localeCompare(a.date||''))
    .forEach(b=>inv.push(`${b.kind} (${fmtDate(b.date)}): ${b.histology||'รอผล'}${b.pathNo?` [${b.pathNo}]`:''}`));
  if(v.marker) inv.push(`Tumor marker: ${v.marker}`);
  return inv.map(x=>'- '+x).join('\n');
}
function noteDx(p,v){
  const L=[], h=bestHistology(p), stt=stageText(p);
  L.push(`Breast cancer${stt?`, ${stt}`:''}${(p.hx.locations||[]).length?`, ${locListText(p.hx.locations,p.hx.locDist)}`:''}${h?`, ${h.v}`:''}`);
  const b=bestBio(p), sub=subtype(b);
  if(b.er||b.pr||b.her2)
    L.push(`ER ${b.er?.v||'-'} / PR ${b.pr?.v||'-'} / HER2 ${b.her2?.v||'-'}${b.ki67?` / Ki-67 ${fmtKi67(b.ki67.v)}`:''}${sub?` (${sub})`:''}`);
  const dx=[...(v.dx||[])]; if(v.dxOther) dx.push(v.dxOther);
  dx.forEach(d=>L.push(d));

}
/** ICD-10 แยกกล่องต่างหาก — คัดลอกได้เฉพาะรหัส ไม่ติดข้อความอื่น */
function noteICD(p,v){

  return icd.code||'';
}
function noteTx(p,v){
  const tx=[...(v.txGiven||[])]; if(v.txOther) tx.push(v.txOther);
  const L=tx.length?tx.slice():['ตรวจติดตาม ไม่ได้ให้การรักษาเพิ่มเติม'];
  if(v.adherence&&v.adherence!=='ไม่ได้ใช้ยา') L.push(`Endocrine therapy: ${p.tx.endocrine.drug} — ${v.adherence}`);
  return L.map(x=>'- '+x).join('\n');
}
/** แปลงช่วงห่างจากวันตรวจถึงวันนัด เป็นข้อความระยะเวลาโดยประมาณ ปัดเข้าหมวดที่ใกล้เคียงที่สุด
    (เผื่อกรณีแพทย์ไม่ได้ออกตรวจตรงวันที่ระบุไว้พอดี ให้คนไข้ไปนัดคิวเองอีกที) */
function planDurationText(fromDate,toDate){
  const d=daysBetween(fromDate,toDate);
  if(d===null||d<0) return '';
  const presets=[[7,'1 สัปดาห์'],[14,'2 สัปดาห์'],[30,'1 เดือน'],[90,'3 เดือน'],
    [120,'4 เดือน'],[180,'6 เดือน'],[365,'12 เดือน']];
  let best=presets[0];
  for(const p2 of presets) if(Math.abs(d-p2[0])<Math.abs(d-best[0])) best=p2;
  return best[1];
}
function notePlan(p,v){
  const L=[];
  if(v.nextDate){
    const dur=planDurationText(v.date,v.nextDate);
    L.push(`นัดติดตามครั้งถัดไปในอีกประมาณ ${dur||'ไม่ทราบระยะเวลา'}`);
  }
  const ord=[...(v.orders||[])]; if(v.planOther) ord.push(v.planOther);
  ord.forEach(o=>L.push(o));
  if(v.distress!==''&&v.distress!==undefined&&+v.distress>0)
    L.push(`Psychosocial: distress score ${v.distress}/10${+v.distress>=4?' — referral to psychosocial support considered':''}`);
  else if(v.psychLegacy) L.push(`Psychosocial: ${v.psychLegacy}`);
  else if(v.psych&&v.psych!=='อารมณ์ปกติ ไม่มีความกังวล'&&v.distress===undefined)
    L.push(`Psychosocial: ${v.psych}`);
  L.push('แนะนำให้สังเกตอาการผิดปกติ หากคลำได้ก้อนใหม่ หรือมีอาการผิดปกติ ให้มาพบแพทย์ก่อนนัด');
  return L.map(x=>'- '+x).join('\n');
}
function noteHeader(p,v){
  const age=ageAt(p.dob,v.date);
  return `วันที่ตรวจ: ${fmtDate(v.date)}\nผู้ป่วย: ${patLabel(p)}   HN: ${p.hn||'-'}   อายุ ณ วันตรวจ: ${age?age.text:'-'}`;
}
/* ═══════════════════════════════════════════════════════════
   Snapshot — เก็บภาพนิ่งของข้อมูล ณ วันที่บันทึก
   เพื่อให้ย้อนดู visit เก่าแล้วเห็นตรงกับความจริงตอนนั้น
   ═══════════════════════════════════════════════════════════ */
function makeSnapshot(p,v){
  const cs=cStageOf(p), ps=pStageOf(p), cur=currentStage(p);
  const h=bestHistology(p), g=bestGrade(p), b=bestBio(p), sz=bestSize(p), ns=nodeSummary(p);
  const st=autoStatus(p), fu=followUpPlan(p);
  return {
    at:new Date().toISOString(), ver:APP_VER,
    ageText:ageText(p.dob,v.date),
    stageText:stageText(p),
    cStage:cs.v, cT:cs.T.v, cN:cs.N.v, cM:cs.M.v,
    pPrefix:p.stage.pPrefix, pStage:ps.v, pT:ps.T.v, pN:ps.N.v, pcr:p.stage.pcr,
    histology:h?h.v:'', grade:g?g.v:'',
    er:b.er?.v||'', pr:b.pr?.v||'', her2:b.her2?.v||'', ki67:b.ki67?.v||'',
    subtype:subtype(b),
    sizeUsed:sz?sz.v:'', sizeSource:sz?sz.src:'',
    nodesPos:ns?ns.pos:'', nodesTotal:ns?ns.total:'',
    icd:suggestICD(p).code,
    status:st.v, statusWhy:st.why,
    fuPhase:fu.phase, treatmentEnd:fu.te?fu.te.d:'',
    locations:[...(p.hx.locations||[])],
    note:buildNote(p,v)
  };
}
/** ข้อมูลที่ใช้แสดงสำหรับ visit — ถ้ามี snapshot ใช้ snapshot */
function visitView(p,v){
  return v.snapshot?{...v.snapshot,fromSnapshot:true}:{...makeSnapshot(p,v),fromSnapshot:false};
}
function noteSections(p,v){
  const s=[
    {k:'head',t:'ข้อมูลผู้ป่วย',   tx:noteHeader(p,v)},
    {k:'cc',  t:'CC',              tx:noteCC(p,v)},
    {k:'pi',  t:'PI',              tx:notePI(p,v)},
    {k:'pe',  t:'PE (English)',    tx:notePE(p,v), en:true},
    {k:'ix',  t:'Investigation',   tx:noteIx(p,v)},
    {k:'icd', t:'ICD-10',          tx:noteICD(p,v)},
    {k:'dx',  t:'Diagnosis',       tx:noteDx(p,v)},
    {k:'tx',  t:'Treatment (วันนี้)',tx:noteTx(p,v)},
    {k:'plan',t:'Plan',            tx:notePlan(p,v)}
  ];
  return s.filter(x=>x.tx&&x.tx.trim());
}
function buildNote(p,v){
  return noteSections(p,v).map(s=>s.k==='head'?s.tx:`${s.t}:\n${s.tx}`).join('\n\n');
}

/* ───────── ⑩ บันทึกอัตโนมัติ + สถานะ ───────── */
let _saveTimer=null;
function markDirty(){
  if(!S.current) return;
  S.dirty=true; paintSaveState();
  clearTimeout(_saveTimer);
  _saveTimer=setTimeout(()=>autoSave(),1800);
}
async function autoSave(){
  if(!S.current||!S.dirty||S.saving) return;
  S.saving=true; paintSaveState();
  try{
    await store.save(S.current);
    S.dirty=false; S.savedAt=new Date();
  }catch(e){ console.error(e); toast('บันทึกอัตโนมัติไม่สำเร็จ','err'); }
  S.saving=false; paintSaveState();
}
async function saveNow(silent){
  clearTimeout(_saveTimer);
  if(!S.current) return;
  S.saving=true; paintSaveState();
  try{
    await store.save(S.current);
    await store.audit('บันทึกข้อมูลผู้ป่วย',S.current.hn,S.current.hn);
    S.dirty=false; S.savedAt=new Date();
    if(!silent) toast('บันทึกเรียบร้อย');
  }catch(e){ console.error(e); toast('บันทึกไม่สำเร็จ: '+e.message,'err'); }
  S.saving=false; paintSaveState();
}
function saveStateText(){
  if(!S.current) return '';
  if(S.saving) return 'กำลังบันทึก…';
  if(S.dirty) return 'ยังไม่ได้บันทึก';
  if(S.savedAt) return 'บันทึกแล้ว '+S.savedAt.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});
  return '';
}
function paintSaveState(){
  const t=saveStateText();
  document.querySelectorAll('#saveState,.savebar .st').forEach(e=>{
    e.textContent=t;
    e.className=e.classList.contains('st')?'st':(S.dirty?'dirty':(S.savedAt?'saved':''));
  });
}
window.addEventListener('beforeunload',e=>{
  if(S.dirty){ e.preventDefault(); e.returnValue=''; return ''; }
});

/** แสดงค่า Ki-67 พร้อม % — กันกรณีผู้ใช้พิมพ์ % มาเองแล้วซ้อนเป็น %% */
function fmtKi67(v){
  if(!v) return '';
  const s=String(v).trim();
  return /%$/.test(s) ? s : s+'%';
}
function inputEl(type,val,on,at={}){

function inputElLazy(type,val,on,at={}){
