<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f5c6e">
<title>BreastTrack — ระบบติดตามผู้ป่วยมะเร็งเต้านม</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f5f7f8; --surface:#fff; --line:#e3e7ea; --line2:#ccd4da;
  --ink:#18222c; --ink2:#586471; --ink3:#8b949e;
  --brand:#0f5c6e; --brand-soft:#e7f1f3; --brand-ink:#0a4351;
  --ok:#1c7a4b; --ok-soft:#e6f4ec;
  --warn:#8d5b00; --warn-soft:#fdf1da;
  --danger:#a32a21; --danger-soft:#fbe9e7;
  --r:10px; --sh:0 1px 2px rgba(16,24,32,.05),0 3px 10px rgba(16,24,32,.04);
  --navh:0px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:"Sarabun","Noto Sans Thai","Segoe UI",system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;
  padding-bottom:calc(var(--navh) + env(safe-area-inset-bottom))}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
h1,h2,h3,h4{margin:0;font-weight:650;line-height:1.3}

.topbar{position:sticky;top:0;z-index:50;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:11px;padding:9px 14px;padding-top:calc(9px + env(safe-area-inset-top))}
.brand{display:flex;align-items:center;gap:8px;font-weight:750;color:var(--brand-ink);white-space:nowrap;font-size:16px}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--brand);flex:none}
.brand .ver{font-size:10.5px;font-weight:600;color:var(--ink3);background:var(--bg);padding:1px 6px;border-radius:5px}
.nav{display:flex;gap:4px;flex-wrap:nowrap}
.nav button{background:none;border:1px solid transparent;padding:7px 13px;border-radius:8px;cursor:pointer;
  color:var(--ink2);font-weight:600;white-space:nowrap;font-size:14.5px}
.nav button:hover{background:var(--bg)}
.nav button.active{background:var(--brand-soft);color:var(--brand-ink)}
.spacer{flex:1}
.userbox{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2);white-space:nowrap}
#saveState{font-size:12px;color:var(--ink3);white-space:nowrap}
#saveState.dirty{color:var(--warn)}
#saveState.saved{color:var(--ok)}
.wrap{max-width:1180px;margin:0 auto;padding:18px}

.botnav{display:none}
@media (max-width:820px){
  :root{--navh:62px}
  .topnav-desktop{display:none!important}
  .userbox .email{display:none}
  .wrap{padding:12px}
  .botnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--surface);
    border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);
    box-shadow:0 -2px 12px rgba(16,24,32,.06)}
  .botnav button{flex:1;background:none;border:none;padding:8px 2px 9px;cursor:pointer;color:var(--ink3);
    display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;
    min-height:56px;justify-content:center}
  .botnav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;
    stroke-linecap:round;stroke-linejoin:round}
  .botnav button.active{color:var(--brand)}
}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:14px}
.card>header{padding:12px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.card>header h3{font-size:15px}
.card>.body{padding:15px}

.btn{border:1px solid var(--line2);background:var(--surface);border-radius:9px;padding:9px 15px;cursor:pointer;
  font-weight:600;white-space:nowrap;font-size:14.5px;min-height:42px}
.btn:hover{background:var(--bg)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-ink)}
.btn.danger{color:var(--danger);border-color:#e6c6c2}
.btn.danger:hover{background:var(--danger-soft)}
.btn.sm{padding:5px 11px;font-size:13.5px;min-height:34px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}

.savebar{display:none}
@media (max-width:820px){
  .savebar{display:flex;position:fixed;left:0;right:0;bottom:calc(var(--navh) + env(safe-area-inset-bottom));
    z-index:55;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:8px 12px;gap:8px;
    backdrop-filter:blur(6px);align-items:center}
  .savebar .btn{flex:1}
  .savebar .st{font-size:11.5px;color:var(--ink3);flex:none;max-width:96px;line-height:1.25}
  .has-savebar{padding-bottom:70px}
}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:13px}
.grid.two{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
@media (max-width:520px){ .grid,.grid.two{grid-template-columns:1fr} }
@media (max-width:480px){
  #installBar{flex-wrap:wrap}
  #installBar>span{flex-basis:100%}
}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label{font-size:13px;font-weight:650;color:var(--ink2)}
.field input,.field select,.field textarea{border:1px solid var(--line2);border-radius:8px;padding:9px 10px;
  background:#fff;width:100%;min-height:42px}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--brand-soft);border-color:var(--brand)}
.field textarea{min-height:66px;resize:vertical}
.hint{font-size:12.5px;color:var(--ink3)}
.calc{background:var(--brand-soft);border:1px solid #cde3e7;border-radius:8px;padding:9px 10px;
  color:var(--brand-ink);font-weight:650;min-height:42px;display:flex;align-items:center}
.sect{font-size:12.5px;font-weight:750;color:var(--ink3);letter-spacing:.05em;text-transform:uppercase;
  margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.sect:before{content:"";width:3px;height:14px;background:var(--brand);border-radius:2px}
.sect:first-child{margin-top:0}
.sub{border:1px solid var(--line);border-radius:var(--r);padding:13px;margin-bottom:11px;background:#fcfdfd}
.sub>.h{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.sub>.h .t{font-weight:700;font-size:14.5px}

.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line2);background:#fff;border-radius:999px;padding:8px 14px;cursor:pointer;
  font-size:14px;user-select:none;min-height:38px;line-height:1.4}
.chip:hover{border-color:var(--brand)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chip.on.ok{background:var(--ok);border-color:var(--ok)}
.chip.on.dg{background:var(--danger);border-color:var(--danger)}
.chip.sm{padding:5px 11px;min-height:32px;font-size:13.5px}

.numunit{display:flex;gap:7px;align-items:stretch;flex-wrap:wrap}
.stepper{display:flex;align-items:stretch;border:1px solid var(--line2);border-radius:8px;overflow:hidden;background:#fff}
.stepper button{border:none;background:#fafbfc;width:40px;cursor:pointer;font-size:19px;color:var(--brand);font-weight:700;line-height:1}
.stepper button:hover{background:var(--brand-soft)}
.stepper input{border:none;width:70px;text-align:center;font-weight:650;padding:9px 2px;min-height:42px}
.stepper input:focus{outline:none}
.numunit select{border:1px solid var(--line2);border-radius:8px;padding:0 9px;background:#fff;min-height:42px}

.clockwrap{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}
.clockbox{text-align:center;flex:1 1 200px;max-width:240px}
.clockbox h4{font-size:13px;color:var(--ink2);margin-bottom:8px;font-weight:650}
.clock{position:relative;width:100%;max-width:205px;aspect-ratio:1;margin:0 auto;border-radius:50%;
  border:2px solid var(--line2);background:#fff}
.clock .ctr{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:31%;height:31%;
  border-radius:50%;border:1px dashed var(--line2);background:#fafbfc;font-size:10.5px;display:flex;
  align-items:center;justify-content:center;cursor:pointer;color:var(--ink2);text-align:center;line-height:1.15;padding:3px}
.clock .ctr.on{background:var(--brand);color:#fff;border-color:var(--brand);border-style:solid}
.clock .hr{position:absolute;width:17.5%;height:17.5%;transform:translate(-50%,-50%);border-radius:50%;
  border:1px solid var(--line2);background:#fff;font-size:13px;cursor:pointer;display:flex;align-items:center;
  justify-content:center;font-weight:600;padding:0}
.clock .hr.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.clock .hr.dot{background:var(--brand-soft);border-color:var(--brand)}

table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;color:var(--ink3);text-transform:uppercase;letter-spacing:.03em;
  padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:hover{background:#fafbfc;cursor:pointer}
tbody tr:last-child td{border-bottom:none}
.tablewrap{overflow-x:auto}
.plist{display:flex;flex-direction:column}
.pcard{padding:13px 15px;border-bottom:1px solid var(--line);cursor:pointer}
.pcard:last-child{border-bottom:none}
.pcard:active{background:#f7f9fa}
.pcard .r1{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.pcard .nm{font-weight:700;font-size:15.5px}
.pcard .hn{font-size:13px;color:var(--ink3);font-weight:600}
.pcard .r2{margin-top:5px;font-size:13.5px;color:var(--ink2)}
.pcard .r3{margin-top:7px;display:flex;gap:6px;flex-wrap:wrap}
@media (max-width:820px){ .only-desktop{display:none!important} }
@media (min-width:821px){ .only-mobile{display:none!important} }

.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:650;white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.dg{background:var(--danger-soft);color:var(--danger)}
.badge.n{background:var(--bg);color:var(--ink2)}
.badge.b{background:var(--brand-soft);color:var(--brand-ink)}

.tl{position:relative;padding-left:24px}
.tl:before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl-item{position:relative;padding-bottom:16px}
.tl-item:before{content:"";position:absolute;left:-23px;top:5px;width:12px;height:12px;border-radius:50%;
  background:#fff;border:2px solid var(--brand)}
.tl-item.op:before{border-color:var(--danger)}
.tl-item.vs:before{border-color:var(--ok)}
.tl-item.ix:before{border-color:var(--warn)}
.tl-item.rc:before{background:var(--danger);border-color:var(--danger)}
.tl-d{font-size:12.5px;color:var(--ink3);font-weight:650}
.tl-t{font-weight:650}
.tl-s{font-size:13.5px;color:var(--ink2)}

.alert{border-radius:var(--r);padding:11px 14px;margin-bottom:10px;border:1px solid;font-size:14px}
.alert.warn{background:var(--warn-soft);border-color:#eddcb6;color:var(--warn)}
.alert.dg{background:var(--danger-soft);border-color:#ecc7c2;color:var(--danger)}
.alert.info{background:var(--brand-soft);border-color:#cde3e7;color:var(--brand-ink)}
.alert.ok{background:var(--ok-soft);border-color:#c4e3d2;color:var(--ok)}

.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login .card{max-width:400px;width:100%;margin:0}

/* กล่องข้อความสำเร็จรูปแยกหัวข้อ */
.nbox{border:1px solid var(--line2);border-radius:var(--r);margin-bottom:11px;overflow:hidden;background:#fff}
.nbox>.h{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#f7f9fa;border-bottom:1px solid var(--line)}
.nbox>.h .t{font-weight:700;font-size:13.5px;color:var(--brand-ink);letter-spacing:.02em}
.nbox>.h .spacer{flex:1}
.nbox>.tx{padding:12px;font-size:14px;white-space:pre-wrap;line-height:1.7;overflow-x:auto;
  font-variant-ligatures:none}
.nbox.en>.tx{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;font-size:13px}

.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stat .n{font-size:25px;font-weight:750;color:var(--brand-ink);line-height:1.2}
.stat .l{font-size:13px;color:var(--ink2)}
.bar{height:20px;background:var(--brand);border-radius:4px;min-width:2px}
.barrow{display:grid;grid-template-columns:minmax(90px,140px) 1fr 40px;gap:9px;align-items:center;margin-bottom:6px;font-size:13.5px}

.tabs{display:flex;gap:4px;overflow-x:auto;background:var(--surface);padding:6px;border:1px solid var(--line);
  border-radius:var(--r);margin-bottom:13px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;border:none;padding:9px 13px;border-radius:8px;cursor:pointer;color:var(--ink2);
  font-weight:650;white-space:nowrap;font-size:14px;min-height:40px}
.tabs button.active{background:var(--brand-soft);color:var(--brand-ink)}

@media print{
  .topbar,.tabs,.btnrow,.botnav,.savebar,.no-print{display:none!important}
  body{background:#fff;font-size:12px;padding:0}
  .wrap{max-width:100%;padding:0}
  .card{box-shadow:none;border:1px solid #999;page-break-inside:avoid;margin-bottom:8px}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ==========================================================================
   BreastTrack v1.2-beta — ระบบติดตามผู้ป่วยมะเร็งเต้านม
   ไฟล์เดียว: อัปเดตโดยอัปโหลดไฟล์นี้ทับไฟล์เดิมบน GitHub
   ========================================================================== */
const APP_NAME='BreastTrack', APP_VER='2.0-beta';

/* ═══════════════════════════════════════════════════════════
   v2.0 (C1) · เตรียมความพร้อมสำหรับติดตั้งบนมือถือ (PWA)
   - ทำงานได้ทั้งบน file:// (เปิดจาก PC แบบเดิม — จะข้ามส่วน SW/manifest
     ที่ browser ไม่รองรับไปเงียบๆ ไม่กระทบการใช้งานเดิม)
   - เมื่อนำไฟล์นี้ไป deploy บน https จริง ส่วนนี้จะทำให้ "เพิ่มลงหน้าจอโฮม"
     และเปิดแบบออฟไลน์ได้ทันทีโดยไม่ต้องแก้โค้ดเพิ่ม
   ═══════════════════════════════════════════════════════════ */
(function initPWA(){
  try{
    /* ── ไอคอนแอป — วาดด้วย canvas ตอนรันจริง ไม่ต้องแนบไฟล์ภาพแยก ── */
    function makeIcon(size){
      const c=document.createElement('canvas'); c.width=size; c.height=size;
      const g=c.getContext('2d');
      g.fillStyle='#0f5c6e'; g.fillRect(0,0,size,size);
      /* โบว์ชมพูอย่างง่าย เป็นสัญลักษณ์มะเร็งเต้านม */
      g.strokeStyle='#f2a7c3'; g.lineWidth=size*0.09; g.lineCap='round';
      const cx=size/2, top=size*0.24, midY=size*0.52, botY=size*0.82, spread=size*0.17;
      g.beginPath(); g.moveTo(cx,top); g.lineTo(cx-spread,midY); g.lineTo(cx,botY); g.stroke();
      g.beginPath(); g.moveTo(cx,top); g.lineTo(cx+spread,midY); g.lineTo(cx,botY); g.stroke();
      return c.toDataURL('image/png');
    }
    const icon192=makeIcon(192), icon512=makeIcon(512);
    const addLink=(rel,href,extra)=>{
      const l=document.createElement('link'); l.rel=rel; l.href=href;
      if(extra) Object.entries(extra).forEach(([k,v])=>l.setAttribute(k,v));
      document.head.appendChild(l);
    };
    addLink('icon',icon192);
    addLink('apple-touch-icon',icon192);

    /* ── manifest — สร้างเป็น Blob URL แนบกับหน้า (ไม่ต้องมีไฟล์ .webmanifest แยก) ── */
    const manifest={
      name:APP_NAME+' — ระบบติดตามผู้ป่วยมะเร็งเต้านม',
      short_name:APP_NAME,
      start_url:'./',
      scope:'./',
      display:'standalone',
      background_color:'#f5f7f8',
      theme_color:'#0f5c6e',
      lang:'th',
      icons:[{src:icon192,sizes:'192x192',type:'image/png'},
             {src:icon512,sizes:'512x512',type:'image/png'}]
    };
    const mBlob=new Blob([JSON.stringify(manifest)],{type:'application/manifest+json'});
    addLink('manifest',URL.createObjectURL(mBlob));

    /* ── Service Worker — ลงทะเบียนผ่าน Blob URL (ใช้ได้แม้ไม่มีไฟล์ .js แยก)
         ทำงานเฉพาะบน https/localhost เท่านั้น — เบราว์เซอร์ปิดสิทธิ์นี้บน file:// เอง
         (จึงใช้ไฟล์เดิมแบบเปิดจาก PC โดยตรงได้ตามปกติ ไม่มีผลกระทบ) ── */
    if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){
      const swSrc=`
        const CACHE='breasttrack-${APP_VER}';
        self.addEventListener('install',e=>{ self.skipWaiting(); });
        self.addEventListener('activate',e=>{
          e.waitUntil(caches.keys().then(ks=>Promise.all(
            ks.filter(k=>k!==CACHE).map(k=>caches.delete(k))
          )).then(()=>self.clients.claim()));
        });
        self.addEventListener('fetch',e=>{
          const req=e.request; if(req.method!=='GET') return;
          if(req.mode==='navigate'){
            /* หน้าเว็บหลัก: พยายามโหลดสดก่อน ถ้าไม่มีเน็ตค่อยใช้ฉบับที่เคยเปิดไว้ */
            e.respondWith(fetch(req).then(res=>{
              caches.open(CACHE).then(c=>c.put(req,res.clone())); return res;
            }).catch(()=>caches.match(req).then(r=>r||caches.match('./'))));
            return;
          }
          /* ไฟล์ประกอบ (เช่น xlsx library): ใช้ของที่แคชไว้ก่อน เร็วกว่าและใช้ได้ตอนออฟไลน์ */
          e.respondWith(caches.match(req).then(cached=>cached||fetch(req).then(res=>{
            if(res&&res.ok) caches.open(CACHE).then(c=>c.put(req,res.clone()));
            return res;
          }).catch(()=>cached)));
        });
      `;
      const swBlob=new Blob([swSrc],{type:'application/javascript'});
      navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(()=>{});
    }

    /* ── ปุ่ม "ติดตั้งแอปนี้" (Android/Desktop Chrome) ── */
    window.addEventListener('beforeinstallprompt',e=>{
      e.preventDefault(); window.__installPrompt=e;
      const bar=document.getElementById('installBar'); if(bar) bar.style.display='flex';
    });
    window.addEventListener('appinstalled',()=>{ window.__installPrompt=null;
      const bar=document.getElementById('installBar'); if(bar) bar.style.display='none'; });

    /* ── iOS Safari ไม่รองรับ beforeinstallprompt — บอกวิธีติดตั้งเองครั้งเดียว ── */
    const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
    const standalone=window.navigator.standalone===true||window.matchMedia('(display-mode: standalone)').matches;
    window.__showIOSInstallHint = isIOS && !standalone && !localStorage.getItem('bt_ios_hint_dismissed');
  }catch(e){ console.warn('PWA setup skipped:',e.message); }
})();

/* ───────── ① ตั้งค่า FIREBASE (แก้เฉพาะตรงนี้) ───────── */

/* เว้นว่าง = โหมดทดลอง (เก็บข้อมูลในเครื่องนี้เท่านั้น) */

/* ───────── ② ชุดตัวเลือก ───────── */

function fmtDate(iso){
  if(!iso) return "—";
  const d=new Date(iso); if(isNaN(d)) return "—";
  return d.toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'});
}
function fmtDateEN(iso){
  if(!iso) return "-";
  const d=new Date(iso); if(isNaN(d)) return "-";
  return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
}
function ageAt(dob,at){
  if(!dob) return null;
  const b=new Date(dob), a=at?new Date(at):new Date();
  if(isNaN(b)||isNaN(a)||a<b) return null;
  let y=a.getFullYear()-b.getFullYear(), m=a.getMonth()-b.getMonth();
  if(a.getDate()<b.getDate()) m--;
  if(m<0){y--;m+=12;}
  return {y,m,text:`${y} ปี ${m} เดือน`};
}
const ageText=(dob,at)=>{const a=ageAt(dob,at);return a?a.text:"—";};
function monthsBetween(a,b){
  if(!a||!b) return null;
  const x=new Date(a),y=new Date(b); if(isNaN(x)||isNaN(y)) return null;
  return (y.getFullYear()-x.getFullYear())*12+(y.getMonth()-x.getMonth());
}
function daysBetween(a,b){
  if(!a||!b) return null;
  const x=new Date(a),y=new Date(b); if(isNaN(x)||isNaN(y)) return null;
  return Math.round((y-x)/86400000);
}
function addMonths(iso,n){ if(!iso) return ""; const d=new Date(iso); if(isNaN(d)) return "";
  d.setMonth(d.getMonth()+n); return d.toISOString().slice(0,10); }
function addDays(iso,n){ if(!iso) return ""; const d=new Date(iso); if(isNaN(d)) return "";
  d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function durText(v,u){ return (v===''||v==null)?'':`${v} ${u||'เดือน'}`; }
function durTextEN(v,u){
  if(v===''||v==null) return '';
  const m={'วัน':'day','สัปดาห์':'week','เดือน':'month','ปี':'year'}[u]||'month';
  return `${v} ${m}${parseFloat(v)>1?'s':''}`;
}
function durMonths(v,u){
  const n=parseFloat(v); if(isNaN(n)) return null;
  return n*({'วัน':1/30,'สัปดาห์':7/30,'เดือน':1,'ปี':12}[u]||1);
}
function toast(msg,type){

  el.style.cssText=`position:fixed;bottom:${window.innerWidth<=820?'86px':'22px'};left:50%;
    transform:translateX(-50%);z-index:300;background:${type==='err'?'#a32a21':'#18222c'};color:#fff;

function locLabel(code){
  if(!code) return "";
  const side=code[0]==='R'?'ขวา':'ซ้าย', rest=code.slice(1);
  if(rest==='SA') return `Sub-areolar ${side}`;
  if(rest==='WB') return `Whole breast ${side}`;
  return `${side} ${rest} นาฬิกา`;
}
function locLabelEN(code){
  if(!code) return "";
  const side=code[0]==='R'?'right':'left', rest=code.slice(1);
  if(rest==='SA') return `sub-areolar region of the ${side} breast`;
  if(rest==='WB') return `whole ${side} breast`;
  return `${rest} o'clock position of the ${side} breast`;
}
function locListText(arr,dist){
  if(!arr||!arr.length) return "—";
  return arr.map(c=>{
    const d=dist&&dist[c]!==undefined&&dist[c]!==''?` ห่างหัวนม ${dist[c]} ซม.`:'';
    return `${c} (${locLabel(c)})${d}`;
  }).join(", ");
}

/* quadrant จากตำแหน่งนาฬิกา */
function quadrantOf(code){
  if(!code) return null;
  const side=code[0], rest=code.slice(1);
  if(rest==='SA') return 'central';
  if(rest==='WB') return 'overlap';
  const h=parseInt(rest,10); if(isNaN(h)) return null;
  if(side==='R'){
    if([1,2,3].includes(h)) return 'UI';
    if([4,5,6].includes(h)) return 'LI';
    if([7,8,9].includes(h)) return 'LO';
    return 'UO';                       // 10,11,12
  }
  if([9,10,11].includes(h)) return 'UI';
  if([6,7,8].includes(h)) return 'LI';
  if([3,4,5].includes(h)) return 'LO';
  return 'UO';                         // 12,1,2
}
const QUAD_TH={UI:'Upper-inner quadrant',LI:'Lower-inner quadrant',LO:'Lower-outer quadrant',
  UO:'Upper-outer quadrant',central:'Central portion / sub-areolar',overlap:'Overlapping sites'};

/* ───────── ④ ที่เก็บข้อมูล ───────── */
const store={
  mode:'local',db:null,auth:null,user:null,A:null,F:null,
  async init(){
    if(!FIREBASE_CONFIG.apiKey){this.mode='local';return 'local';}
    try{
      const [appM,authM,fsM]=await Promise.all([
        import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js'),
        import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js'),
        import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js')]);
      const app=appM.initializeApp(FIREBASE_CONFIG);
      this.auth=authM.getAuth(app); this.db=fsM.getFirestore(app);
      try{ await fsM.enableIndexedDbPersistence(this.db); }catch(e){}
      this.A=authM; this.F=fsM; this.mode='cloud'; return 'cloud';
    }catch(e){ console.error(e); this.mode='local'; return 'local'; }
  },
  onAuth(cb){
    if(this.mode==='cloud') this.A.onAuthStateChanged(this.auth,u=>{this.user=u;cb(u);});
    else{ this.user=this.get('bt_user',null); cb(this.user); }
  },
  async signIn(e,p){ if(this.mode==='cloud') await this.A.signInWithEmailAndPassword(this.auth,e,p);
    else{ this.user={email:e,uid:'local'}; this.set('bt_user',this.user); } },
  async signUp(e,p){ if(this.mode==='cloud') await this.A.createUserWithEmailAndPassword(this.auth,e,p);
    else{ this.user={email:e,uid:'local'}; this.set('bt_user',this.user); } },
  async signOut(){ if(this.mode==='cloud') await this.A.signOut(this.auth);
    else{ this.user=null; this.set('bt_user',null); location.reload(); } },
  async list(){
    if(this.mode==='cloud'){
      const s=await this.F.getDocs(this.F.collection(this.db,'patients'));
      return s.docs.map(d=>migrate({...d.data(),id:d.id}));
    }
    return (this.get('bt_patients',[])||[]).map(migrate);
  },
  async save(p){
    p.updatedAt=new Date().toISOString(); p.updatedBy=this.user?.email||''; p.ver=APP_VER;
    if(!p.createdAt) p.createdAt=p.updatedAt;
    /* ไม่เก็บชื่อผู้ป่วยลงฐานข้อมูล เว้นแต่เปิดโหมดเก็บชื่อไว้ */
    if(this.get('bt_storeNames',false)!==true) p.name='';
    if(this.mode==='cloud'){ const {id,...d}=p; await this.F.setDoc(this.F.doc(this.db,'patients',id),d); }
    else{
      const all=this.get('bt_patients',[])||[];
      const i=all.findIndex(x=>x.id===p.id);
      if(i>=0) all[i]=p; else all.push(p);
      this.set('bt_patients',all);
    }
  },
  async remove(id){
    if(this.mode==='cloud') await this.F.deleteDoc(this.F.doc(this.db,'patients',id));
    else this.set('bt_patients',(this.get('bt_patients',[])||[]).filter(x=>x.id!==id));
  },
  async audit(action,detail,hn){
    const r={id:uid(),at:new Date().toISOString(),by:this.user?.email||'-',action,detail:detail||'',hn:hn||''};
    if(this.mode==='cloud'){ try{ await this.F.setDoc(this.F.doc(this.db,'audit',r.id),r);}catch(e){} }
    else{ const a=this.get('bt_audit',[])||[]; a.unshift(r); this.set('bt_audit',a.slice(0,500)); }
  },
  async auditList(){
    if(this.mode==='cloud'){
      try{ const q=this.F.query(this.F.collection(this.db,'audit'),this.F.orderBy('at','desc'),this.F.limit(200));
        const s=await this.F.getDocs(q); return s.docs.map(d=>d.data()); }catch(e){ return []; }
    }
    return this.get('bt_audit',[])||[];
  },
  _mem:{},
  get(k,def=null){ try{const r=localStorage.getItem(k);return r===null?def:JSON.parse(r);}
    catch(e){return this._mem[k]!==undefined?this._mem[k]:def;} },
  set(k,v){ try{localStorage.setItem(k,JSON.stringify(v));}catch(e){this._mem[k]=v;} return v; }
};
