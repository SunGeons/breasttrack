function normImp(o){
  const p=blankPatient();
  const g=(...k)=>{for(const x of k){if(o[x]!==undefined&&o[x]!=='')return String(o[x]).trim();}return '';};
  const dt=v=>{
    if(!v) return '';
    if(typeof v==='number'){const d=new Date(Math.round((v-25569)*86400000));return d.toISOString().slice(0,10);}
    const s=String(v).trim();
    const m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
    if(m){let y=+m[3]; if(y>2400)y-=543; return `${y}-${String(+m[2]).padStart(2,'0')}-${String(+m[1]).padStart(2,'0')}`;}
    const d=new Date(s); return isNaN(d)?'':d.toISOString().slice(0,10);
  };
  p.hn=g('hn','HN'); p.name=''; /* ไม่นำเข้าชื่อผู้ป่วย */ p.sex=g('sex','เพศ')||'หญิง';
  p.dob=dt(o.dob||o.DOB||o['วันเกิด']); p.dxDate=dt(o.dxDate||o['วันที่วินิจฉัย']);
  const impSt=g('status','สถานะ'); if(impSt&&['เสียชีวิต','ขาดการติดตาม'].includes(impSt)) p.statusManual=impSt;
  const sy=g('symptoms','symptom','อาการ');
  if(sy) p.hx.symptoms=sy.split(/[,;|]+/).map(x=>x.trim()).filter(Boolean);
  p.hx.durValue=g('durValue','duration'); p.hx.durUnit=g('durUnit')||'เดือน';
  p.hx.clinSize=g('clinSize','sizeCm','size','ขนาด');
  p.hx.locations=(g('locations','location','ตำแหน่ง')||'').split(/[,;\s]+/)
    .filter(x=>/^[RL](\d{1,2}|SA|WB)$/i.test(x)).map(x=>x.toUpperCase());
  const nd=g('nippleDistance','distance');
  if(nd&&p.hx.locations.length) p.hx.locations.forEach(c=>p.hx.locDist[c]=nd);
  p.stage.cTManual=g('cT','T'); p.stage.cNManual=g('cN','N'); p.stage.cM=g('cM','M')||'M0';
  p.stage.cStageManual=g('cStage','stage','ระยะ');
  p.stage.pTManual=g('pT'); p.stage.pNManual=g('pN');
  p.stage.pStageManual=g('pStage');
  const hist=g('histology'), grd=g('grade'), er=g('er','ER'), pr=g('pr','PR'),
        her2=g('her2','HER2'), ki=g('ki67','Ki67');
  if(hist||grd||er||pr||her2||ki){
    const np=blankPath(g('surgeryDate')?'Definitive surgery':'CNB');
    np.date=dt(o.surgeryDate)||p.dxDate; np.resultDate=np.date;
    np.histology=hist; np.grade=grd; np.er=er; np.pr=pr; np.her2=her2; np.ki67=ki;
    np.pathSize=g('pathSize'); np.margin=g('margin');
    np.nodesTotal=g('nodesTotal'); np.nodesPos=g('nodesPos');
    p.paths.push(np);
  }
  p.tx.breastSurgery.type=g('breastSurgery','surgeryType','surgery');
  p.tx.breastSurgery.date=dt(o.surgeryDate||o.breastSurgeryDate||o['วันที่ผ่าตัด']);
  p.tx.breastSurgery.side=g('side','ข้าง');
  p.tx.breastSurgery.reconstruction=g('reconstruction')||'ไม่ได้ทำ';
  p.tx.axSurgery.type=g('axSurgery','axilla')||'ไม่ได้ทำ';
  p.tx.axSurgery.date=p.tx.breastSurgery.date;
  p.tx.chemo.regimen=g('chemoRegimen','chemo'); p.tx.chemo.cycles=g('cycles');
  p.tx.chemo.timing=g('chemoTiming')||'Adjuvant';
  if(p.tx.chemo.timing==='Neoadjuvant') p.stage.pPrefix='yp';
  p.tx.endocrine.drug=g('endocrine','hormone')||'ไม่ได้รับ';
  p.tx.endocrine.start=dt(o.endocrineStart);
  p.nextAppt=dt(o.nextAppt||o['นัดถัดไป']);
  const lmm=dt(o.lastMammo||o.mammogram);
  if(lmm){ const nm=blankMammo(); nm.date=lmm; nm.impression='(นำเข้าจากไฟล์)'; p.mammos.push(nm); }
  const fam=g('familyHx','familyHistory','ประวัติครอบครัว');
  if(fam){
    p.familyHx.none=/^ไม่มี/.test(fam);
    if(!p.familyHx.none) OPT.famCancer.forEach(c=>{
      if(fam.includes(c.replace('มะเร็ง',''))) p.familyHx.types.push(c); });
  }
  return p;
}
/* ═══════════════════════════════════════════════════════════
   รวมข้อมูล (merge) สำหรับการทยอยนำเข้าทีละส่วน
   - รายการที่มี id ตรงกัน → อัปเดตทับ
   - รายการที่ "คีย์ธรรมชาติ" ตรงกัน (วันที่+ชนิด) → อัปเดตทับ
   - รายการใหม่ → เพิ่มเข้าไป
   - ของเดิมที่ไม่ได้ส่งมา → คงไว้ ไม่ลบ
   ═══════════════════════════════════════════════════════════ */
function mergeList(existing,incoming,keyFn){
  const out=[...(existing||[])];
  (incoming||[]).forEach(ni=>{
    let i=ni.id?out.findIndex(x=>x.id===ni.id):-1;
    if(i<0){ const k=keyFn(ni); if(k) i=out.findIndex(x=>keyFn(x)===k); }
    if(i>=0){
      /* อัปเดตเฉพาะฟิลด์ที่ส่งมาและมีค่า — ไม่ล้างของเดิม */
      Object.keys(ni).forEach(f=>{
        const v=ni[f];
        if(v===''||v==null) return;
        if(Array.isArray(v)&&!v.length) return;
        if(f==='id') return;
        out[i][f]=v;
      });
    }else{
      out.push({...ni,id:ni.id||uid()});
    }
  });
  return out;
}
/** คีย์รวมข้อมูล — รวมตำแหน่งด้วย เพื่อไม่ให้รายการคนละตำแหน่งในวันเดียวกันถูกมองว่าเป็นรายการเดียวกัน */
const K_PATH =x=>x?`${x.date||''}|${x.kind||''}|${(x.locations||[]).slice().sort().join(',')}`:'';
const K_MAM  =x=>x?`${x.date||''}|${x.modality||''}|${(x.locations||[]).slice().sort().join(',')}`:'';
const K_OI   =x=>x?`${x.date||''}|${x.modality||''}|${(x.sites||[]).slice().sort().join(',')}`:'';
const K_GYN  =x=>x?`${x.date||''}|${x.type||''}`:'';
const K_REC  =x=>x?`${x.date||''}|${x.type||''}`:'';
const K_VISIT=x=>x?`${x.date||''}`:'';
const K_REL  =x=>x?`${x.relation||''}|${x.cancer||''}`:'';

/** รวมข้อมูลผู้ป่วยรายใหม่เข้ากับของเดิม โดยไม่ลบข้อมูลที่ไม่ได้ส่งมา */
function mergePatient(ex,ni){
  const R={changed:[]};
  /* ฟิลด์ระดับบน — เขียนทับเฉพาะที่ส่งมาและมีค่า */
  ['sex','dob','dxDate','nextAppt','statusManual','comorbidOther'].forEach(f=>{
    if(ni[f]) { if(ex[f]!==ni[f]) R.changed.push(f); ex[f]=ni[f]; }
  });
  if((ni.comorbid||[]).length) ex.comorbid=ni.comorbid;

  /* hx — รวมทีละฟิลด์ */
  const h=ni.hx||{}, eh=ex.hx;
  ['symptomOther','durValue','durUnit','clinSize'].forEach(f=>{ if(h[f]) eh[f]=h[f]; });
  if(h.noSymptom) eh.noSymptom=true;
  ['symptoms','locations','invasion','clinNodes'].forEach(f=>{
    if((h[f]||[]).length) eh[f]=[...new Set([...(eh[f]||[]),...h[f]])];
  });
  if(h.locDist) Object.assign(eh.locDist,h.locDist);

  /* familyHx */
  const nf=ni.familyHx||{};
  if(nf.none===false||((nf.types||[]).length)||((nf.relatives||[]).length)){
    ex.familyHx.none=false;
    if((nf.types||[]).length) ex.familyHx.types=[...new Set([...(ex.familyHx.types||[]),...nf.types])];
    ex.familyHx.relatives=mergeList(ex.familyHx.relatives,nf.relatives,K_REL);
  }

  /* stage — เขียนทับเฉพาะที่ส่งมา */
  const ns=ni.stage||{};
  Object.keys(ns).forEach(f=>{ if(ns[f]&&ns[f]!=='ไม่ประเมิน'&&ns[f]!=='ไม่ระบุ') ex.stage[f]=ns[f]; });

  /* tx — รวมเป็นราย sub-object */
  const nt=ni.tx||{};
  ['breastSurgery','axSurgery','chemo','rt','endocrine'].forEach(g=>{
    if(!nt[g]) return;
    Object.keys(nt[g]).forEach(f=>{
      const v=nt[g][f];
      if(v&&v!=='ไม่ได้รับ'&&v!=='ไม่ได้ทำ'&&v!=='ไม่ได้ผ่าตัด') ex.tx[g][f]=v;
    });
  });
  if(nt.drainOut) ex.tx.drainOut=nt.drainOut;

  /* รายการต่างๆ — รวมโดยไม่ลบของเดิม */
  const before={paths:(ex.paths||[]).length,mammos:(ex.mammos||[]).length,
    otherImg:(ex.otherImg||[]).length,gyn:(ex.gyn||[]).length,
    recurrences:(ex.recurrences||[]).length,visits:(ex.visits||[]).length};
  ex.paths      = mergeList(ex.paths,ni.paths,K_PATH);
  ex.mammos     = mergeList(ex.mammos,ni.mammos,K_MAM);
  ex.otherImg   = mergeList(ex.otherImg,ni.otherImg,K_OI);
  ex.gyn        = mergeList(ex.gyn,ni.gyn,K_GYN);
  ex.recurrences= mergeList(ex.recurrences,ni.recurrences,K_REC);
  ex.visits     = mergeList(ex.visits,ni.visits,K_VISIT);
  R.added={paths:(ex.paths||[]).length-before.paths,
    mammos:(ex.mammos||[]).length-before.mammos,
    otherImg:(ex.otherImg||[]).length-before.otherImg,
    gyn:(ex.gyn||[]).length-before.gyn,
    recurrences:(ex.recurrences||[]).length-before.recurrences,
    visits:(ex.visits||[]).length-before.visits};
  return R;
}
/** v2.0 (M10) — สำรองข้อมูลปัจจุบันลงไฟล์ก่อนแตะข้อมูลใดๆ */
function autoBackup(reason){
  try{
    if(!S.patients.length) return false;
    dl(new Blob([JSON.stringify({app:APP_NAME,ver:APP_VER,backupOf:reason,
      exportedAt:new Date().toISOString(),count:S.patients.length,patients:S.patients},null,2)],
      {type:'application/json'}), `backup-ก่อน${reason}-${todayISO()}.json`);
    markBackedUp();
    return true;
  }catch(e){ console.error('backup failed',e); return false; }
}
async function doImport(file,mode){
  const log=$('#impLog');
  if(!file){ log.innerHTML='<div class="alert dg">กรุณาเลือกไฟล์</div>'; return; }
  const backedUp=autoBackup('นำเข้า');
  try{
    let inc=[];
    if(/\.json$/i.test(file.name)){
      const data=JSON.parse(await file.text());
      const arr=Array.isArray(data)?data:(data.patients||[]);
      const fv=(data&&data.ver)||'';
      if(fv&&parseFloat(fv)>parseFloat(APP_VER)&&
         !confirm(`ไฟล์นี้มาจากเวอร์ชัน ${fv} ซึ่งใหม่กว่าโปรแกรม (v${APP_VER})\nข้อมูลบางส่วนอาจหายไป — ดำเนินการต่อ?`)) return;
      inc=arr.map(o=>(o.dx||o.hx||o.tx)?migrate(o):normImp(o));
    }else{
      const wb=XLSX.read(await file.arrayBuffer(),{cellDates:false});
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
      inc=rows.map(normImp).filter(p=>p.hn);
    }
    if(!inc.length){ log.innerHTML='<div class="alert warn">ไม่พบข้อมูลที่นำเข้าได้</div>'; return; }
    let added=0,upd=0,dupWarn=[],mergeLog=[];
    if(mode==='ล้างข้อมูลเดิมทั้งหมดแล้วนำเข้าใหม่'){
      if(!confirm(`ยืนยันลบข้อมูลเดิมทั้งหมด ${S.patients.length} ราย แล้วนำเข้าใหม่ ${inc.length} ราย?`)) return;
      for(const p of S.patients) await store.remove(p.id);
      S.patients=[];
    }
    for(const np of inc){
      const ex=np.hn?S.patients.find(x=>x.hn===np.hn):null;
      if(ex&&mode==='รวมข้อมูลเข้ากับเคสเดิม (HN ซ้ำ)'){
        const r=mergePatient(ex,np);
        const a=r.added, det=Object.entries(a).filter(([,n])=>n>0)
          .map(([k,n])=>`${({paths:'ผลชิ้นเนื้อ',mammos:'ภาพเต้านม',otherImg:'CT/US',
            gyn:'นรีเวช',recurrences:'กลับเป็นซ้ำ',visits:'การตรวจ'})[k]} +${n}`).join(', ');
        mergeLog.push(`HN ${np.hn}: ${det||'อัปเดตข้อมูลพื้นฐาน'}`);
        await store.save(ex); upd++;
      }else{
        if(ex) dupWarn.push(np.hn);
        np.id=np.id||uid(); S.patients.push(np); await store.save(np); added++;
      }
    }
    /* M11 — visit ที่มาจากการนำเข้าไม่เคยมี snapshot ทำให้ตรวจสอบย้อนหลังไม่ได้ */
    let snMade=0;
    for(const p of S.patients){
      let ch=false;
      (p.visits||[]).forEach(v=>{ if(!v.snapshot){ v.snapshot=makeSnapshot(p,v); snMade++; ch=true; } });
      if(ch) await store.save(p);
    }
    await store.audit('นำเข้าข้อมูล',`${file.name} — เพิ่ม ${added}, อัปเดต ${upd}, snapshot +${snMade}`);
    log.innerHTML=(backedUp?`<div class="alert info">ดาวน์โหลดไฟล์สำรองข้อมูลเดิมให้แล้วก่อนนำเข้า — ถ้าผลไม่ถูกต้อง นำไฟล์นั้นกลับเข้ามาได้</div>`:'')+
      `<div class="alert ok">นำเข้าสำเร็จ — เพิ่มใหม่ ${added} ราย, รวมเข้าเคสเดิม ${upd} ราย</div>`+
      (mergeLog.length?`<div class="alert info"><strong>รายละเอียดการรวมข้อมูล</strong><br>${mergeLog.map(x=>esc(x)).join('<br>')}</div>`:'')+
      (dupWarn.length?`<div class="alert warn">พบ HN ซ้ำกับที่มีอยู่ ${dupWarn.length} ราย: ${esc(dupWarn.slice(0,10).join(', '))} — ตรวจสอบว่าเป็นคนเดียวกันหรือไม่</div>`:'');
    toast('นำเข้าข้อมูลเรียบร้อย');
  }catch(e){
    console.error(e);
    log.innerHTML=`<div class="alert dg">นำเข้าไม่สำเร็จ: ${esc(e.message)}</div>`;
  }
}
function dl(blob,name){
  const a=el('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
/** v2.0 (C6) — จำเวลาที่สำรองข้อมูลล่าสุดไว้ใน localStorage (ใช้เตือนถ้าห่างไปนาน) */
function markBackedUp(){ try{ localStorage.setItem('bt_last_backup',new Date().toISOString()); }catch(e){} }
function lastBackupAt(){ try{ return localStorage.getItem('bt_last_backup'); }catch(e){ return null; } }
function exportJSON(){
  dl(new Blob([JSON.stringify({app:APP_NAME,ver:APP_VER,exportedAt:new Date().toISOString(),
    count:S.patients.length,patients:S.patients},null,2)],{type:'application/json'}),
    `breasttrack-${todayISO()}.json`);
  store.audit('ส่งออกข้อมูล','JSON');
  markBackedUp();
}

    };

  const V=[],B=[],M=[],F=[],R=[],OI=[],GY=[],BN=[],TG=[],TD=[];

  XLSX.writeFile(wb,`breasttrack-${todayISO()}.xlsx`);
  store.audit('ส่งออกข้อมูล','Excel');

/* ───────── ⑳ เริ่มระบบ ───────── */
async function boot(){
  $('#app').innerHTML='<div class="login"><div class="hint">กำลังเริ่มระบบ…</div></div>';
  await store.init();
  store.onAuth(async user=>{
    if(!user){ renderLogin(); return; }
    $('#app').innerHTML='<div class="login"><div class="hint">กำลังโหลดข้อมูล…</div></div>';
    try{ S.patients=await store.list(); }
    catch(e){
      console.error(e);
      $('#app').innerHTML=`<div class="login"><div class="card"><div class="body">
        <div class="alert dg">โหลดข้อมูลไม่สำเร็จ: ${esc(e.message)}<br><br>
        กรุณาตรวจสอบ Firestore Security Rules ว่าอนุญาตให้ผู้ใช้ที่ล็อกอินแล้วอ่าน/เขียนได้</div>
        <button class="btn" onclick="location.reload()">ลองใหม่</button></div></div></div>`;
      return;
    }
    render();
  });
}
boot();
